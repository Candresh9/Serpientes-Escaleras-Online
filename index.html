    grid-template-rows:
        repeat(10, 1fr);

    background: #f8fafc;

    z-index: 1;

    font-weight: bold;

}


.casilla:nth-child(odd) {

}


.casilla:nth-child(even) {

}


.numero {

    );

   SVG
   ========================================================== */

#elementosJuego {

   ANIMACIÓN
   ========================================================== */

   ESCALERAS
   ========================================================== */

.escalera {

    stroke-width: 1.2;

    stroke-linecap: round;

}


.escalon {

    stroke: #f59e0b;

    stroke-width: .9;

    stroke-linecap: round;

}


/* ==========================================================
   SERPIENTES
   ========================================================== */

.serpiente {

    stroke: #16a34a;

    stroke-width: 2.5;

    stroke-linecap: round;

    stroke-linejoin: round;

}


.serpiente-cabeza {

   FICHAS
   ========================================================== */

.fichas {

    );

.ficha3 {

/* ==========================================================
   FICHA ANIMADA
   ========================================================== */

.ficha-animada {

/* ==========================================================
   EFECTOS
   ========================================================== */

.efecto-escalera {

    animation:
        brilloEscalera
        .7s
        ease-in-out
        infinite alternate;

}


@keyframes brilloEscalera {

    from {

        opacity: .5;

        filter:
            drop-shadow(
                0 0 0px #facc15
            );

    }

    to {

        opacity: 1;

        filter:
            drop-shadow(
                0 0 5px #facc15
            );

    }

}


.efecto-serpiente {

    animation:
        serpienteSacude
        .18s
        ease-in-out
        5;

}


@keyframes serpienteSacude {

    0% {
        transform: translateX(0);
    }

    25% {
        transform: translateX(-1px);
    }

    50% {
        transform: translateX(1px);
    }

    75% {
        transform: translateX(-1px);
    }

    100% {
        transform: translateX(0);
    }

}


/* ==========================================================
   TEXTO DE EFECTO
   ========================================================== */

#mensajeAnimacion {

    );

    25% {

        opacity: 1;

        transform:

    }

    70% {

        transform:

    }

    100% {

// ==========================================================

function crearTablero() {

    tablero.innerHTML = "";


    for (
        let fila = 0;
        fila < 10;
        fila++
    ) {

        const numeros = [];

        const numeroInicial =
            100 -
            fila * 10;


        if (
            fila % 2 === 0
        ) {

            for (
                let n = numeroInicial;
                n > numeroInicial - 10;
                n--
            ) {

                numeros.push(n);

            }

        }

        else {

            for (
                let n =
                    numeroInicial - 9;

                n <= numeroInicial;

                n++
            ) {

                numeros.push(n);

            }

        }


        numeros.forEach(
            numero => {

                const casilla =
                    document.createElement(
                        "div"
                    );

                casilla.className =
                    "casilla";

                casilla.id =
                    "casilla-" +
                    numero;


                const numeroElemento =
                    document.createElement(
                        "div"
                    );

                numeroElemento.className =
                    "numero";

                numeroElemento.textContent =
                    numero;


                casilla.appendChild(
                    numeroElemento
                );


                const fichas =
                    document.createElement(
                        "div"
                    );

                fichas.className =
                    "fichas";

                fichas.id =
                    "fichas-" +
                    numero;


                casilla.appendChild(
                    fichas
                );


                tablero.appendChild(
                    casilla
                );

            }
        );

    }

}


// ==========================================================
// COORDENADAS DE CASILLA
// ==========================================================

function posicionCasilla(
    numero
) {

    const indice =
        numero - 1;


    const fila =
        Math.floor(
            indice / 10
        );


    let columna =
        indice % 10;


    if (
        fila % 2 === 1
    ) {

        columna =
            9 - columna;

    }


    const x =
        columna * 10 + 5;


    const y =
        95 -
        fila * 10;


    return {

        x: x,

        y: y

    };

}


// ==========================================================
// LÍNEA SVG
// ==========================================================

function crearLinea(
    x1,
    y1,
    x2,
    y2,
    clase
) {

    const linea =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "line"
        );


    linea.setAttribute(
        "x1",
        x1
    );

    linea.setAttribute(
        "y1",
        y1
    );

    linea.setAttribute(
        "x2",
        x2
    );

    linea.setAttribute(
        "y2",
        y2
    );


    linea.setAttribute(
        "class",
        clase
    );


    elementosJuego.appendChild(
        linea
    );

}


// ==========================================================
// ESCALERA
// ==========================================================

function dibujarEscalera(
    desde,
    hasta
) {

    const inicio =
        posicionCasilla(
            desde
        );


    const fin =
        posicionCasilla(
            hasta
        );


    const dx =
        fin.x -
        inicio.x;


    const dy =
        fin.y -
        inicio.y;


    const longitud =
        Math.sqrt(
            dx * dx +
            dy * dy
        );


    if (
        longitud === 0
    ) {

        return;

    }


    const px =
        -dy /
        longitud *
        1.2;


    const py =
        dx /
        longitud *
        1.2;


    crearLinea(
        inicio.x + px,
        inicio.y + py,
        fin.x + px,
        fin.y + py,
        "escalera"
    );


    crearLinea(
        inicio.x - px,
        inicio.y - py,
        fin.x - px,
        fin.y - py,
        "escalera"
    );


    const cantidad =
        Math.max(
            4,
            Math.floor(
                longitud / 5
            )
        );


    for (
        let i = 1;
        i < cantidad;
        i++
    ) {

        const t =
            i /
            cantidad;


        const cx =
            inicio.x +
            dx * t;


        const cy =
            inicio.y +
            dy * t;


        crearLinea(
            cx + px,
            cy + py,
            cx - px,
            cy - py,
            "escalon"
        );

    }

}


// ==========================================================
// SERPIENTE
// ==========================================================

function dibujarSerpiente(
    desde,
    hasta
) {

    const inicio =
        posicionCasilla(
            desde
        );


    const fin =
        posicionCasilla(
            hasta
        );


    const dx =
        fin.x -
        inicio.x;


    const dy =
        fin.y -
        inicio.y;


    const distancia =
        Math.sqrt(
            dx * dx +
            dy * dy
        );


    if (
        distancia === 0
    ) {

        return;

    }


    const px =
        -dy /
        distancia;


    const py =
        dx /
        distancia;


    const amplitud = 2.5;


    const segmentos =
        Math.max(
            8,
            Math.floor(
                distancia / 4
            )
        );


    let puntos = [];


    for (
        let i = 0;
        i <= segmentos;
        i++
    ) {

        const t =
            i /
            segmentos;


        const onda =
            Math.sin(
                t *
                Math.PI *
                3
            ) *
            amplitud *
            (
                .3 +
                Math.sin(
                    t *
                    Math.PI
                )
            );


        puntos.push({

            x:
                inicio.x +
                dx * t +
                px * onda,

            y:
                inicio.y +
                dy * t +
                py * onda

        });

    }


    let pathData = "";


    puntos.forEach(
        (punto, indice) => {

            if (
                indice === 0
            ) {

                pathData +=
                    `M ${punto.x} ${punto.y}`;

            }

            else {

                pathData +=
                    ` L ${punto.x} ${punto.y}`;

            }

        }
    );


    const path =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "path"
        );


    path.setAttribute(
        "d",
        pathData
    );


    path.setAttribute(
        "class",
        "serpiente"
    );


    elementosJuego.appendChild(
        path
    );


    const cabeza =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "circle"
        );


    cabeza.setAttribute(
        "cx",
        inicio.x
    );

    cabeza.setAttribute(
        "cy",
        inicio.y
    );

    cabeza.setAttribute(
        "r",
        "2.5"
    );


    cabeza.setAttribute(
        "class",
        "serpiente-cabeza"
    );


    elementosJuego.appendChild(
        cabeza
    );

}

    posicion
) {

    animacionJugador.innerHTML = "";


    const punto =
        posicionCasilla(
            posicion
        );


    const colores = {

        0: "#ef4444",

        1: "#3b82f6",

        2: "#22c55e",

        3: "#a855f7"

    };


    const lista =
        Object.keys(
            estado.jugadores || {}
        );


    const indice =
        Math.max(
            0,
            lista.indexOf(
                jugador.id
            )
        );


    const color =
        colores[
            indice % 4
        ];


    const ficha =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "circle"
        );


    ficha.setAttribute(
        "cx",
        punto.x
    );

    ficha.setAttribute(
        "cy",
        punto.y
    );

    ficha.setAttribute(
        "r",
        "2.3"
    );


    ficha.setAttribute(
        "fill",
        color
    );


    ficha.setAttribute(
        "class",
        "ficha-animada"
    );


    animacionJugador.appendChild(
        ficha
    );


    return ficha;

}


// ==========================================================
// ESPERA
// ==========================================================

function esperar(
    milisegundos
) {

    return new Promise(
        resolver => {

            setTimeout(
                resolver,
                milisegundos
            );

        }
    );

}


// ==========================================================
// ANIMAR MOVIMIENTO
// ==========================================================

async function moverFicha(
    ficha,
    jugador,
    desde,
    hasta,
    duracion
) {

    if (
        desde === hasta
    ) {

        return;

    }


    const inicio =
        posicionCasilla(
            desde
        );


    const fin =
        posicionCasilla(
            hasta
        );


    const distancia =
        Math.abs(
            hasta -
            desde
        );


    const tiempoPorCasilla =
        170;


    const tiempo =
        duracion ||
        Math.max(
            300,
            distancia *
            tiempoPorCasilla
        );


    const inicioTiempo =
        performance.now();


    return new Promise(
        resolver => {

            function animar(
                tiempoActual
            ) {

                const progreso =
                    Math.min(
                        1,
                        (
                            tiempoActual -
                            inicioTiempo
                        ) /
                        tiempo
                    );


                /*
                    Suavizado
                */

                const suave =
                    progreso < .5

                        ? 2 *
                          progreso *
                          progreso

                        : 1 -
                          Math.pow(
                              -2 *
                              progreso +
                              2,
                              2
                          ) /
                          2;


                /*
                    Interpolación
                */

                const x =
                    inicio.x +
                    (
                        fin.x -
                        inicio.x
                    ) *
                    suave;


                const y =
                    inicio.y +
                    (
                        fin.y -
                        inicio.y
                    ) *
                    suave;


                ficha.setAttribute(
                    "cx",
                    x
                );


                ficha.setAttribute(
                    "cy",
                    y
                );


                if (
                    progreso < 1
                ) {

                    requestAnimationFrame(
                        animar
                    );

                }

                else {

                    resolver();

                }

            }


            requestAnimationFrame(
                animar
            );

        }
    );

}


// ==========================================================
// EFECTO ESCALERA
// ==========================================================

async function efectoEscalera(
    ficha,
    desde,
    hasta
) {

    mostrarMensaje(
        "🪜 ¡ESCALERA!"
    );


    ficha.classList.add(
        "efecto-escalera"
    );


    /*
        Pequeña pausa antes
        de comenzar a subir.
    */

    await esperar(
        450
    );


    await moverFicha(
        ficha,
        null,
        desde,
        hasta,
        900
    );


    ficha.classList.remove(
        "efecto-escalera"
    );


    await esperar(
        200
    );

}


// ==========================================================
// EFECTO SERPIENTE
// ==========================================================

async function efectoSerpiente(
    ficha,
    desde,
    hasta
) {

    mostrarMensaje(
        "🐍 ¡SERPIENTE!"
    );


    ficha.classList.add(
        "efecto-serpiente"
    );


    await esperar(
        500
    );


    await moverFicha(
        ficha,
        null,
        desde,
        hasta,
        900
    );


    ficha.classList.remove(
        "efecto-serpiente"
    );


    await esperar(
        200
    );

}


// ==========================================================
// MOSTRAR MENSAJE
// ==========================================================

function mostrarMensaje(
    texto
) {

    mensajeAnimacion.textContent =
        texto;


    mensajeAnimacion.classList.remove(
        "mostrar"
    );


    /*
        Forzar reinicio de animación
    */

    void mensajeAnimacion.offsetWidth;


    mensajeAnimacion.classList.add(
        "mostrar"
    );

}


// ==========================================================
// ANIMACIÓN COMPLETA DEL JUGADOR
// ==========================================================

async function animarJugador(
    jugador,
    posicionAnterior,
    posicionFinal,
    dadoResultado
) {

    if (
        animando
    ) {

        return;

    }


    animando = true;


    /*
        Crear ficha sobre SVG
    */

    const ficha =
        crearFichaAnimada(
            jugador,
            posicionAnterior
        );


    /*
        Calcular dónde cayó
        antes de serpiente/escalera.
    */

    let posicionIntermedia =
        posicionAnterior +
        dadoResultado;


    /*
        No pasar de 100.
    */

    if (
        posicionIntermedia >
        100
    ) {

        posicionIntermedia =
            posicionAnterior;

    }


    /*
        Si el resultado final
        es diferente significa
        que hubo serpiente/escalera.
    */

    const huboEspecial =
        posicionIntermedia !==
        posicionFinal;


    /*
        Movimiento normal
    */

    if (
        posicionIntermedia !==
        posicionAnterior
    ) {

        await moverFicha(
            ficha,
            jugador,
            posicionAnterior,
            posicionIntermedia,
            null
        );

    }


    /*
        Serpiente / escalera
    */

    if (
        huboEspecial
    ) {

        const escalera =
            estado.escaleras &&
            estado.escaleras[
                posicionIntermedia
            ];


        const serpiente =
            estado.serpientes &&
            estado.serpientes[
                posicionIntermedia
            ];


        if (
            escalera &&
            Number(escalera) ===
            Number(posicionFinal)
        ) {

            await efectoEscalera(
                ficha,
                posicionIntermedia,
                posicionFinal
            );

        }

        else if (
            serpiente &&
            Number(serpiente) ===
            Number(posicionFinal)
        ) {

            await efectoSerpiente(
                ficha,
                posicionIntermedia,
                posicionFinal
            );

        }

        else {

            await moverFicha(
                ficha,
                jugador,
                posicionIntermedia,
                posicionFinal,
                700
            );

        }

    }


    /*
        Quitar ficha animada
    */

    animacionJugador.innerHTML =
        "";


    /*
        Actualizar posición visual
    */

    posicionesVisuales[
        jugador.id
    ] =
        posicionFinal;


    animando = false;


    /*
        Mostrar estado final
    */

    renderizarFichas();


    /*
        Victoria
    */

    if (
        posicionFinal >= 100
    ) {

        mostrarVictoria(
            jugador
        );

    }

}


// ==========================================================
// VICTORIA
// ==========================================================

function mostrarVictoria(
    jugador
) {

    nombreGanador.textContent =
        jugador.nombre;


    victoria.classList.add(
        "mostrar"
    );

}


// ==========================================================
// OCULTAR VICTORIA
// ==========================================================

function ocultarVictoria() {

    victoria.classList.remove(
        "mostrar"
    );

}


// ==========================================================
// RENDERIZAR FICHAS NORMALES
// ==========================================================

function renderizarFichas() {

    document
        .querySelectorAll(
            ".fichas"
        )
        .forEach(
            elemento => {

                elemento.innerHTML =
                    "";

            }
        );


    const lista =
        Object.values(
            estado.jugadores || {}
        );


    lista.forEach(
        (jugador, indice) => {

            let posicion =
                posicionesVisuales[
                    jugador.id
                ];


            if (
                posicion ===
                undefined
            ) {

                posicion =
                    jugador.posicion;

            }


            if (
                posicion < 1
            ) {

                posicion = 1;

            }


            if (
                posicion > 100
            ) {

                posicion = 100;

            }


            const contenedor =
                document.getElementById(
                    "fichas-" +
                    posicion
                );


            if (!contenedor) {

                return;

            }


            const ficha =
                document.createElement(
                    "div"
                );


            ficha.className =
                "ficha ficha" +
                (
                    (indice % 4) + 1
                );


            ficha.textContent =
                jugador.nombre
                    .substring(
                        0,
                        1
                    )
                    .toUpperCase();


            ficha.title =
                jugador.nombre +
                " - casilla " +
                jugador.posicion;


            contenedor.appendChild(
                ficha
            );

        }
    );

}


// ==========================================================
// RENDERIZAR TODO
// ==========================================================

function renderizar() {

    dibujarElementosJuego();

    renderizarFichas();


    const lista =
        Object.values(
            estado.jugadores || {}
        );


    /*
        Lista de jugadores
    */

    jugadores.innerHTML =
        "";


    if (
        lista.length === 0
    ) {

        jugadores.textContent =
            "No hay jugadores.";

    }


    lista.forEach(
        jugador => {

            const elemento =
                document.createElement(
                    "div"
                );


            elemento.className =
                "jugador";


            if (
                estado.turno ===
                jugador.id
            ) {

                elemento.classList.add(
                    "mi-turno"
                );

            }


            let texto =
                "🎮 " +
                jugador.nombre +
                " — casilla " +
                jugador.posicion;


            if (
                jugador.id ===
                miId
            ) {

                texto +=
                    " ⭐ Tú";

            }


            if (
                estado.turno ===
                jugador.id
            ) {

                texto +=
                    " 🎲";

            }


            elemento.textContent =
                texto;


            jugadores.appendChild(
                elemento
            );

        }
    );


    /*
        Turno
    */

    const jugadorTurno =
        estado.jugadores[
            estado.turno
        ];


    if (
        jugadorTurno
    ) {

        turnoElemento.textContent =
            jugadorTurno.nombre;

    }

    else {

        turnoElemento.textContent =
            "-";

    }


    /*
        Botón
    */

    const esMiTurno =
        estado.turno ===
        miId;


    const hayGanador =
        estado.ganador !== null &&
        estado.ganador !== undefined;


    btnDado.disabled =
        !esMiTurno ||
        hayGanador ||
        animando ||
        !socket ||
        socket.readyState !==
            WebSocket.OPEN;


    /*
        Evento
    */

    if (
        estado.ultimo_evento
    ) {

        evento.textContent =
            estado.ultimo_evento;

    }

}


// ==========================================================
// DADO
// ==========================================================

function mostrarDado(
    numero
) {

    const dados = {

        1: "⚀",

        2: "⚁",

        3: "⚂",

        4: "⚃",

        5: "⚄",

        6: "⚅"

    };


    dado.textContent =
        dados[numero] ||
        "🎲";

}


// ==========================================================
// ANIMACIÓN DEL DADO
// ==========================================================

async function animarDado(
    resultado
) {

    dado.classList.add(
        "girando"
    );


    const valores = [
        "⚀",
        "⚁",
        "⚂",
        "⚃",
        "⚄",
        "⚅"
    ];


    /*
        Cambiar caras rápidamente
    */

    for (
        let i = 0;
        i < 12;
        i++
    ) {

        const aleatorio =
            Math.floor(
                Math.random() *
                6
            );


        dado.textContent =
            valores[
                aleatorio
            ];


        await esperar(
            75
        );

    }


    dado.classList.remove(
        "girando"
    );


    mostrarDado(
        resultado
    );

}


// ==========================================================
// CONEXIÓN
// ==========================================================

function conectar() {

    actualizarConexion(
        "CONECTANDO...",
        false
    );


    try {

        socket =
            new WebSocket(
                SERVER_URL
            );


        socket.onopen =
            function() {

                actualizarConexion(
                    "CONECTADO",
                    true
                );


                evento.textContent =
                    "Conectado al servidor.";

            };


        socket.onmessage =
            function(e) {

                try {

                    const mensaje =
                        JSON.parse(
                            e.data
                        );


                    procesarMensaje(
                        mensaje
                    );

                }

                catch(error) {

                    console.error(
                        error
                    );

                }

            };


        socket.onerror =
            function(error) {

                console.error(
                    "WebSocket:",
                    error
                );


                actualizarConexion(
                    "ERROR",
                    false
                );

            };


        socket.onclose =
            function() {

                actualizarConexion(
                    "DESCONECTADO",
                    false
                );


                btnDado.disabled =
                    true;


                evento.textContent =
                    "Conexión cerrada. Reconectando...";


                setTimeout(
                    conectar,
                    5000
                );

            };

    }

    catch(error) {

        console.error(
            error
        );

    }

}


// ==========================================================
// ESTADO DE CONEXIÓN
// ==========================================================

function actualizarConexion(
    texto,
    conectado
) {

    estadoConexion.textContent =
        texto;


    estadoConexion.className =
        conectado
            ? "conectado"
            : "error";

}


// ==========================================================
// PROCESAR MENSAJES
// ==========================================================

async function procesarMensaje(
    mensaje
) {

    console.log(
        "Servidor:",
        mensaje
    );


    switch (
        mensaje.tipo
    ) {


        case "conexion":

            miId =
                mensaje.id;


            miIdElemento.textContent =
                miId;


            evento.textContent =
                "Has entrado a la partida.";


            break;


        case "resultado_dado":

            /*
                Animar el dado
            */

            animarDado(
                mensaje.dado
            );


            break;


        case "estado":

            await recibirEstado(
                mensaje
            );


            break;


        case "resultado":

            if (
                mensaje.dado
            ) {

                animarDado(
                    mensaje.dado
                );

            }

            break;


        case "mensaje":

            evento.textContent =
                mensaje.mensaje ||
                "";


            break;


        case "error":

            evento.textContent =
                "⚠️ " +
                mensaje.mensaje;


            break;


        case "lleno":

            evento.textContent =
                "❌ " +
                mensaje.mensaje;


            actualizarConexion(
                "PARTIDA LLENA",
                false
            );


            break;


        case "reinicio":

            ocultarVictoria();


            posicionesVisuales =
                {};


            evento.textContent =
                "🔄 " +
                mensaje.mensaje;


            break;

    }

}


// ==========================================================
// RECIBIR ESTADO
// ==========================================================

async function recibirEstado(
    nuevoEstado
) {

    /*
        Estado anterior
    */

    const estadoAnterior =
        estado;


    /*
        Jugadores anteriores
    */

    const jugadoresAnteriores =
        estadoAnterior.jugadores ||
        {};


    /*
        Guardar nuevo estado
    */

    estado =
        nuevoEstado;


    /*
        Dibujar tablero
    */

    dibujarElementosJuego();


    /*
        Buscar jugadores
        que cambiaron de posición
    */

    let jugadorMovido =
        null;


    for (
        const jugadorId
        in estado.jugadores
    ) {

        const nuevoJugador =
            estado.jugadores[
                jugadorId
            ];


        const anterior =
            jugadoresAnteriores[
                jugadorId
            ];


        if (
            anterior &&
            nuevoJugador.posicion !==
            anterior.posicion
        ) {

            jugadorMovido =
                {

                    jugador:
                        nuevoJugador,

                    desde:
                        anterior.posicion,

                    hasta:
                        nuevoJugador.posicion,

                    dado:
                        estado.ultimo_dado ||
                        0

                };


            break;

        }

    }


    /*
        Primera carga
    */

    if (
        !jugadorMovido
    ) {

        Object.values(
            estado.jugadores
        ).forEach(
            jugador => {

                if (
                    posicionesVisuales[
                        jugador.id
                    ] ===
                    undefined
                ) {

                    posicionesVisuales[
                        jugador.id
                    ] =
                        jugador.posicion;

                }

            }
        );


        renderizar();

        return;

    }


    /*
        Mostrar las fichas
        que NO están animándose
    */

    Object.values(
        estado.jugadores
    ).forEach(
        jugador => {

            if (
                jugador.id !==
                jugadorMovido.jugador.id
            ) {

                posicionesVisuales[
                    jugador.id
                ] =
                    jugador.posicion;

            }

        }
    );


    renderizarFichas();


    /*
        Animar jugador
    */

    await animarJugador(

        jugadorMovido.jugador,

        jugadorMovido.desde,

        jugadorMovido.hasta,

        jugadorMovido.dado

    );


    /*
        Actualizar panel
    */

    renderizar();

}


// ==========================================================
// ENVIAR
// ==========================================================

function enviar(
    tipo,
    datos = {}
) {

    if (
        !socket ||
        socket.readyState !==
            WebSocket.OPEN
    ) {

        evento.textContent =
            "❌ No estás conectado.";

        return;

    }


    socket.send(
        JSON.stringify({

            tipo:
                tipo,

            ...datos

        })
    );

}


// ==========================================================
// NOMBRE
// ==========================================================

function cambiarNombre() {

    const input =
        document.getElementById(
            "nombre"
        );


    const nombre =
        input.value.trim();


    if (!nombre) {

        evento.textContent =
            "Escribe un nombre.";

        return;

    }


    enviar(
        "nombre",
        {
            nombre:
                nombre
        }
    );

}


// ==========================================================
// LANZAR DADO
// ==========================================================

function lanzarDado() {

    if (
        animando
    ) {

        return;

    }


    if (
        !socket ||
        socket.readyState !==
            WebSocket.OPEN
    ) {

        return;

    }


    /*
        Bloquear inmediatamente
    */

    btnDado.disabled =
        true;


    /*
        Mostrar animación
        inmediatamente.
    */

    dado.classList.add(
        "girando"
    );


    /*
        El resultado real
        llegará desde Render.
    */

    enviar(
        "lanzar_dado"
    );

}


// ==========================================================
// REINICIAR
// ==========================================================

function reiniciarJuego() {

    ocultarVictoria();


    posicionesVisuales =
        {};


    dado.classList.remove(
        "girando"
    );


    mostrarDado(
        0
    );


    enviar(
        "reiniciar"
    );

}


// ==========================================================
// ABANDONAR
// ==========================================================

function abandonar() {

    if (
        confirm(
            "¿Quieres abandonar la partida?"
        )
    ) {

        enviar(
            "abandonar"
        );

    }

}


// ==========================================================
// INICIAR
// ==========================================================

crearTablero();

conectar();

</script>

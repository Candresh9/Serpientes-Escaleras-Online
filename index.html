<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Serpientes y Escaleras Online</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #20222b;
    color: white;
}

header {
    text-align: center;
    padding: 20px;
    background: #15161c;
}

header h1 {
    margin: 0;
}

#estadoConexion {
    margin-top: 8px;
    font-weight: bold;
}

.conectado {
    color: #50d878;
}

.desconectado {
    color: #ff5555;
}

.contenedor {
    display: flex;
    justify-content: center;
    gap: 25px;
    padding: 25px;
    flex-wrap: wrap;
}

#tablero {
    width: 680px;
    height: 680px;

    display: grid;
    grid-template-columns: repeat(10, 1fr);
    grid-template-rows: repeat(10, 1fr);

    border: 4px solid #111;
    background: white;
}

.casilla {
    position: relative;

    border: 1px solid #777;

    display: flex;
    align-items: flex-start;
    justify-content: flex-start;

    padding: 4px;

    color: #222;

    font-size: 13px;

    overflow: hidden;
}

.casilla:nth-child(odd) {
    background: #f5f5f5;
}

.casilla:nth-child(even) {
    background: #dfeaf5;
}

.numero {
    position: absolute;
    top: 4px;
    left: 5px;

    font-weight: bold;
}

.jugadores {
    position: absolute;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -40%);

    display: flex;

    flex-wrap: wrap;

    justify-content: center;

    width: 55px;

    gap: 3px;
}

.jugador {
    width: 24px;
    height: 24px;

    border-radius: 50%;

    border: 2px solid #111;

    display: flex;

    align-items: center;
    justify-content: center;

    color: white;

    font-size: 11px;

    font-weight: bold;
}

.panel {
    width: 320px;

    background: white;

    color: #222;

    border-radius: 12px;

    padding: 20px;

    box-shadow:
        0 5px 20px rgba(0,0,0,0.4);
}

.panel h2 {
    margin-top: 0;
}

.info {
    margin-bottom: 10px;
}

.turno {
    padding: 12px;

    background: #e9f9ee;

    color: #16813c;

    border-radius: 8px;

    font-weight: bold;

    margin: 15px 0;
}

.evento {
    background: #eeeeee;

    padding: 12px;

    border-radius: 8px;

    min-height: 60px;

    margin-bottom: 15px;
}

button {

    width: 100%;

    padding: 14px;

    margin-top: 10px;

    border: none;

    border-radius: 8px;

    color: white;

    font-size: 17px;

    font-weight: bold;

    cursor: pointer;
}

#btnDado {
    background: #28b85a;
}

#btnDado:hover {
    background: #1e9848;
}

#btnAbandonar {
    background: #e33d3d;
}

#btnAbandonar:hover {
    background: #bd2929;
}

#btnReiniciar {
    background: #2675d9;
}

#btnReiniciar:hover {
    background: #1d5dad;
}

button:disabled {
    background: #999 !important;
    cursor: not-allowed;
}

.listaJugadores {
    margin-top: 15px;
}

.listaJugador {
    padding: 8px;

    margin-bottom: 5px;

    border-radius: 5px;

    background: #eeeeee;
}

#dado {
    font-size: 55px;

    text-align: center;

    font-weight: bold;

    margin: 10px 0;
}

@media(max-width: 750px) {

    #tablero {
        width: 95vw;
        height: 95vw;
    }

    .panel {
        width: 95vw;
    }
}

</style>
</head>

<body>

<header>

<h1>🎲 Serpientes y Escaleras Online</h1>

<div id="estadoConexion"
     class="desconectado">

    Conectando...

</div>

</header>


<div class="contenedor">

    <div id="tablero"></div>


    <div class="panel">

        <h2>🎮 Partida</h2>

        <div class="info">
            <b>Tu jugador:</b>
            <span id="miJugador">-</span>
        </div>

        <div class="info">
            <b>Jugadores:</b>
            <span id="cantidadJugadores">0/4</span>
        </div>

        <div class="info">
            <b>Último dado:</b>
        </div>

        <div id="dado">
            -
        </div>

        <div id="turno"
             class="turno">

            Esperando servidor...

        </div>

        <div>
            <b>Último evento:</b>
        </div>

        <div id="evento"
             class="evento">

            Conectando al servidor...

        </div>

        <div class="listaJugadores">

            <b>Jugadores conectados</b>

            <div id="listaJugadores"></div>

        </div>

        <button id="btnDado"
                disabled>

            🎲 LANZAR DADO

        </button>

        <button id="btnReiniciar">

            🔄 REINICIAR PARTIDA

        </button>

        <button id="btnAbandonar">

            🚪 ABANDONAR PARTIDA

        </button>

    </div>

</div>


<script>


// ============================================================
// CONFIGURACIÓN
// ============================================================

const SERVER_URL =
    "wss://serpientes-escaleras-phl7.onrender.com";


const MAX_JUGADORES = 4;


// ============================================================
// ESTADO
// ============================================================

let socket = null;

let miId = null;

let jugadores = {};

let turno = null;

let ganador = null;

let dado = 0;

let ultimoEvento =
    "Conectando al servidor...";

let escaleras = {};

let serpientes = {};


// ============================================================
// COLORES
// ============================================================

const colores = [
    "#ff5050",
    "#5078ff",
    "#50c864",
    "#dc64dc"
];


// ============================================================
// TABLERO
// ============================================================

const tablero =
    document.getElementById("tablero");


function crearTablero() {

    tablero.innerHTML = "";


    for (
        let fila = 0;
        fila < 10;
        fila++
    ) {

        for (
            let columna = 0;
            columna < 10;
            columna++
        ) {

            let numeroFila =
                9 - fila;

            let numero;


            if (
                numeroFila % 2 === 0
            ) {

                numero =
                    numeroFila * 10 +
                    columna + 1;

            } else {

                numero =
                    numeroFila * 10 +
                    (9 - columna) + 1;
            }


            const casilla =
                document.createElement("div");

            casilla.className =
                "casilla";

            casilla.dataset.numero =
                numero;


            const numeroElemento =
                document.createElement("div");

            numeroElemento.className =
                "numero";

            numeroElemento.textContent =
                numero;


            casilla.appendChild(
                numeroElemento
            );


            const jugadoresElemento =
                document.createElement("div");

            jugadoresElemento.className =
                "jugadores";


            casilla.appendChild(
                jugadoresElemento
            );


            tablero.appendChild(
                casilla
            );
        }
    }
}


// ============================================================
// DIBUJAR JUGADORES
// ============================================================

function dibujarJugadores() {

    document
        .querySelectorAll(".jugadores")
        .forEach(
            elemento =>
                elemento.innerHTML = ""
        );


    for (
        const [id, jugador]
        of Object.entries(jugadores)
    ) {

        const posicion =
            Number(
                jugador.posicion ??
                jugador.casilla ??
                1
            );


        const casilla =
            document.querySelector(
                `.casilla[data-numero="${posicion}"]`
            );


        if (!casilla) {
            continue;
        }


        const contenedor =
            casilla.querySelector(
                ".jugadores"
            );


        const ficha =
            document.createElement("div");

        ficha.className =
            "jugador";


        let color =
            jugador.color;


        if (
            Array.isArray(color)
        ) {

            color =
                `rgb(${color[0]},${color[1]},${color[2]})`;

        } else {

            color =
                colores[
                    (Number(id) - 1)
                    % colores.length
                ];
        }


        ficha.style.background =
            color;


        ficha.textContent =
            id;


        ficha.title =
            jugador.nombre ??
            `Jugador ${id}`;


        contenedor.appendChild(
            ficha
        );
    }
}


// ============================================================
// ACTUALIZAR INTERFAZ
// ============================================================

function actualizarInterfaz() {

    document.getElementById(
        "miJugador"
    ).textContent =
        miId ?? "-";


    document.getElementById(
        "cantidadJugadores"
    ).textContent =
        `${Object.keys(jugadores).length}/${MAX_JUGADORES}`;


    document.getElementById(
        "dado"
    ).textContent =
        dado || "-";


    document.getElementById(
        "evento"
    ).textContent =
        ultimoEvento;


    const turnoElemento =
        document.getElementById(
            "turno"
        );


    if (ganador !== null) {

        turnoElemento.textContent =
            `🏆 ¡GANÓ EL JUGADOR ${ganador}!`;

    }

    else if (
        miId !== null &&
        turno !== null &&
        String(miId) === String(turno)
    ) {

        turnoElemento.textContent =
            "🎯 ¡ES TU TURNO!";

    }

    else if (turno !== null) {

        turnoElemento.textContent =
            `Turno del jugador ${turno}`;

    }

    else {

        turnoElemento.textContent =
            "Esperando jugadores...";
    }


    const boton =
        document.getElementById(
            "btnDado"
        );


    boton.disabled = !(
        socket &&
        socket.readyState === WebSocket.OPEN &&
        miId !== null &&
        turno !== null &&
        String(miId) === String(turno) &&
        ganador === null
    );


    dibujarJugadores();

    dibujarListaJugadores();
}


// ============================================================
// LISTA DE JUGADORES
// ============================================================

function dibujarListaJugadores() {

    const lista =
        document.getElementById(
            "listaJugadores"
        );


    lista.innerHTML = "";


    for (
        const [id, jugador]
        of Object.entries(jugadores)
    ) {

        const elemento =
            document.createElement("div");

        elemento.className =
            "listaJugador";


        const posicion =
            jugador.posicion ??
            jugador.casilla ??
            1;


        elemento.textContent =
            `Jugador ${id} — Casilla ${posicion}`;


        if (
            String(id) === String(turno)
        ) {

            elemento.textContent +=
                " 🎯";
        }


        lista.appendChild(
            elemento
        );
    }
}


// ============================================================
// CONECTAR
// ============================================================

function conectar() {

    ultimoEvento =
        "Conectando al servidor online...";

    actualizarInterfaz();


    try {

        socket =
            new WebSocket(
                SERVER_URL
            );

    }

    catch (error) {

        mostrarError(
            "No se pudo crear la conexión."
        );

        return;
    }


    socket.onopen = function() {

        const estado =
            document.getElementById(
                "estadoConexion"
            );


        estado.textContent =
            "🟢 CONECTADO AL SERVIDOR";

        estado.className =
            "conectado";


        ultimoEvento =
            "Conectado al servidor online.";


        actualizarInterfaz();
    };


    socket.onmessage =
        function(evento) {

            try {

                const mensaje =
                    JSON.parse(
                        evento.data
                    );


                procesarMensaje(
                    mensaje
                );

            }

            catch (error) {

                console.error(
                    "Mensaje inválido:",
                    evento.data
                );
            }
        };


    socket.onclose =
        function() {

            const estado =
                document.getElementById(
                    "estadoConexion"
                );


            estado.textContent =
                "🔴 DESCONECTADO";

            estado.className =
                "desconectado";


            ultimoEvento =
                "Se perdió la conexión con el servidor.";


            actualizarInterfaz();
        };


    socket.onerror =
        function(error) {

            console.error(
                "WebSocket:",
                error
            );


            mostrarError(
                "Error de conexión con Render."
            );
        };
}


// ============================================================
// PROCESAR MENSAJE
// ============================================================

function procesarMensaje(mensaje) {

    const tipo =
        mensaje.tipo;


    console.log(
        "Servidor:",
        mensaje
    );


    // --------------------------------------------------------
    // CONEXIÓN
    // --------------------------------------------------------

    if (
        tipo === "conexion" ||
        tipo === "asignar_id"
    ) {

        miId =
            mensaje.id;


        if (
            mensaje.escaleras
        ) {

            escaleras =
                mensaje.escaleras;
        }


        if (
            mensaje.serpientes
        ) {

            serpientes =
                mensaje.serpientes;
        }


        ultimoEvento =
            `Conectado como Jugador ${miId}.`;
    }


    // --------------------------------------------------------
    // ESTADO
    // --------------------------------------------------------

    else if (
        tipo === "estado"
    ) {

        jugadores =
            mensaje.jugadores || {};


        turno =
            mensaje.turno;


        ganador =
            mensaje.ganador;


        dado =
            mensaje.dado ??
            mensaje.ultimo_dado ??
            0;


        ultimoEvento =
            mensaje.ultimo_evento ??
            ultimoEvento;


        escaleras =
            mensaje.escaleras ??
            escaleras;


        serpientes =
            mensaje.serpientes ??
            serpientes;
    }


    // --------------------------------------------------------
    // RESULTADO
    // --------------------------------------------------------

    else if (
        tipo === "resultado_dado" ||
        tipo === "resultado"
    ) {

        if (
            mensaje.dado !== undefined
        ) {

            dado =
                mensaje.dado;
        }


        ultimoEvento =
            mensaje.mensaje ??
            "Resultado recibido.";
    }


    // --------------------------------------------------------
    // MENSAJE
    // --------------------------------------------------------

    else if (
        tipo === "mensaje"
    ) {

        ultimoEvento =
            mensaje.mensaje ??
            "";
    }


    // --------------------------------------------------------
    // ERROR
    // --------------------------------------------------------

    else if (
        tipo === "error"
    ) {

        ultimoEvento =
            mensaje.mensaje ??
            "El servidor informó un error.";
    }


    // --------------------------------------------------------
    // LLENO
    // --------------------------------------------------------

    else if (
        tipo === "lleno"
    ) {

        ultimoEvento =
            mensaje.mensaje ??
            "La partida está llena.";
    }


    // --------------------------------------------------------
    // REINICIO
    // --------------------------------------------------------

    else if (
        tipo === "reinicio"
    ) {

        dado = 0;

        ganador = null;

        ultimoEvento =
            "Partida reiniciada.";
    }


    // --------------------------------------------------------
    // SERVIDOR CERRADO
    // --------------------------------------------------------

    else if (
        tipo === "servidor_cerrando" ||
        tipo === "servidor_cerrado"
    ) {

        ultimoEvento =
            mensaje.mensaje ??
            "El servidor se cerró.";
    }


    actualizarInterfaz();
}


// ============================================================
// ENVIAR
// ============================================================

function enviar(datos) {

    if (
        !socket ||
        socket.readyState !== WebSocket.OPEN
    ) {

        ultimoEvento =
            "No estás conectado al servidor.";

        actualizarInterfaz();

        return false;
    }


    socket.send(
        JSON.stringify(datos)
    );


    return true;
}


// ============================================================
// LANZAR DADO
// ============================================================

function lanzarDado() {

    if (
        miId === null
    ) {

        return;
    }


    if (
        turno === null ||
        String(miId) !== String(turno)
    ) {

        ultimoEvento =
            `No es tu turno. Turno del jugador ${turno}.`;

        actualizarInterfaz();

        return;
    }


    if (
        ganador !== null
    ) {

        ultimoEvento =
            "La partida ya terminó.";

        actualizarInterfaz();

        return;
    }


    ultimoEvento =
        "Lanzando dado...";


    actualizarInterfaz();


    enviar({
        tipo: "lanzar_dado"
    });
}


// ============================================================
// ABANDONAR
// ============================================================

function abandonar() {

    const confirmar =
        confirm(
            "¿Quieres abandonar la partida?"
        );


    if (!confirmar) {
        return;
    }


    enviar({
        tipo: "abandonar"
    });


    if (socket) {

        socket.close();
    }
}


// ============================================================
// REINICIAR
// ============================================================

function reiniciar() {

    const confirmar =
        confirm(
            "¿Reiniciar la partida para todos?"
        );


    if (!confirmar) {
        return;
    }


    enviar({
        tipo: "reiniciar"
    });
}


// ============================================================
// ERROR
// ============================================================

function mostrarError(mensaje) {

    ultimoEvento =
        mensaje;


    const estado =
        document.getElementById(
            "estadoConexion"
        );


    estado.textContent =
        "🔴 ERROR DE CONEXIÓN";

    estado.className =
        "desconectado";


    actualizarInterfaz();
}


// ============================================================
// BOTONES
// ============================================================

document
    .getElementById("btnDado")
    .addEventListener(
        "click",
        lanzarDado
    );


document
    .getElementById("btnAbandonar")
    .addEventListener(
        "click",
        abandonar
    );


document
    .getElementById("btnReiniciar")
    .addEventListener(
        "click",
        reiniciar
    );


// ============================================================
// TECLADO
// ============================================================

document.addEventListener(
    "keydown",
    function(evento) {

        if (
            evento.code === "Space"
        ) {

            evento.preventDefault();

            lanzarDado();
        }
    }
);


// ============================================================
// INICIO
// ============================================================

crearTablero();

actualizarInterfaz();

conectar();

</script>

</body>
</html>

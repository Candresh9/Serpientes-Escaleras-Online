<!DOCTYPE html>
<html lang="es">
<head>

<title>Serpientes y Escaleras Online</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background:
        radial-gradient(circle at top, #ffffff 0%, #e8eef5 45%, #d8e0e8 100%);
    color: #171717;
    min-height: 100vh;
}

.app {
    width: min(1450px, 96vw);
    margin: auto;
    padding: 20px;
}

.titulo {
    text-align: center;
    font-size: clamp(28px, 4vw, 46px);
    font-weight: 900;
    margin-bottom: 20px;
    letter-spacing: 1px;
}

.juego {
    display: grid;
    grid-template-columns: minmax(600px, 1fr) 340px;
    gap: 22px;
    align-items: start;
}

.tablero-contenedor {
    background: rgba(255,255,255,.88);
    border-radius: 24px;
    padding: 18px;
    box-shadow:
        0 20px 50px rgba(0,0,0,.14),
        inset 0 0 0 1px rgba(255,255,255,.8);
}

#tablero {
    width: 100%;
    aspect-ratio: 1 / 1;
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    grid-template-rows: repeat(10, 1fr);
    border: 5px solid #252525;
    border-radius: 14px;
    overflow: hidden;
    background: white;
}

.casilla {
    position: relative;
    display: flex;
    align-items: flex-start;
    justify-content: flex-start;
    border: 1px solid rgba(0,0,0,.14);
    font-weight: 900;
    font-size: clamp(10px, 1.2vw, 16px);
    padding: 5px;
    overflow: hidden;
}

.casilla:nth-child(odd) {
    background: #fffdf3;
}

.casilla:nth-child(even) {
    background: #edf7ff;
}

.numero {
    position: relative;
    z-index: 2;
    opacity: .75;
}

.pieza-capa {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 20;
}

.tablero-svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 10;
}

.pieza {
    position: absolute;
    width: 38px;
    height: 38px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    border: 4px solid white;
    box-shadow:
        0 5px 8px rgba(0,0,0,.35),
        inset 0 3px 4px rgba(255,255,255,.5);
    z-index: 30;
    transition:
        left .08s linear,
        top .08s linear,
        transform .12s ease;
}

.pieza::after {
    content: "";
    position: absolute;
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: rgba(255,255,255,.75);
    left: 7px;
    top: 5px;
}

.pieza.rebote {
    transform: translate(-50%, -62%) scale(1.13);
}

.pieza.mia {
    border-color: #fff;
    box-shadow:
        0 0 0 3px #222,
        0 8px 15px rgba(0,0,0,.35),
        inset 0 3px 4px rgba(255,255,255,.5);
}

.pieza.moviendo {
    z-index: 50;
}

.panel {
    background: rgba(255,255,255,.94);
    border-radius: 24px;
    padding: 22px;
    box-shadow: 0 20px 50px rgba(0,0,0,.14);
}

.panel h2 {
    margin: 0 0 15px;
    text-align: center;
    font-size: 25px;
}

.estado {
    padding: 13px;
    background: #f1f4f7;
    border-radius: 12px;
    text-align: center;
    font-weight: 700;
    margin-bottom: 15px;
    min-height: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.nombre-box {
    display: flex;
    gap: 7px;
    margin-bottom: 15px;
}

.nombre-box input {
    min-width: 0;
    flex: 1;
    border: 2px solid #d2d8de;
    border-radius: 10px;
    padding: 10px;
    font-size: 15px;
}

button {
    border: 0;
    border-radius: 11px;
    padding: 12px 15px;
    font-weight: 900;
    cursor: pointer;
    transition:
        transform .12s ease,
        filter .12s ease,
        opacity .12s ease;
}

button:hover {
    filter: brightness(1.06);
}

button:active {
    transform: scale(.96);
}

button:disabled {

}

.btn-nombre {
    background: #252525;
    color: white;
}

.boton-dado {

    background: linear-gradient(135deg,#2678ff,#1250c9);

    font-size: 18px;
    margin-top: 10px;
}

.boton-reinicio {
    width: 100%;
    margin-top: 10px;
    background: #45a866;
    color: white;
}

.boton-abandonar {
    width: 100%;
    margin-top: 10px;
    background: #df4848;
    color: white;
}

.jugadores {

}

.jugador {

    gap: 10px;
    padding: 10px;
    border-radius: 10px;
    margin-bottom: 7px;
    background: #f1f3f5;
    transition: .2s;
}

.jugador.turno {
    background: #fff3c4;
    box-shadow: inset 0 0 0 2px #f1c232;
}

.punto {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    border: 2px solid white;
    box-shadow: 0 1px 4px rgba(0,0,0,.3);
}

.dado-area {
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 15px 0 20px;
    perspective: 800px;
}

.dado-3d {
    width: 86px;
    height: 86px;
    position: relative;
    transform-style: preserve-3d;
    transition: transform .15s;
}

.cara {
    position: absolute;
    width: 86px;
    height: 86px;
    background: linear-gradient(145deg,#ffffff,#dfe4e8);
    border: 3px solid #202020;
    border-radius: 15px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    padding: 12px;
    box-shadow:
        inset 0 0 12px rgba(0,0,0,.12),
        0 10px 20px rgba(0,0,0,.2);
    backface-visibility: hidden;
}

.cara-1 { transform: rotateY(0deg) translateZ(43px); }
.cara-2 { transform: rotateY(90deg) translateZ(43px); }
.cara-3 { transform: rotateY(180deg) translateZ(43px); }
.cara-4 { transform: rotateY(-90deg) translateZ(43px); }
.cara-5 { transform: rotateX(90deg) translateZ(43px); }
.cara-6 { transform: rotateX(-90deg) translateZ(43px); }

.punto-dado {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #202020;
    align-self: center;
    justify-self: center;
}

.cara[data-numero="1"] .p1 { grid-area: 2 / 2; }

.cara[data-numero="2"] .p1 { grid-area: 1 / 1; }
.cara[data-numero="2"] .p2 { grid-area: 3 / 3; }

.cara[data-numero="3"] .p1 { grid-area: 1 / 1; }
.cara[data-numero="3"] .p2 { grid-area: 2 / 2; }
.cara[data-numero="3"] .p3 { grid-area: 3 / 3; }

.cara[data-numero="4"] .p1 { grid-area: 1 / 1; }
.cara[data-numero="4"] .p2 { grid-area: 1 / 3; }
.cara[data-numero="4"] .p3 { grid-area: 3 / 1; }
.cara[data-numero="4"] .p4 { grid-area: 3 / 3; }

.cara[data-numero="5"] .p1 { grid-area: 1 / 1; }
.cara[data-numero="5"] .p2 { grid-area: 1 / 3; }
.cara[data-numero="5"] .p3 { grid-area: 2 / 2; }
.cara[data-numero="5"] .p4 { grid-area: 3 / 1; }
.cara[data-numero="5"] .p5 { grid-area: 3 / 3; }

.cara[data-numero="6"] .p1 { grid-area: 1 / 1; }
.cara[data-numero="6"] .p2 { grid-area: 1 / 3; }
.cara[data-numero="6"] .p3 { grid-area: 2 / 1; }
.cara[data-numero="6"] .p4 { grid-area: 2 / 3; }
.cara[data-numero="6"] .p5 { grid-area: 3 / 1; }
.cara[data-numero="6"] .p6 { grid-area: 3 / 3; }

.dado-3d.lanzando {
    animation: dadoSacudida .12s infinite alternate;
}

@keyframes dadoSacudida {
    from {
        transform: rotateX(-15deg) rotateY(-15deg) rotateZ(-4deg);
    }
    to {
        transform: rotateX(15deg) rotateY(20deg) rotateZ(5deg);
    }
}

.resultado-dado {
    text-align: center;
    font-size: 18px;
    font-weight: 900;
    min-height: 27px;
}

.mensaje-efecto {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%,-50%) scale(.5);
    z-index: 200;
    pointer-events: none;
    opacity: 0;
    font-size: clamp(28px,5vw,65px);
    font-weight: 1000;
    text-shadow:
        0 4px 0 white,
        0 7px 12px rgba(0,0,0,.45);
    white-space: nowrap;
}

.mensaje-efecto.mostrar {
    animation: efectoTexto 1.1s ease forwards;
}

@keyframes efectoTexto {
    0% {
        opacity: 0;
        transform: translate(-50%,-50%) scale(.4) rotate(-8deg);
    }
    25% {
        opacity: 1;
        transform: translate(-50%,-50%) scale(1.2) rotate(4deg);
    }
    65% {

.resaltado-casilla {

@keyframes resaltarCasilla {

    }

.particula {
    position: absolute;
    width: 9px;
    height: 9px;
    border-radius: 50%;
    pointer-events: none;
    z-index: 100;
    animation: particulaVuelo .8s ease-out forwards;
}

@keyframes particulaVuelo {
    0% {
        opacity: 1;
        transform: translate(0,0) scale(1);
    }
    100% {
        opacity: 0;
        transform:
            translate(var(--dx),var(--dy))

    }
}

.victoria {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.65);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    backdrop-filter: blur(5px);

.victoria.visible {

}

.victoria-card {

.victoria-trofeo {

    animation: trofeo 1s ease-in-out infinite alternate;
}

@keyframes victoriaEntrada {
    from {
        transform: scale(.3) rotate(-8deg);
        opacity: 0;
    }
    to {
        transform: scale(1) rotate(0);
        opacity: 1;
    }
}

@keyframes trofeo {
    from { transform: rotate(-8deg) scale(1); }
    to { transform: rotate(8deg) scale(1.12); }
}

@keyframes aparecer {
    from { opacity: 0; }
    to { opacity: 1; }
}

@media(max-width: 950px) {

</style>

/* ============================================================
   TABLERO
============================================================ */

function crearTablero() {

    tablero
        .querySelectorAll(".casilla")
        .forEach(e => e.remove());

    for (let fila = 0; fila < 10; fila++) {

        const filaReal = 9 - fila;

        const izquierdaADerecha =
            filaReal % 2 === 0;

        for (let columna = 0; columna < 10; columna++) {

            let numero;

            if (izquierdaADerecha) {
                numero =
                    filaReal * 10 +
                    columna +
                    1;
            } else {
                numero =
                    filaReal * 10 +
                    (9 - columna) +
                    1;
            }

            const casilla =
                document.createElement("div");

            casilla.className =
                "casilla";

            casilla.dataset.numero =
                numero;

            const numeroTexto =
                document.createElement("span");

            numeroTexto.className =
                "numero";

            numeroTexto.textContent =
                numero;

            casilla.appendChild(
                numeroTexto
            );

            tablero.appendChild(
                casilla
            );
        }
    }
}


/* ============================================================
   COORDENADAS
============================================================ */

function posicionCasilla(numero) {

    numero = Math.max(
        1,
        Math.min(100, Number(numero))
    );

    const indice =
        numero - 1;

    const fila =
        Math.floor(indice / 10);

    const columna =
        indice % 10;

    const filaVisual =
        9 - fila;

    let columnaVisual;

    if (fila % 2 === 0) {
        columnaVisual = columna;
    } else {
        columnaVisual = 9 - columna;
    }

    return {
        x: columnaVisual * 10 + 5,
        y: filaVisual * 10 + 5
    };
}


/* ============================================================
   SVG
============================================================ */

function crearSvgElemento(
    tipo,
    atributos = {}
) {

    const elemento =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            tipo
        );

    for (
        const [clave, valor]
        of Object.entries(atributos)
    ) {
        elemento.setAttribute(
            clave,
            valor
        );
    }

    return elemento;
}

            "g",
            {
                class: "escalera",
                "data-desde": desde,
                "data-hasta": hasta
            }
        );

    const a =
        posicionCasilla(desde);

    const b =
        posicionCasilla(hasta);

    const dx =
        b.x - a.x;

    const dy =
        b.y - a.y;

    const distancia =
        Math.sqrt(dx * dx + dy * dy);

    const nx =
        -dy / distancia * 1.15;

    const ny =
        dx / distancia * 1.15;

    const x1 =
        a.x + nx;

    const y1 =
        a.y + ny;

    const x2 =
        b.x + nx;

    const y2 =
        b.y + ny;

    const x3 =
        a.x - nx;

    const y3 =
        a.y - ny;

    const x4 =
        b.x - nx;

    const y4 =
        b.y - ny;

    const rail1 =
        crearSvgElemento(
            "line",
            {
                x1,
                y1,
                x2,
                y2,
                class: "escalera-rail"
            }
        );

    const rail2 =
        crearSvgElemento(
            "line",
            {
                x1: x3,
                y1: y3,
                x2: x4,
                y2: y4,
                class: "escalera-rail"
            }
        );

    grupo.appendChild(rail1);
    grupo.appendChild(rail2);

    const peldaños = 7;

    for (
        let i = 1;
        i < peldaños;
        i++
    ) {

        const t =
            i / peldaños;

        const cx =
            a.x + dx * t;

        const cy =
            a.y + dy * t;

        const px =
            nx * 1.05;

        const py =
            ny * 1.05;

        const peldaño =
            crearSvgElemento(
                "line",
                {
                    x1: cx - px,
                    y1: cy - py,
                    x2: cx + px,
                    y2: cy + py,
                    class: "escalera-peldaño"
                }
            );

        grupo.appendChild(
            peldaño
        );
    }

    tableroSvg.appendChild(
        grupo
    );
}


/* ============================================================
   SERPIENTES
============================================================ */

function dibujarSerpiente(
    desde,
    hasta
) {

    const grupo =
        crearSvgElemento(
            "g",
            {
                class: "serpiente",
                "data-desde": desde,
                "data-hasta": hasta
            }
        );

    const a =
        posicionCasilla(desde);

    const b =
        posicionCasilla(hasta);

    const dx =
        b.x - a.x;

    const dy =
        b.y - a.y;

    const distancia =
        Math.sqrt(dx * dx + dy * dy);

    const nx =
        -dy / distancia;

    const ny =
        dx / distancia;

    const amplitud =
        Math.min(
            5,
            Math.max(
                2.5,
                distancia * .09
            )
        );

    let path =
        `M ${a.x} ${a.y}`;

    const segmentos = 8;

    for (
        let i = 1;
        i <= segmentos;
        i++
    ) {

        const t =
            i / segmentos;

        const cx =
            a.x + dx * t;

        const cy =
            a.y + dy * t;

        const onda =
            Math.sin(
                t * Math.PI * 4
            ) * amplitud;

        const px =
            cx + nx * onda;

        const py =
            cy + ny * onda;

        path +=
            ` L ${px} ${py}`;
    }

    const borde =
        crearSvgElemento(
            "path",
            {
                d: path,
                class: "serpiente-borde"
            }
        );

    const cuerpo =
        crearSvgElemento(
            "path",
            {
                d: path,
                class: "serpiente-cuerpo"
            }
        );

    grupo.appendChild(
        borde
    );

    grupo.appendChild(
        cuerpo
    );

    /* cabeza */

    const cabeza =
        crearSvgElemento(
            "circle",
            {
                cx: a.x,
                cy: a.y,
                r: 2.8,
                fill: "#d32f2f",
                stroke: "#721111",
                "stroke-width": 0.7
            }
        );

    grupo.appendChild(
        cabeza
    );

    /* ojos */

    const ojo1 =
        crearSvgElemento(
            "circle",
            {
                cx: a.x - 1,
                cy: a.y - 1,
                r: .45,
                fill: "white"
            }
        );

    const ojo2 =
        crearSvgElemento(
            "circle",
            {
                cx: a.x + 1,
                cy: a.y - 1,
                r: .45,
                fill: "white"
            }
        );

    grupo.appendChild(ojo1);
    grupo.appendChild(ojo2);

    tableroSvg.appendChild(
        grupo
    );
}


function dibujarElementos() {

    tableroSvg.innerHTML = "";

    for (
        const [desde, hasta]
        of Object.entries(ESCALERAS)
    ) {
        dibujarEscalera(
            Number(desde),
            Number(hasta)
        );
    }

    for (
        const [desde, hasta]
        of Object.entries(SERPIENTES)
    ) {
        dibujarSerpiente(
            Number(desde),
            Number(hasta)
        );
    }
}


/* ============================================================
   FICHAS
============================================================ */

function obtenerPosicionJugador(jugador) {

    if (
        jugador.posicion !== undefined
    ) {
        return Number(
            jugador.posicion
        );
    }

    if (
        jugador.casilla !== undefined
    ) {
        return Number(
            jugador.casilla
        );
    }

    return 1;
}


function obtenerNombreJugador(
    jugador,
    id
) {

    return jugador.nombre ||
        `Jugador ${id}`;
}


function obtenerColorJugador(
    jugador,
    id
) {

    if (jugador.color) {
        return jugador.color;
    }

    return COLORES[
        (Number(id) - 1)
        % COLORES.length
    ];
}


function obtenerJugador(
    jugadores,
    id
) {

    if (!jugadores) {
        return null;
    }

    return jugadores[id] ||
        jugadores[String(id)] ||
        null;
}


/* ============================================================
   RENDER FICHAS
============================================================ */

function renderizarFichas() {

    const jugadores =
        estado.jugadores || {};

    const existentes =
        new Set();

    for (
        const [id, jugador]
        of Object.entries(jugadores)
    ) {

        const posicion =
            posicionesVisuales[id] ??
            obtenerPosicionJugador(
                jugador
            );

        posicionesVisuales[id] =
            posicion;

        existentes.add(id);

        let pieza =
            document.getElementById(
                `pieza-${id}`
            );

        if (!pieza) {

            pieza =
                document.createElement(
                    "div"
                );

            pieza.className =
                "pieza";

            pieza.id =
                `pieza-${id}`;

            pieza.textContent = "";

            piezaCapa.appendChild(
                pieza
            );
        }

        const p =
            posicionCasilla(
                posicion
            );

        pieza.style.left =
            `${p.x}%`;

        pieza.style.top =
            `${p.y}%`;

        pieza.style.background =
            obtenerColorJugador(
                jugador,
                id
            );

        if (
            Number(id) ===
            Number(estado.mi_id)
        ) {
            pieza.classList.add("mia");
        } else {
            pieza.classList.remove("mia");
        }

        pieza.title =
            obtenerNombreJugador(
                jugador,
                id
            );
    }

    piezaCapa
        .querySelectorAll(".pieza")
        .forEach(pieza => {

            const id =
                pieza.id.replace(
                    "pieza-",
                    ""
                );

            if (!existentes.has(id)) {
                pieza.remove();
                delete posicionesVisuales[id];
            }
        });
}


/* ============================================================
   MOVIMIENTO SUAVE
============================================================ */

function dormir(ms) {

    return new Promise(
        resolve =>
            setTimeout(resolve, ms)
    );
}


function easeInOutCubic(t) {

    return t < .5
        ? 4 * t * t * t
        : 1 -
          Math.pow(
              -2 * t + 2,
              3
          ) / 2;
}


function moverElementoSuave(
    id,
    desde,
    hasta,
    duracion = 450
) {

    return new Promise(resolve => {

        const pieza =
            document.getElementById(
                `pieza-${id}`
            );

        if (!pieza) {
            resolve();
            return;
        }

        const inicio =
            posicionCasilla(
                desde
            );

        const fin =
            posicionCasilla(
                hasta
            );

        pieza.classList.add(
            "moviendo"
        );

        const inicioTiempo =
            performance.now();

        function frame(ahora) {

            const progreso =
                Math.min(
                    1,
                    (ahora - inicioTiempo)
                    / duracion
                );

            const suavizado =
                easeInOutCubic(
                    progreso
                );

            const x =
                inicio.x +
                (fin.x - inicio.x)
                * suavizado;

            const y =
                inicio.y +
                (fin.y - inicio.y)
                * suavizado;

            pieza.style.left =
                `${x}%`;

            pieza.style.top =
                `${y}%`;

            if (progreso < 1) {

                requestAnimationFrame(
                    frame
                );

            } else {

                pieza.style.left =
                    `${fin.x}%`;

                pieza.style.top =
                    `${fin.y}%`;

                pieza.classList.remove(
                    "moviendo"
                );

                resolve();
            }
        }

        requestAnimationFrame(
            frame
        );
    });
}


async function reboteFicha(id) {

    const pieza =
        document.getElementById(
            `pieza-${id}`
        );

    if (!pieza) {
        return;
    }

    pieza.classList.add(
        "rebote"
    );

    await dormir(130);

    pieza.classList.remove(
        "rebote"
    );

    await dormir(80);
}


/* ============================================================
   MOVIMIENTO CASILLA POR CASILLA
============================================================ */

async function moverFichaPorCasillas(
    id,
    inicio,
    final,
    velocidad = 360
) {

    if (
        final === inicio
    ) {
        return;
    }

    const direccion =
        final > inicio
            ? 1
            : -1;

    const cantidad =
        Math.abs(
            final - inicio
        );

    for (
        let i = 1;
        i <= cantidad;
        i++
    ) {

        const destino =
            inicio +
            i * direccion;

        await moverElementoSuave(
            id,
            destino - direccion,
            destino,
            velocidad
        );

        posicionesVisuales[id] =
            destino;

        await reboteFicha(id);
    }
}

function mostrarMensaje(

) {

    mensajeEfecto.textContent =

        "mostrar"
    );

function crearParticulas(
    numeroCasilla,
    cantidad = 25
) {

    const pieza =
        document.getElementById(
            `pieza-${estado.mi_id}`
        );

    if (!pieza) {
        return;
    }

    const rect =
        tablero.getBoundingClientRect();

    const p =
        posicionCasilla(
            numeroCasilla
        );

    const x =
        rect.width *
        p.x / 100;

    const y =
        rect.height *
        p.y / 100;

    for (
        let i = 0;
        i < cantidad;
        i++
    ) {

        const particula =
            document.createElement(
                "div"
            );

        particula.className =
            "particula";

        particula.style.left =
            `${x}px`;

        particula.style.top =
            `${y}px`;

        particula.style.background =
            i % 2 === 0
                ? "#ffd43b"
                : "#ffffff";

        particula.style.setProperty(
            "--dx",
            `${(Math.random()-.5)*130}px`
        );

        particula.style.setProperty(
            "--dy",
            `${(Math.random()-.5)*130}px`
        );

        piezaCapa.appendChild(
            particula
        );

        setTimeout(
            () => particula.remove(),
            900
        );
    }
}

/* ============================================================
   ANIMACIÓN COMPLETA DEL MOVIMIENTO
============================================================ */

async function animarMovimientoJugador(
    id,
    posicionAnterior,
    posicionFinal,
    dado
) {

    if (animando) {
        return;
    }

    animando = true;

    btnDado.disabled = true;

    const pieza =
        document.getElementById(
            `pieza-${id}`
        );

    if (pieza) {
        pieza.classList.add(
            "moviendo"
        );
    }

    let posicionIntermedia;

    /*
       El servidor ya aplicó escalera/serpiente.
       Por eso reconstruimos primero la casilla
       donde cayó el dado.
    */

    if (
        dado &&
        dado > 0
    ) {

        const posible =
            posicionAnterior +
            Number(dado);

        if (posible > 100) {

            posicionIntermedia =
                posicionAnterior;

        } else {

            posicionIntermedia =
                posible;
        }

    } else {

        posicionIntermedia =
            posicionFinal;
    }


    /*
       MOVIMIENTO NORMAL
    */

    if (
        posicionIntermedia !==
        posicionAnterior
    ) {

        await moverFichaPorCasillas(
            id,
            posicionAnterior,
            posicionIntermedia,
            330
        );
    }


    /*
       COMPROBAR ESCALERA
    */

    const destinoEscalera =
        ESCALERAS[
            posicionIntermedia
        ];

    if (
        destinoEscalera &&
        destinoEscalera !==
        posicionIntermedia
    ) {

        resaltarCasilla(
            posicionIntermedia
        );

        activarEscalera(
            posicionIntermedia,
            destinoEscalera
        );

        mostrarMensaje(
            "🪜 ¡ESCALERA!"
        );

        crearParticulas(
            posicionIntermedia,
            30
        );

        await dormir(650);

        /*
           Subida MUY visible.
        */

        await moverElementoSuave(
            id,
            posicionIntermedia,
            destinoEscalera,
            1500
        );

        posicionesVisuales[id] =
            destinoEscalera;

        await reboteFicha(id);

        crearParticulas(
            destinoEscalera,
            35
        );

        await dormir(300);
    }


    /*
       COMPROBAR SERPIENTE
    */

    const destinoSerpiente =
        SERPIENTES[
            posicionIntermedia
        ];

    if (
        destinoSerpiente &&
        destinoSerpiente !==
        posicionIntermedia
    ) {

        resaltarCasilla(
            posicionIntermedia
        );

        activarSerpiente(
            posicionIntermedia,
            destinoSerpiente
        );

        mostrarMensaje(
            "🐍 ¡SERPIENTE!"
        );

        crearParticulas(
            posicionIntermedia,
            25
        );

        await dormir(650);

        /*
           Bajada MUY visible.
        */

        await moverElementoSuave(
            id,
            posicionIntermedia,
            destinoSerpiente,
            1700
        );

        posicionesVisuales[id] =
            destinoSerpiente;

        await reboteFicha(id);

        crearParticulas(
            destinoSerpiente,
            30
        );

        await dormir(300);
    }


    /*
       CORRECCIÓN FINAL
    */

    posicionesVisuales[id] =
        posicionFinal;

    const piezaFinal =
        document.getElementById(
            `pieza-${id}`
        );

    if (piezaFinal) {

        const p =
            posicionCasilla(
                posicionFinal
            );

        piezaFinal.style.left =
            `${p.x}%`;

        piezaFinal.style.top =
            `${p.y}%`;

        piezaFinal.classList.remove(
            "moviendo"
        );
    }

    animando = false;

    actualizarBotonDado();
}


/* ============================================================
   DADO 3D
============================================================ */

const ROTACIONES_DADO = {

    1: "rotateX(0deg) rotateY(0deg) rotateZ(0deg)",

    2: "rotateX(0deg) rotateY(-90deg) rotateZ(0deg)",

    3: "rotateX(0deg) rotateY(180deg) rotateZ(0deg)",

    4: "rotateX(0deg) rotateY(90deg) rotateZ(0deg)",

    5: "rotateX(-90deg) rotateY(0deg) rotateZ(0deg)",

    6: "rotateX(90deg) rotateY(0deg) rotateZ(0deg)"
};


function mostrarCaraDado(
    numero
) {

    numero =
        Math.max(
            1,
            Math.min(
                6,
                Number(numero)
            )
        );

    dado3d.style.transform =
        ROTACIONES_DADO[numero];
}


async function animarDado(
    resultado
) {

    btnDado.disabled = true;

    dado3d.classList.add(
        "lanzando"
    );

    resultadoDado.textContent =
        "🎲 Lanzando...";

    /*
       14 cambios de cara.
       Cada uno tiene una duración
       ligeramente diferente.
    */

    const caras = [
        1,2,3,4,5,6
    ];

    for (
        let i = 0;
        i < 15;
        i++
    ) {

        const cara =
            caras[
                Math.floor(
                    Math.random()
                    * caras.length
                )
            ];

        mostrarCaraDado(
            cara
        );

        resultadoDado.textContent =
            `🎲 ${cara}`;

        await dormir(
            70 + i * 9
        );
    }

    dado3d.classList.remove(
        "lanzando"
    );

    /*
       Giro final
    */

    dado3d.style.transition =
        "transform .75s cubic-bezier(.2,.8,.2,1)";

    mostrarCaraDado(
        resultado
    );

    resultadoDado.textContent =
        `🎲 Resultado: ${resultado}`;

    await dormir(800);

    dado3d.style.transition =
        "transform .15s";

    actualizarBotonDado();
}

        animando ||
        !socket ||
        socket.readyState !==

    ) {

        btnDado.disabled = true;

        return;
    }

    btnDado.disabled =
        Number(estado.turno) !==
        Number(estado.mi_id);

function actualizarEstadoTexto() {

    if (!socket) {

        estadoTexto.textContent =
            "🔴 Desconectado";

        return;
    }

    if (
        socket.readyState !==
        WebSocket.OPEN
    ) {

        estadoTexto.textContent =
            "🟠 Conectando...";

        return;
    }

    if (estado.ganador) {

        const ganador =
            obtenerJugador(
                estado.jugadores,
                estado.ganador
            );

                    ? obtenerNombreJugador(

                        estado.ganador

    if (
        Number(estado.turno) ===
        Number(estado.mi_id)
    ) {

        estadoTexto.textContent =
            "🟢 ¡Es tu turno!";

    } else if (estado.turno) {

        const jugador =
            obtenerJugador(
                estado.jugadores,
                estado.turno
            );

        estadoTexto.textContent =
            `⏳ Turno de ${
                jugador
                    ? obtenerNombreJugador(
                        jugador,
                        estado.turno
                    )
                    : `Jugador ${estado.turno}`
            }`;

    } else {

        estadoTexto.textContent =
            "Esperando jugadores...";
    }
}

/* ============================================================
   RECIBIR ESTADO
============================================================ */

async function recibirEstado(
    nuevoEstado
) {

    const estadoAnterior =
        estado;

    const jugadoresNuevos =
        nuevoEstado.jugadores || {};

    const jugadoresAnteriores =
        estadoAnterior.jugadores || {};

    estado =
        nuevoEstado;

    /*
       Primera carga.
    */

    if (
        Object.keys(
            posicionesVisuales
        ).length === 0
    ) {

        for (
            const [id, jugador]
            of Object.entries(
                jugadoresNuevos
            )
        ) {

            posicionesVisuales[id] =
                obtenerPosicionJugador(
                    jugador
                );
        }

        renderizarFichas();

        actualizarEstadoTexto();

        actualizarListaJugadores();

        actualizarBotonDado();

        return;
    }

    /*
       Detectamos qué jugador cambió.
    */

    let jugadorMovido = null;

    for (
        const [id, jugadorNuevo]
        of Object.entries(
            jugadoresNuevos
        )
    ) {

        const nuevo =
            obtenerPosicionJugador(
                jugadorNuevo
            );

        const anterior =
            posicionesVisuales[id] ??
            obtenerPosicionJugador(
                obtenerJugador(
                    jugadoresAnteriores,
                    id
                ) || {}
            );

        if (
            nuevo !== anterior
        ) {

            jugadorMovido = {
                id,
                anterior,
                nuevo
            };

            break;
        }
    }

    /*
       Renderizamos lista y jugadores
       antes de comenzar.
    */

    renderizarFichas();

    actualizarEstadoTexto();

    actualizarListaJugadores();

    /*
       Si hubo movimiento,
       lo animamos.
    */

    if (
        jugadorMovido &&
        !animando
    ) {

        const dado =
            nuevoEstado.ultimo_dado ??
            nuevoEstado.dado ??
            0;

        await animarMovimientoJugador(
            jugadorMovido.id,
            jugadorMovido.anterior,
            jugadorMovido.nuevo,
            Number(dado)
        );
    }

    /*
       Victoria.
    */

    if (
        nuevoEstado.ganador &&
        nuevoEstado.ganador !==
        ultimaPosicionGanador
    ) {

        ultimaPosicionGanador =
            nuevoEstado.ganador;

        mostrarVictoria(
            nuevoEstado.ganador
        );
    }

    actualizarBotonDado();
}


/* ============================================================
   VICTORIA
============================================================ */

function mostrarVictoria(
    id
) {

    const jugador =
        obtenerJugador(
            estado.jugadores,
            id
        );

    ganadorTexto.textContent =
        jugador
            ? obtenerNombreJugador(
                jugador,
                id
            )
            : `Jugador ${id}`;

    victoria.classList.add(
        "visible"
    );
}


/* ============================================================
   WEBSOCKET
============================================================ */

function conectar() {

    if (
        socket &&
        (
            socket.readyState ===
            WebSocket.OPEN ||
            socket.readyState ===
            WebSocket.CONNECTING
        )
    ) {
        return;
    }

    estadoTexto.textContent =
        "🟠 Conectando al servidor...";

    socket =
        new WebSocket(
            SERVER_URL
        );

    socket.onopen = () => {

        estadoTexto.textContent =
            "🟢 Conectado";

        actualizarBotonDado();

        /*
           Enviar ping inicial.
        */

        enviar({
            tipo: "ping"
        });
    };


    socket.onmessage = async (
        evento
    ) => {

        try {

            const mensaje =
                JSON.parse(
                    evento.data
                );

            await procesarMensaje(
                mensaje
            );

        } catch (error) {

            console.error(
                "Error procesando mensaje:",
                error
            );
        }
    };


    socket.onerror = error => {

        console.error(
            "WebSocket:",
            error
        );

        estadoTexto.textContent =
            "🔴 Error de conexión";
    };


    socket.onclose = () => {

        estadoTexto.textContent =
            "🟠 Conexión cerrada. Reintentando...";

        btnDado.disabled = true;

        if (!abandonando) {

            setTimeout(
                conectar,
                3000
            );
        }
    };
}


/* ============================================================
   MENSAJES
============================================================ */

async function procesarMensaje(
    mensaje
) {

    switch (
        mensaje.tipo
    ) {

        case "conexion":

            if (
                mensaje.id !==
                undefined
            ) {

                estado.mi_id =
                    mensaje.id;
            }

            if (
                mensaje.jugador_id !==
                undefined
            ) {

                estado.mi_id =
                    mensaje.jugador_id;
            }

            if (
                mensaje.estado
            ) {

                await recibirEstado(
                    mensaje.estado
                );
            }

            actualizarEstadoTexto();

            break;


        case "asignar_id":

            estado.mi_id =
                mensaje.id;

            break;


        case "estado":

            await recibirEstado(
                mensaje.estado ||
                mensaje
            );

            break;


        case "resultado_dado":

            /*
               Algunos servidores envían
               resultado_dado por separado.
            */

            if (
                mensaje.dado
            ) {

                await animarDado(
                    Number(
                        mensaje.dado
                    )
                );
            }

            break;


        case "resultado":

            if (
                mensaje.dado
            ) {

                await animarDado(
                    Number(
                        mensaje.dado
                    )
                );
            }

            break;


        case "mensaje":

            estadoTexto.textContent =
                mensaje.mensaje ||
                mensaje.texto ||
                "Mensaje del servidor.";

            break;


        case "error":

            estadoTexto.textContent =
                `❌ ${
                    mensaje.mensaje ||
                    "Error"
                }`;

            break;


        case "lleno":

            estadoTexto.textContent =
                "❌ El servidor está lleno.";

            break;


        case "servidor_cerrando":

            estadoTexto.textContent =
                "🔴 El servidor está cerrando.";

            break;
    }
}


/* ============================================================
   ENVIAR
============================================================ */

function enviar(
    datos
) {

    if (
        !socket ||
        socket.readyState !==
        WebSocket.OPEN
    ) {

        return false;
    }

    socket.send(
        JSON.stringify(
            datos
        )
    );

    return true;
}


/* ============================================================
   LANZAR DADO
============================================================ */

btnDado.addEventListener(
    "click",
    () => {

        if (
            animando ||
            btnDado.disabled
        ) {
            return;
        }

        btnDado.disabled =
            true;

        resultadoDado.textContent =
            "🎲 Lanzando...";

        enviar({
            tipo: "lanzar_dado"
        });
    }
);


/* ============================================================
   NOMBRE
============================================================ */

function cambiarNombre() {

    const nombre =
        nombreInput.value.trim();

    if (!nombre) {
        return;
    }

    enviar({
        tipo: "nombre",
        nombre
    });
}

btnNombre.addEventListener(
    "click",
    cambiarNombre
);

nombreInput.addEventListener(
    "keydown",
    evento => {

        if (
            evento.key ===
            "Enter"
        ) {

            cambiarNombre();
        }
    }
);


/* ============================================================
   REINICIAR
============================================================ */

function reiniciarJuego() {

    victoria.classList.remove(
        "visible"
    );

    ultimaPosicionGanador =
        null;

    animando = false;

    posicionesVisuales = {};

    enviar({
        tipo: "reiniciar"
    });
}

btnReinicio.addEventListener(
    "click",
    reiniciarJuego
);

btnReinicioVictoria.addEventListener(
    "click",
    reiniciarJuego
);


/* ============================================================
   ABANDONAR
============================================================ */

btnAbandonar.addEventListener(
    "click",
    () => {

        if (
            !confirm(
                "¿Seguro que quieres abandonar la partida?"
            )
        ) {
            return;
        }

        abandonando = true;

        enviar({
            tipo: "abandonar"
        });

        if (socket) {
            socket.close();
        }
    }
);


/* ============================================================
   INICIALIZACIÓN
============================================================ */

crearTablero();

dibujarElementos();

mostrarCaraDado(1);

conectar();

setInterval(
    () => {

        if (
            socket &&
            socket.readyState ===
            WebSocket.OPEN
        ) {

            enviar({
                tipo: "ping"
            });
        }

    },
    15000
);

</script>

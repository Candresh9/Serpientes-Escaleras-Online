<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>🐍 Escaleras y Serpientes</title>

<style>

*{
    box-sizing:border-box;
}

body{

    margin:0;

    min-height:100vh;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:
        radial-gradient(
            circle at top,
            #ffffff,
            #dcecff 45%,
            #c7d8eb
        );

    color:#141414;
}


.app{

    width:min(
        1450px,
        96%
    );

    margin:auto;

    padding:
        25px 0 35px;
}


.titulo{

    text-align:center;

    font-size:
        clamp(
            28px,
            4vw,
            48px
        );

    font-weight:900;

    margin:
        5px 0 25px;

    color:#172b4d;

    text-shadow:
        0 4px 8px
        rgba(0,0,0,.15);
}


.juego{

    display:grid;

    grid-template-columns:
        minmax(
            650px,
            1fr
        )
        340px;

    gap:25px;

    align-items:start;
}


.tablero-contenedor{

    position:relative;

    background:white;

    padding:18px;

    border-radius:24px;

    box-shadow:
        0 15px 40px
        rgba(0,0,0,.15);
}


#tablero{

    position:relative;

    width:100%;

    aspect-ratio:1;

    display:grid;

    grid-template-columns:
        repeat(10,1fr);

    grid-template-rows:
        repeat(10,1fr);

    overflow:hidden;

    border:
        4px solid #171717;

    border-radius:14px;

    background:#fff;
}


.casilla{

    position:relative;

    border:
        1px solid
        rgba(0,0,0,.18);

    display:flex;

    align-items:flex-start;

    justify-content:flex-start;

    padding:5px;

    font-weight:bold;

    font-size:
        clamp(
            10px,
            1.2vw,
            15px
        );
}


.casilla:nth-child(
    odd
){

    background:#fff;

}


.casilla:nth-child(
    even
){

    background:#f0f6ff;

}


.numero{

    position:absolute;

    top:4px;

    left:5px;

    opacity:.65;
}


#svgElementos{

    position:absolute;

    inset:0;

    width:100%;

    height:100%;

    pointer-events:none;

    z-index:5;
}


#fichas{

    position:absolute;

    inset:0;

    pointer-events:none;

    z-index:20;
}


.pieza{

    position:absolute;

    width:36px;

    height:36px;

    border-radius:50%;

    border:
        4px solid white;

    box-shadow:
        0 4px 9px
        rgba(0,0,0,.35);

    transform:
        translate(-50%,-50%);

    transition:
        box-shadow .25s,
        transform .25s;

    z-index:30;
}


.pieza.mia{

    box-shadow:
        0 0 0 4px #ffd600,
        0 5px 12px
        rgba(0,0,0,.35);
}


.pieza.moviendo{

    transform:
        translate(-50%,-50%)
        scale(1.18);

    z-index:100;
}


.pieza.rebote{

    animation:
        rebote .45s
        ease;
}


@keyframes rebote{

    0%{
        transform:
            translate(-50%,-50%)
            scale(1);
    }

    50%{
        transform:
            translate(-50%,-50%)
            scale(1.3);
    }

    100%{
        transform:
            translate(-50%,-50%)
            scale(1);
    }
}


.resaltado-casilla{

    position:absolute;

    width:8%;

    height:8%;

    transform:
        translate(-50%,-50%);

    border:
        5px solid #ffd600;

    border-radius:50%;

    box-shadow:
        0 0 25px
        rgba(255,214,0,.95);

    animation:
        resaltarCasilla
        .8s infinite alternate;

    z-index:15;

    pointer-events:none;
}


@keyframes resaltarCasilla{

    from{
        opacity:.45;
        transform:
            translate(-50%,-50%)
            scale(.85);
    }

    to{
        opacity:1;
        transform:
            translate(-50%,-50%)
            scale(1.1);
    }
}


/* ==========================================================
   PANEL
   ========================================================== */

.panel{

    background:white;

    border-radius:24px;

    padding:22px;

    box-shadow:
        0 15px 40px
        rgba(0,0,0,.15);

    min-height:600px;
}


.panel h2{

    margin:
        0 0 18px;

    text-align:center;

    color:#172b4d;
}


.estado{

    padding:12px;

    border-radius:12px;

    text-align:center;

    font-weight:800;

    background:#edf6ff;

    border:
        2px solid #90caf9;

    margin-bottom:15px;

    transition:
        .25s;
}


.nombre-box{

    display:flex;

    gap:8px;

    margin-bottom:15px;
}


.nombre-box input{

    flex:1;

    min-width:0;

    padding:11px;

    border:
        2px solid #ddd;

    border-radius:10px;

    font-size:15px;
}


.nombre-box button{

    border:none;

    border-radius:10px;

    background:#1976d2;

    color:white;

    font-weight:bold;

    padding:
        0 15px;

    cursor:pointer;
}


.dado-contenedor{

    height:150px;

    display:flex;

    align-items:center;

    justify-content:center;

    perspective:700px;
}


.dado-3d{

    width:85px;

    height:85px;

    position:relative;

    transform-style:preserve-3d;

    transition:
        transform .5s;

}


.cara{

    position:absolute;

    width:85px;

    height:85px;

    border-radius:14px;

    background:#fff;

    border:
        4px solid #222;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:38px;

    font-weight:900;

    box-shadow:
        inset 0 0 15px
        rgba(0,0,0,.08);
}


.cara1{
    transform:
        rotateY(0deg)
        translateZ(42.5px);
}

.cara2{
    transform:
        rotateY(90deg)
        translateZ(42.5px);
}

.cara3{
    transform:
        rotateY(180deg)
        translateZ(42.5px);
}

.cara4{
    transform:
        rotateY(-90deg)
        translateZ(42.5px);
}

.cara5{
    transform:
        rotateX(90deg)
        translateZ(42.5px);
}

.cara6{
    transform:
        rotateX(-90deg)
        translateZ(42.5px);
}


.dado-3d.lanzando{

    animation:
        dadoSacudida
        .18s
        infinite;
}


@keyframes dadoSacudida{

    0%{
        transform:
            rotateX(0)
            rotateY(0)
            rotateZ(0)
            scale(1);
    }

    50%{
        transform:
            rotateX(180deg)
            rotateY(180deg)
            rotateZ(90deg)
            scale(1.08);
    }

    100%{
        transform:
            rotateX(360deg)
            rotateY(360deg)
            rotateZ(180deg)
            scale(1);
    }
}


.resultado{

    text-align:center;

    min-height:32px;

    font-weight:900;

    font-size:20px;

    margin-bottom:12px;
}


.mensaje-efecto{

    animation:
        efectoTexto
        .55s
        ease;
}


@keyframes efectoTexto{

    0%{
        transform:scale(.8);
        opacity:.2;
    }

    60%{
        transform:scale(1.18);
        opacity:1;
    }

    100%{
        transform:scale(1);
    }
}


button.accion{

    width:100%;

    border:none;

    border-radius:13px;

    padding:15px;

    font-size:16px;

    font-weight:900;

    cursor:pointer;

    margin-bottom:10px;

    transition:
        transform .15s,
        opacity .15s,
        box-shadow .15s;
}


button.accion:hover:not(:disabled){

    transform:
        translateY(-2px);

    box-shadow:
        0 7px 15px
        rgba(0,0,0,.18);
}


button.accion:active:not(:disabled){

    transform:
        translateY(1px);
}


button.accion:disabled{

    opacity:.45;

    cursor:not-allowed;
}


#btnDado{

    background:
        linear-gradient(
            135deg,
            #ffca28,
            #ff9800
        );

    color:#171717;
}


#btnReiniciar{

    background:#43a047;

    color:white;
}


#btnAbandonar{

    background:#e53935;

    color:white;
}


.jugadores{

    margin-top:15px;
}


.jugadores h3{

    margin:
        0 0 10px;
}


.jugador{

    display:flex;

    align-items:center;

    gap:9px;

    padding:9px;

    border-radius:10px;

    margin-bottom:7px;

    background:#f4f6f8;

    border:
        2px solid transparent;

    transition:
        .25s;
}


.jugador.turno{

    border:
        3px solid #ffd600;

    background:#fff8d6;

    box-shadow:
        0 3px 9px
        rgba(255,214,0,.3);
}


.jugador .color{

    width:18px;

    height:18px;

    border-radius:50%;

    border:
        2px solid white;

    box-shadow:
        0 1px 4px
        rgba(0,0,0,.3);
}


.jugador .nombre{

    flex:1;

    font-weight:bold;
}


.jugador .casilla{

    position:static;

    padding:0;

    font-size:13px;

    opacity:.7;
}


/* ==========================================================
   MENSAJES
   ========================================================== */

.mensaje-flotante{

    position:fixed;

    left:50%;

    top:35%;

    transform:
        translate(-50%,-50%);

    z-index:500;

    background:
        rgba(20,20,20,.92);

    color:white;

    padding:
        18px 28px;

    border-radius:18px;

    font-size:24px;

    font-weight:900;

    text-align:center;

    pointer-events:none;

    animation:
        mensajeEntrada
        1.8s
        forwards;
}


@keyframes mensajeEntrada{

    0%{
        opacity:0;
        transform:
            translate(-50%,-50%)
            scale(.7);
    }

    15%{
        opacity:1;
        transform:
            translate(-50%,-50%)
            scale(1.05);
    }

    75%{
        opacity:1;
    }

    100%{
        opacity:0;
        transform:
            translate(-50%,-65%)
            scale(1);
    }
}


/* ==========================================================
   PARTICULAS
   ========================================================== */

.particula{

    position:absolute;

    width:9px;

    height:9px;

    border-radius:50%;

    background:#ffd600;

    pointer-events:none;

    z-index:200;

    animation:
        particulaVuelo
        1s
        ease-out
        forwards;
}


@keyframes particulaVuelo{

    from{

        opacity:1;

        transform:
            translate(0,0)
            scale(1);
    }

    to{

        opacity:0;

        transform:
            translate(
                var(--dx),
                var(--dy)
            )
            scale(.2);
    }
}


/* ==========================================================
   VICTORIA
   ========================================================== */

.victoria{

    position:fixed;

    inset:0;

    z-index:1000;

    display:flex;

    align-items:center;

    justify-content:center;

    background:
        rgba(0,0,0,.7);

    backdrop-filter:
        blur(5px);
}


.victoria.oculto{

    display:none;
}


.victoria-box{

    width:min(
        500px,
        90%
    );

    background:white;

    border-radius:28px;

    padding:40px;

    text-align:center;

    box-shadow:
        0 25px 80px
        rgba(0,0,0,.4);

    animation:
        victoriaEntrada
        .7s
        ease;
}


@keyframes victoriaEntrada{

    from{
        opacity:0;
        transform:
            scale(.5)
            rotate(-5deg);
    }

    to{
        opacity:1;
        transform:
            scale(1)
            rotate(0);
    }
}


.trofeo{

    font-size:85px;

    animation:
        trofeo
        1s
        infinite alternate;
}


@keyframes trofeo{

    from{
        transform:
            translateY(0)
            rotate(-5deg);
    }

    to{
        transform:
            translateY(-12px)
            rotate(5deg);
    }
}


.victoria h1{

    margin:
        10px 0;

    color:#ff9800;

    font-size:38px;
}


.victoria p{

    font-size:19px;

    font-weight:bold;
}


/* ==========================================================
   ESCALERAS / SERPIENTES ACTIVAS
   ========================================================== */

.escalera-activa{

    filter:
        drop-shadow(
            0 0 8px
            #00ff66
        );

    animation:
        escaleraGlow
        .7s
        infinite alternate;
}


@keyframes escaleraGlow{

    from{
        opacity:.6;
    }

    to{
        opacity:1;
    }
}


.serpiente-activa{

    filter:
        drop-shadow(
            0 0 8px
            #ff3333
        );

    animation:
        serpienteGlow
        .7s
        infinite alternate;
}


@keyframes serpienteGlow{

    from{
        opacity:.6;
    }

    to{
        opacity:1;
    }
}


/* ==========================================================
   RESPONSIVE
   ========================================================== */

@media(max-width:1050px){

    .juego{

        grid-template-columns:
            1fr;

    }

    .panel{

        width:min(
            700px,
            100%
        );

        margin:auto;
    }

}


@media(max-width:700px){

    .app{

        width:97%;
    }

    .tablero-contenedor{

        padding:8px;
    }

    .pieza{

        width:27px;

        height:27px;

        border-width:3px;
    }

    .panel{

        padding:15px;
    }

}


</style>

</head>

<script>


// ============================================================
// CONFIGURACIÓN
// ============================================================

const SERVER_URL =
    "wss://serpientes-escaleras-phl7.onrender.com";


const ESCALERAS = {

    4:25,

    13:46,

    33:49,

    42:63,

    50:69,

    62:81,

    74:92

};


const SERPIENTES = {

    27:5,

    40:3,

    43:18,

    54:31,

    66:45,

    76:58,

    89:53,

    99:41

};


const COLORES = [

    "#e53935",

    "#1976d2",

    "#43a047",

    "#8e24aa"

];


// ============================================================
// DOM
// ============================================================

const tablero =
    document.getElementById(
        "tablero"
    );


const svgElementos =
    document.getElementById(
        "svgElementos"
    );


const fichas =
    document.getElementById(
        "fichas"
    );


const estadoConexion =
    document.getElementById(
        "estadoConexion"
    );


const nombreJugador =
    document.getElementById(
        "nombreJugador"
    );


const btnNombre =
    document.getElementById(
        "btnNombre"
    );


const btnDado =
    document.getElementById(
        "btnDado"
    );


const btnReiniciar =
    document.getElementById(
        "btnReiniciar"
    );


const btnAbandonar =
    document.getElementById(
        "btnAbandonar"
    );


const listaJugadores =
    document.getElementById(
        "listaJugadores"
    );


const dado3d =
    document.getElementById(
        "dado3d"
    );


const resultadoDado =
    document.getElementById(
        "resultadoDado"
    );


const victoria =
    document.getElementById(
        "victoria"
    );


const textoVictoria =
    document.getElementById(
        "textoVictoria"
    );


const btnVictoriaReiniciar =
    document.getElementById(
        "btnVictoriaReiniciar"
    );


// ============================================================
// ESTADO
// ============================================================

let socket = null;


let estado = {

    mi_id:null,

    jugadores:{},

    turno:null,

    ganador:null,

    ultimo_dado:null,

    ultimo_evento:
        "Conectando al servidor..."

};


let posicionesVisuales = {};


let animando = false;


let abandonando = false;


let ultimaPosicionGanador = null;


let dadoTerminado = true;


let resultadoDadoPendiente = null;


// ============================================================
// UTILIDADES
// ============================================================

function dormir(ms){

    return new Promise(
        resolver =>
            setTimeout(
                resolver,
                ms
            )
    );

}


function escapeHTML(texto){

    return String(texto)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


// ============================================================
// TABLERO
// ============================================================

function crearTablero(){

    tablero.querySelectorAll(
        ".casilla"
    ).forEach(
        elemento =>
            elemento.remove()
    );


    for(
        let numero = 100;
        numero >= 1;
        numero--
    ){

        const casilla =
            document.createElement(
                "div"
            );


        casilla.className =
            "casilla";


        casilla.dataset.numero =
            numero;


        const numeroElemento =
            document.createElement(
                "span"
            );


        numeroElemento.className =
            "numero";


        numeroElemento.textContent =
            numero;


        casilla.appendChild(
            numeroElemento
        );


        tablero.insertBefore(
            casilla,
            svgElementos
        );

    }

}


function posicionCasilla(numero){

    numero =
        Math.max(
            1,
            Math.min(
                100,
                Number(numero)
            )
        );


    const indice =
        numero - 1;


    const fila =
        Math.floor(
            indice / 10
        );


    const columna =
        indice % 10;


    const filaVisual =
        9 - fila;


    let columnaVisual;


    if(
        fila % 2 === 0
    ){

        columnaVisual =
            columna;

    }

    else{

        columnaVisual =
            9 - columna;

    }


    return {

        x:
            columnaVisual * 10 + 5,

        y:
            filaVisual * 10 + 5

    };

}


function centroCasilla(numero){

    return posicionCasilla(
        numero
    );

}


// ============================================================
// SVG
// ============================================================

function crearSVG(){

    svgElementos.innerHTML = `

        <svg
            id="svgTablero"
            viewBox="0 0 100 100"
            preserveAspectRatio="none"
            width="100%"
            height="100%"
        >

            <g id="grupoEscaleras"></g>

            <g id="grupoSerpientes"></g>

        </svg>

    `;

}


function dibujarElementos(){

    const svg =
        document.getElementById(
            "svgTablero"
        );


    if(!svg) return;


    const grupoEscaleras =
        document.getElementById(
            "grupoEscaleras"
        );


    const grupoSerpientes =
        document.getElementById(
            "grupoSerpientes"
        );


    grupoEscaleras.innerHTML = "";


    grupoSerpientes.innerHTML = "";


    for(
        const [desde,hasta]
        of Object.entries(
            ESCALERAS
        )
    ){

        const a =
            centroCasilla(
                Number(desde)
            );


        const b =
            centroCasilla(
                Number(hasta)
            );


        const dx =
            b.x - a.x;


        const dy =
            b.y - a.y;


        const longitud =
            Math.sqrt(
                dx*dx + dy*dy
            );


        const angulo =
            Math.atan2(
                dy,
                dx
            ) *
            180 /
            Math.PI;


        const x1 =
            a.x -
            1.5 *
            Math.sin(
                angulo *
                Math.PI /
                180
            );


        const y1 =
            a.y +
            1.5 *
            Math.cos(
                angulo *
                Math.PI /
                180
            );


        const x2 =
            b.x -
            1.5 *
            Math.sin(
                angulo *
                Math.PI /
                180
            );


        const y2 =
            b.y +
            1.5 *
            Math.cos(
                angulo *
                Math.PI /
                180
            );


        const rail1 =
            document.createElementNS(
                "http://www.w3.org/2000/svg",
                "line"
            );


        rail1.setAttribute(
            "x1",
            x1
        );

        rail1.setAttribute(
            "y1",
            y1
        );

        rail1.setAttribute(
            "x2",
            x2
        );

        rail1.setAttribute(
            "y2",
            y2
        );

        rail1.setAttribute(
            "stroke",
            "#1eaa4d"
        );

        rail1.setAttribute(
            "stroke-width",
            "1.5"
        );

        rail1.setAttribute(
            "stroke-linecap",
            "round"
        );


        const rail2 =
            rail1.cloneNode();


        rail2.setAttribute(
            "x1",
            a.x +
            1.5 *
            Math.sin(
                angulo *
                Math.PI /
                180
            )
        );


        rail2.setAttribute(
            "y1",
            a.y -
            1.5 *
            Math.cos(
                angulo *
                Math.PI /
                180
            )
        );


        rail2.setAttribute(
            "x2",
            b.x +
            1.5 *
            Math.sin(
                angulo *
                Math.PI /
                180
            )
        );


        rail2.setAttribute(
            "y2",
            b.y -
            1.5 *
            Math.cos(
                angulo *
                Math.PI /
                180
            )
        );


        grupoEscaleras.appendChild(
            rail1
        );

        grupoEscaleras.appendChild(
            rail2
        );


        const cantidadEscalones =
            Math.max(
                3,
                Math.floor(
                    longitud / 5
                )
            );


        for(
            let i = 1;
            i < cantidadEscalones;
            i++
        ){

            const t =
                i /
                cantidadEscalones;


            const cx =
                a.x +
                dx * t;


            const cy =
                a.y +
                dy * t;


            const rung =
                document.createElementNS(
                    "http://www.w3.org/2000/svg",
                    "line"
                );


            rung.setAttribute(
                "x1",
                cx -
                2.5 *
                Math.sin(
                    angulo *
                    Math.PI /
                    180
                )
            );


            rung.setAttribute(
                "y1",
                cy +
                2.5 *
                Math.cos(
                    angulo *
                    Math.PI /
                    180
                )
            );


            rung.setAttribute(
                "x2",
                cx +
                2.5 *
                Math.sin(
                    angulo *
                    Math.PI /
                    180
                )
            );


            rung.setAttribute(
                "y2",
                cy -
                2.5 *
                Math.cos(
                    angulo *
                    Math.PI /
                    180
                )
            );


            rung.setAttribute(
                "stroke",
                "#27b957"
            );


            rung.setAttribute(
                "stroke-width",
                "1"
            );


            grupoEscaleras.appendChild(
                rung
            );

        }

    }


    // ========================================================
    // SERPIENTES
    // ========================================================

    for(
        const [desde,hasta]
        of Object.entries(
            SERPIENTES
        )
    ){

        const a =
            centroCasilla(
                Number(desde)
            );


        const b =
            centroCasilla(
                Number(hasta)
            );


        const dx =
            b.x - a.x;


        const dy =
            b.y - a.y;


        const longitud =
            Math.sqrt(
                dx*dx + dy*dy
            );


        const normalX =
            -dy /
            Math.max(
                longitud,
                1
            );


        const normalY =
            dx /
            Math.max(
                longitud,
                1
            );


        const puntos = [];


        const pasos =
            Math.max(
                8,
                Math.floor(
                    longitud / 3
                )
            );


        for(
            let i=0;
            i<=pasos;
            i++
        ){

            const t =
                i /
                pasos;


            const curva =
                Math.sin(
                    t *
                    Math.PI *
                    4
                ) *
                2.5;


            puntos.push(

                `${
                    a.x +
                    dx*t +
                    normalX*curva
                },${
                    a.y +
                    dy*t +
                    normalY*curva
                }`

            );

        }


        const cuerpo =
            document.createElementNS(
                "http://www.w3.org/2000/svg",
                "polyline"
            );


        cuerpo.setAttribute(
            "points",
            puntos.join(" ")
        );


        cuerpo.setAttribute(
            "fill",
            "none"
        );


        cuerpo.setAttribute(
            "stroke",
            "#d23232"
        );


        cuerpo.setAttribute(
            "stroke-width",
            "3"
        );


        cuerpo.setAttribute(
            "stroke-linecap",
            "round"
        );


        cuerpo.setAttribute(
            "stroke-linejoin",
            "round"
        );


        grupoSerpientes.appendChild(
            cuerpo
        );


        const cabeza =
            document.createElementNS(
                "http://www.w3.org/2000/svg",
                "circle"
            );


        cabeza.setAttribute(
            "cx",
            a.x
        );


        cabeza.setAttribute(
            "cy",
            a.y
        );


        cabeza.setAttribute(
            "r",
            "2.5"
        );


        cabeza.setAttribute(
            "fill",
            "#a51f1f"
        );


        grupoSerpientes.appendChild(
            cabeza
        );

    }

}

// ============================================================

function obtenerJugador(
    jugadores,
    id
){

    if(!jugadores)
        return null;


    return (
        jugadores[id] ||
        jugadores[String(id)] ||
        null
    );

}


function obtenerNombreJugador(
    jugador,
    id
){

    if(
        jugador &&
        jugador.nombre
    ){

        return jugador.nombre;

    }


    return `Jugador ${id}`;

}


function obtenerPosicionJugador(
    jugador
){

    if(!jugador)
        return 1;


    if(
        jugador.posicion !== undefined
    ){

        return Number(
            jugador.posicion
        );

    }


    if(
        jugador.casilla !== undefined
    ){

        return Number(
            jugador.casilla
        );

    }


    return 1;

}


function obtenerColorJugador(
    jugador,
    id
){

    if(
        jugador &&
        jugador.color
    ){

        return jugador.color;

    }


    return COLORES[
        (Number(id)-1)
        %
        COLORES.length
    ];

}


// ============================================================
// RENDERIZAR JUGADORES
// ============================================================

function renderizarFichas(){

    fichas.innerHTML = "";


    const jugadores =
        estado.jugadores || {};


    const ids =
        Object.keys(
            jugadores
        );


    const gruposCasilla = {};


    ids.forEach(
        id => {

            const jugador =
                jugadores[id];


            const posicion =
                obtenerPosicionJugador(
                    jugador
                );


            if(
                !gruposCasilla[posicion]
            ){

                gruposCasilla[posicion] =
                    [];

            }


            gruposCasilla[posicion].push(
                id
            );

        }
    );


    ids.forEach(
        id => {

            const jugador =
                jugadores[id];


            const posicion =
                obtenerPosicionJugador(
                    jugador
                );


            const p =
                posicionCasilla(
                    posicion
                );


            const ficha =
                document.createElement(
                    "div"
                );


            ficha.className =
                "pieza";


            if(
                Number(id) ===
                Number(estado.mi_id)
            ){

                ficha.classList.add(
                    "mia"
                );

            }


            ficha.id =
                `pieza-${id}`;


            ficha.style.background =
                obtenerColorJugador(
                    jugador,
                    id
                );


            const grupo =
                gruposCasilla[
                    posicion
                ];


            const indice =
                grupo.indexOf(
                    id
                );


            const offsets = [

                [0,0],

                [-2.2,-2.2],

                [2.2,2.2],

                [-2.2,2.2]

            ];


            const offset =
                offsets[
                    indice %
                    offsets.length
                ];


            ficha.style.left =
                `${p.x + offset[0]}%`;


            ficha.style.top =
                `${p.y + offset[1]}%`;


            fichas.appendChild(
                ficha
            );


            posicionesVisuales[id] =
                posicion;

        }
    );

}

const ROTACIONES_DADO = {

    1:
        "rotateX(0deg) rotateY(0deg) rotateZ(0deg)",

    2:
        "rotateX(0deg) rotateY(-90deg) rotateZ(0deg)",

    3:
        "rotateX(0deg) rotateY(180deg) rotateZ(0deg)",

    4:
        "rotateX(0deg) rotateY(90deg) rotateZ(0deg)",

    5:
        "rotateX(-90deg) rotateY(0deg) rotateZ(0deg)",

    6:
        "rotateX(90deg) rotateY(0deg) rotateZ(0deg)"

};


function mostrarCaraDado(
    numero
){

    dado3d.style.transform =
        ROTACIONES_DADO[
            numero
        ] ||
        ROTACIONES_DADO[1];

}


async function animarDado(
    resultado
){

    dadoTerminado = false;


    btnDado.disabled = true;


    dado3d.classList.add(
        "lanzando"
    );


    resultadoDado.textContent =
        "🎲 Lanzando...";


    resultadoDado.classList.remove(
        "mensaje-efecto"
    );


    const rondas = 20;


    for(
        let i=0;
        i<rondas;
        i++
    ){

        const cara =
            1 +
            Math.floor(
                Math.random()*6
            );


        mostrarCaraDado(
            cara
        );


        await dormir(100);

    }


    dado3d.classList.remove(
        "lanzando"
    );


    mostrarCaraDado(
        Number(resultado)
    );


    resultadoDado.textContent =
        `🎲 Salió ${resultado}`;


    resultadoDado.classList.remove(
        "mensaje-efecto"
    );


    void resultadoDado.offsetWidth;


    resultadoDado.classList.add(
        "mensaje-efecto"
    );


    // IMPORTANTE:
    // El dado termina completamente antes
    // de mover la ficha.

    await dormir(900);


    dadoTerminado = true;


    if(
        resultadoDadoPendiente
    ){

        const movimiento =
            resultadoDadoPendiente;


        resultadoDadoPendiente =
            null;


        await ejecutarMovimientoPendiente(
            movimiento
        );

    }


    actualizarBotonDado();

}


// ============================================================
// MOVIMIENTO SUAVE
// ============================================================

function easeInOutCubic(t){

    return t < .5

        ? 4*t*t*t

        : 1 -
          Math.pow(
              -2*t+2,
              3
          ) / 2;

}


function moverElementoSuave(
    id,
    desde,
    hasta,
    duracion=450
){

    return new Promise(
        resolver => {

            const elemento =
                document.getElementById(
                    `pieza-${id}`
                );


            if(!elemento){

                resolver();

                return;

            }


            const inicio =
                posicionCasilla(
                    desde
                );


            const fin =
                posicionCasilla(
                    hasta
                );


            const comienzo =
                performance.now();


            elemento.classList.add(
                "moviendo"
            );


            function animar(
                tiempo
            ){

                const progreso =
                    Math.min(
                        1,
                        (
                            tiempo -
                            comienzo
                        ) /
                        duracion
                    );


                const suave =
                    easeInOutCubic(
                        progreso
                    );


                const x =
                    inicio.x +
                    (
                        fin.x -
                        inicio.x
                    ) *
                    suave;


                const y =
                    inicio.y +
                    (
                        fin.y -
                        inicio.y
                    ) *
                    suave;


                elemento.style.left =
                    `${x}%`;


                elemento.style.top =
                    `${y}%`;


                if(
                    progreso < 1
                ){

                    requestAnimationFrame(
                        animar
                    );

                }

                else{

                    elemento.style.left =
                        `${fin.x}%`;


                    elemento.style.top =
                        `${fin.y}%`;


                    elemento.classList.remove(
                        "moviendo"
                    );


                    resolver();

                }

            }


            requestAnimationFrame(
                animar
            );

        }
    );

}


// ============================================================
// MOVIMIENTO CASILLA POR CASILLA
// ============================================================

async function moverFichaPorCasillas(
    id,
    inicio,
    final,
    velocidad=360
){

    if(
        inicio === final
    ){

        await reboteFicha(
            id
        );

        return;

    }


    const paso =
        final > inicio
            ? 1
            : -1;


    let actual =
        inicio;


    while(
        actual !== final
    ){

        const siguiente =
            actual + paso;


        await moverElementoSuave(
            id,
            actual,
            siguiente,
            velocidad
        );


        actual =
            siguiente;


        await dormir(60);

    }

}


async function reboteFicha(

){

        document.getElementById(
            `pieza-${id}`

        return;


    elemento.classList.add(

    );


    await dormir(450);


    elemento.classList.remove(
        "rebote"

}

// ============================================================

function crearParticulas(
    numeroCasilla,
    cantidad=25
){

    const posicion =
        posicionCasilla(
            numeroCasilla
        );


    for(
        let i=0;
        i<cantidad;
        i++
    ){

        const particula =
            document.createElement(
                "div"
            );


        particula.className =
            "particula";


        particula.style.left =
            `${posicion.x}%`;


        particula.style.top =
            `${posicion.y}%`;


        const angulo =
            Math.random() *
            Math.PI *
            2;


        const distancia =
            30 +
            Math.random() *
            120;


        particula.style.setProperty(
            "--dx",
            `${Math.cos(angulo)*distancia}px`
        );


        particula.style.setProperty(
            "--dy",
            `${Math.sin(angulo)*distancia}px`
        );


        fichas.appendChild(
            particula
        );


        setTimeout(
            () =>
                particula.remove(),
            1100
        );

    }

}

}


// ============================================================
// ANIMAR MOVIMIENTO
// ============================================================

async function animarMovimientoJugador(
    id,
    posicionAnterior,
    posicionFinal,
    dado
){

    animando = true;


    actualizarBotonDado();


    const jugador =
        obtenerJugador(
            estado.jugadores,
            id
        );


    let intermedia =
        Number(
            posicionAnterior
        ) +
        Number(
            dado
        );


    if(intermedia > 100){

        intermedia =
            posicionAnterior;

    }


    // --------------------------------------------------------
    // MOVIMIENTO NORMAL
    // --------------------------------------------------------

    if(
        posicionAnterior !==
        intermedia
    ){

        await moverFichaPorCasillas(
            id,
            Number(posicionAnterior),
            Number(intermedia),
            330
        );

    }

    else{

        await reboteFicha(
            id
        );

    }


    // --------------------------------------------------------
    // ESCALERA
    // --------------------------------------------------------

    if(
        ESCALERAS[
            intermedia
        ]
    ){

        const destino =
            ESCALERAS[
                intermedia
            ];


        await resaltarCasilla(
            intermedia,
            850
        );


        await activarEscalera(
            intermedia,
            destino
        );


        await moverElementoSuave(
            id,
            intermedia,
            destino,
            1500
        );


        crearParticulas(
            destino,
            35
        );


        await dormir(
            300
        );

    }


    // --------------------------------------------------------
    // SERPIENTE
    // --------------------------------------------------------

    else if(
        SERPIENTES[
            intermedia
        ]
    ){

        const destino =
            SERPIENTES[
                intermedia
            ];


        await resaltarCasilla(
            intermedia,
            850
        );


        await activarSerpiente(
            intermedia,
            destino
        );


        await moverElementoSuave(
            id,
            intermedia,
            destino,
            1700
        );


        crearParticulas(
            destino,
            30
        );


        await dormir(
            300
        );

    }


    // --------------------------------------------------------
    // CORRECCIÓN FINAL DEL SERVIDOR
    // --------------------------------------------------------

    if(
        Number(posicionFinal) !==
        Number(intermedia)
    ){

        await moverElementoSuave(
            id,
            intermedia,
            Number(posicionFinal),
            500
        );

    }


    posicionesVisuales[id] =
        Number(posicionFinal);


    animando = false;


    actualizarBotonDado();

}


// ============================================================
// EJECUTAR MOVIMIENTO PENDIENTE
// ============================================================

async function ejecutarMovimientoPendiente(
    movimiento
){

    if(!movimiento)
        return;


    await animarMovimientoJugador(

        movimiento.jugador_id,

        Number(
            movimiento.posicion_anterior
        ),

        Number(
            movimiento.posicion
        ),

        Number(
            movimiento.dado
        )

    );


    renderizarFichas();


    renderizarJugadores();


    actualizarMensajeEstado();


    actualizarBotonDado();


    if(
        estado.ganador !== null &&
        estado.ganador !== undefined
    ){

        mostrarVictoria(
            estado.ganador
        );

    }

}


// ============================================================
// VICTORIA
// ============================================================

function mostrarVictoria(
    ganadorId
){

    const jugador =
        obtenerJugador(
            estado.jugadores,
            ganadorId
        );


    const nombre =
        obtenerNombreJugador(
            jugador,
            ganadorId
        );


    if(
        Number(ganadorId) ===
        Number(estado.mi_id)
    ){

        textoVictoria.textContent =
            `🎉 ¡${nombre}, has ganado!`;

    }

    else{

        textoVictoria.textContent =
            `🏆 ¡${nombre} ganó la partida!`;

    }


    victoria.classList.remove(
        "oculto"
    );


    crearParticulas(
        100,
        70
    );

}


// ============================================================
// OCULTAR VICTORIA
// ============================================================

function ocultarVictoria(){

    victoria.classList.add(
        "oculto"
    );

}


// ============================================================
// ENVIAR
// ============================================================

function enviar(
    datos
){

    if(
        !socket ||
        socket.readyState !==
        WebSocket.OPEN
    ){

        return false;

    }


    try{

        socket.send(
            JSON.stringify(
                datos
            )
        );


        return true;

    }

    catch(error){

        console.error(
            error
        );


        return false;

    }

}


// ============================================================
// RECIBIR ESTADO
// ============================================================

async function recibirEstado(
    nuevoEstado
){

    const miIdAnterior =
        estado.mi_id;


    const jugadoresAnteriores =
        estado.jugadores ||
        {};


    const nuevoJugadorId =
        nuevoEstado.mi_id ??
        nuevoEstado.jugador_id ??
        nuevoEstado.id ??
        miIdAnterior;


    // IMPORTANTE:
    // No perder mi_id al recibir un estado.

    estado = {

        ...estado,

        ...nuevoEstado,

        mi_id:
            nuevoJugadorId,

        turno:
            nuevoEstado.turno ??
            nuevoEstado.jugador_turno ??
            nuevoEstado.turno_actual ??
            estado.turno,

        jugadores:
            nuevoEstado.jugadores ??
            estado.jugadores ??
            {}

    };


    // --------------------------------------------------------
    // Si llegó estado con ganador
    // --------------------------------------------------------

    if(
        estado.ganador !== null &&
        estado.ganador !== undefined
    ){

        ultimaPosicionGanador =
            estado.ganador;

    }


    // --------------------------------------------------------
    // Render básico
    // --------------------------------------------------------

    renderizarJugadores();


    actualizarMensajeEstado();


    actualizarBotonDado();


    // --------------------------------------------------------
    // Actualizar fichas
    // --------------------------------------------------------

    const ids =
        Object.keys(
            estado.jugadores
        );


    // Si no hay movimiento activo,
    // colocar fichas nuevas.

    if(!animando){

        ids.forEach(
            id => {

                const jugador =
                    estado.jugadores[id];


                const nuevaPosicion =
                    obtenerPosicionJugador(
                        jugador
                    );


                if(
                    !posicionesVisuales[id]
                ){

                    posicionesVisuales[id] =
                        nuevaPosicion;

                }

            }
        );

    }


    renderizarFichas();

}


// ============================================================
// RESULTADO DEL DADO
// ============================================================

async function recibirResultadoDado(
    datos
){

    const resultado =
        Number(
            datos.dado ??
            datos.ultimo_dado
        );


    if(
        !Number.isFinite(
            resultado
        )
    ){

        return;

    }


    // Actualizamos el turno que vino
    // del servidor.

    if(
        datos.turno !== undefined
    ){

        estado.turno =
            datos.turno;

    }


    // --------------------------------------------------------
    // ANIMACIÓN DEL DADO
    // --------------------------------------------------------

    animarDado(
        resultado
    );


    // --------------------------------------------------------
    // Preparar movimiento
    // --------------------------------------------------------

    const movimiento = {

        jugador_id:
            Number(
                datos.jugador_id
            ),

        dado:
            resultado,

        posicion_anterior:
            Number(
                datos.posicion_anterior
            ),

        posicion:
            Number(
                datos.posicion
            )

    };


    // --------------------------------------------------------
    // El movimiento espera a que termine
    // completamente el dado.
    // --------------------------------------------------------

    resultadoDadoPendiente =
        movimiento;

}


// ============================================================
// CONEXIÓN WEBSOCKET
// ============================================================

function conectar(){

    estadoConexion.textContent =
        "🟡 Conectando al servidor...";


    estadoConexion.style.background =
        "#fff8e1";


    estadoConexion.style.borderColor =
        "#ffca28";


    try{

        socket =
            new WebSocket(
                SERVER_URL
            );

    }

    catch(error){

        estadoConexion.textContent =
            "🔴 Error creando conexión";

        return;

    }


    socket.onopen = () => {

        console.log(
            "WebSocket conectado"
        );


        estadoConexion.textContent =
            "🟢 Conectado. Esperando jugadores...";


        estadoConexion.style.background =
            "#e8f5e9";


        estadoConexion.style.borderColor =
            "#81c784";


        actualizarBotonDado();

    };


    socket.onmessage =
        async evento => {

            try{

                const datos =
                    JSON.parse(
                        evento.data
                    );


                console.log(
                    "Servidor:",
                    datos
                );


                // ==========================================
                // CONEXIÓN
                // ==========================================

                if(
                    datos.tipo ===
                    "conexion"
                ){

                    estado = {

                        ...estado,

                        ...datos,

                        mi_id:
                            datos.mi_id ??
                            datos.jugador_id ??
                            estado.mi_id,

                        turno:
                            datos.turno ??
                            estado.turno,

                        jugadores:
                            datos.jugadores ??
                            estado.jugadores ??
                            {}

                    };


                    renderizarJugadores();

                    renderizarFichas();

                    actualizarMensajeEstado();

                    actualizarBotonDado();

                    return;

                }


                // ==========================================
                // ESTADO
                // ==========================================

                if(
                    datos.tipo ===
                    "estado"
                ){

                    await recibirEstado(
                        datos
                    );

                    return;

                }


                // ==========================================
                // RESULTADO DADO
                // ==========================================

                if(
                    datos.tipo ===
                    "resultado_dado"
                ){

                    await recibirResultadoDado(
                        datos
                    );

                    return;

                }


                // ==========================================
                // MENSAJE
                // ==========================================

                if(
                    datos.tipo ===
                    "mensaje"
                ){

                    mostrarMensaje(
                        datos.mensaje ||
                        ""
                    );

                    return;

                }


                // ==========================================
                // LLENO
                // ==========================================

                if(
                    datos.tipo ===
                    "lleno"
                ){

                    estadoConexion.textContent =
                        "🔴 Servidor lleno";


                    btnDado.disabled =
                        true;


                    mostrarMensaje(
                        datos.mensaje ||
                        "Servidor lleno."
                    );


                    return;

                }


                // ==========================================
                // ERROR
                // ==========================================

                if(
                    datos.tipo ===
                    "error"
                ){

                    mostrarMensaje(
                        datos.mensaje ||
                        "Error del servidor."
                    );


                    return;

                }


                // ==========================================
                // SERVIDOR CERRANDO
                // ==========================================

                if(
                    datos.tipo ===
                    "servidor_cerrando"
                ){

                    mostrarMensaje(
                        datos.mensaje ||
                        "Conexión cerrada."
                    );


                    return;

                }

            }

            catch(error){

                console.error(
                    "Error procesando mensaje:",
                    error
                );

            }

        };


    socket.onerror = error => {

        console.error(
            "WebSocket error:",
            error
        );


        estadoConexion.textContent =
            "🔴 Error de conexión";


        estadoConexion.style.background =
            "#ffebee";


        estadoConexion.style.borderColor =
            "#ef9a9a";


        btnDado.disabled =
            true;

    };


    socket.onclose = () => {

        console.log(
            "WebSocket cerrado"
        );


        estadoConexion.textContent =
            "🔴 Desconectado";


        estadoConexion.style.background =
            "#ffebee";


        estadoConexion.style.borderColor =
            "#ef9a9a";


        btnDado.disabled =
            true;

    };

}


// ============================================================
// BOTÓN NOMBRE
// ============================================================

btnNombre.onclick = () => {

    const nombre =
        nombreJugador.value.trim();


    if(!nombre){

        mostrarMensaje(
            "Escribe tu nombre."
        );

        return;

    }


    enviar({

        tipo:"nombre",

        nombre:nombre

    });


    nombreJugador.blur();

};


nombreJugador.addEventListener(
    "keydown",
    evento => {

        if(
            evento.key ===
            "Enter"
        ){

            btnNombre.click();

        }

    }
);


// ============================================================
// BOTÓN DADO
// ============================================================

btnDado.onclick = () => {

    if(animando)
        return;


    if(
        !socket ||
        socket.readyState !==
        WebSocket.OPEN
    ){

        mostrarMensaje(
            "No estás conectado."
        );

        return;

    }


    if(
        estado.mi_id === null ||
        estado.mi_id === undefined
    ){

        mostrarMensaje(
            "Esperando identificación..."
        );

        return;

    }


    if(
        estado.turno === null ||
        estado.turno === undefined
    ){

        mostrarMensaje(
            "Todavía no hay turno."
        );

        return;

    }


    if(
        Number(
            estado.turno
        ) !==
        Number(
            estado.mi_id
        )
    ){

        const jugador =
            obtenerJugador(
                estado.jugadores,
                estado.turno
            );


        mostrarMensaje(
            `Es turno de ${
                obtenerNombreJugador(
                    jugador,
                    estado.turno
                )
            }`
        );


        return;

    }


    animando = true;


    dadoTerminado = false;


    resultadoDadoPendiente =
        null;


    btnDado.disabled =
        true;


    enviar({

        tipo:
            "lanzar_dado"

    });

};


// ============================================================
// REINICIAR
// ============================================================

function reiniciarPartida(){

    ocultarVictoria();


    posicionesVisuales = {};


    animando = false;


    dadoTerminado = true;


    resultadoDadoPendiente =
        null;


    mostrarCaraDado(1);


    resultadoDado.textContent =
        "🎲 Esperando...";


    enviar({

        tipo:
            "reiniciar"

    });

}


btnReiniciar.onclick =
    reiniciarPartida;


btnVictoriaReiniciar.onclick =
    reiniciarPartida;


// ============================================================
// ABANDONAR
// ============================================================

btnAbandonar.onclick = () => {

    if(!abandonando){

        abandonando = true;


        btnAbandonar.textContent =
            "⚠️ CONFIRMAR ABANDONO";


        return;

    }


    enviar({

        tipo:
            "abandonar"

    });


    abandonando = false;


    btnAbandonar.textContent =
        "🚪 ABANDONAR";


    btnDado.disabled =
        true;

};


// ============================================================
// PING

setInterval(

);


// ============================================================
// INICIO

crearTablero();

crearSVG();

dibujarElementos();

mostrarCaraDado(1);

conectar();


</script>

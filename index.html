<!DOCTYPE html>
<html lang="es">
<head>

<title>Serpientes y Escaleras Online</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;

    background:
        radial-gradient(circle at top left, #dff6ff, transparent 35%),
        radial-gradient(circle at bottom right, #e8dcff, transparent 35%),
        #eef2f7;

    color: #222;
}

/* ============================================================
   APP
   ============================================================ */

.app {
    width: min(1450px, 96%);
    margin: auto;
    padding: 20px;
}

.titulo {
    text-align: center;
    font-size: clamp(26px, 4vw, 44px);
    font-weight: 900;
    margin-bottom: 20px;

    color: #222;

    text-shadow:
        2px 2px 0 #fff,
        4px 4px 0 rgba(0,0,0,.08);
}

/* ============================================================
   CONTENEDOR PRINCIPAL
   ============================================================ */

.juego {
    display: grid;
    grid-template-columns: minmax(500px, 1fr) 340px;
    gap: 20px;
    align-items: start;
}

/* ============================================================
   TABLERO
   ============================================================ */

.tablero-contenedor {
    position: relative;

    background: white;

    border-radius: 24px;

    padding: 20px;

    box-shadow:
        0 20px 50px rgba(0,0,0,.12);

    overflow: hidden;
}

#tablero {
    position: relative;

    width: 100%;
    max-width: 760px;

    aspect-ratio: 1 / 1;

    margin: auto;

    display: grid;

    grid-template-columns: repeat(10, 1fr);
    grid-template-rows: repeat(10, 1fr);

    border: 5px solid #222;

    border-radius: 18px;

    overflow: hidden;

    background: white;
}

/* ============================================================
   CASILLAS
   ============================================================ */

.casilla {
    position: relative;

    display: flex;
    align-items: center;
    justify-content: center;

    border: 1px solid rgba(0,0,0,.13);

    font-size: clamp(11px, 1.3vw, 18px);

    font-weight: 900;

    user-select: none;

    transition:
        transform .15s ease,
        filter .15s ease;
}

.casilla:nth-child(odd) {
    background: #fffdf5;
}

.casilla:nth-child(even) {
    background: #eaf5ff;
}

.numero {
    position: absolute;

    top: 5px;
    left: 6px;

    font-size: clamp(10px, 1.2vw, 16px);

    color: #333;

    z-index: 2;
}

.meta {
    background:
        radial-gradient(circle, #fff8c9, #ffe66d);

    box-shadow:
        inset 0 0 0 4px #f4c430;
}

/* ============================================================
   SVG
   ============================================================ */

#svgElementos {
    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    pointer-events: none;

    z-index: 5;
}

/* ============================================================
   CAPA DE FICHAS
   ============================================================ */

#capaFichas {
    position: absolute;

    inset: 0;

    pointer-events: none;

    z-index: 20;
}

.pieza {
    position: absolute;

    width: 34px;
    height: 34px;

    border-radius: 50%;

    transform:
        translate(-50%, -50%);

    border: 3px solid white;

    box-shadow:
        0 5px 10px rgba(0,0,0,.35);

    display: flex;
    align-items: center;
    justify-content: center;

    color: white;

    font-size: 13px;

    font-weight: 900;

    transition:
        filter .2s ease,
        box-shadow .2s ease;

    z-index: 30;
}

.pieza.mia {
    border-color: #ffd740;

    box-shadow:
        0 0 0 4px rgba(255,215,64,.35),
        0 5px 12px rgba(0,0,0,.4);
}

.pieza.moviendo {
    z-index: 50;

    transform:
        translate(-50%, -50%)
        scale(1.15);

    box-shadow:
        0 0 20px rgba(255,215,64,.8),
        0 7px 15px rgba(0,0,0,.35);
}

.pieza.rebote {
    animation: reboteFicha .45s ease;
}

@keyframes reboteFicha {

    0% {
        transform:
            translate(-50%, -50%)
            scale(1);
    }

    50% {
        transform:
            translate(-50%, -50%)
            scale(1.35);
    }

    100% {
        transform:
            translate(-50%, -50%)
            scale(1);
    }
}

/* ============================================================
   RESALTADO
   ============================================================ */

.resaltado-casilla {
    position: absolute;

    width: 8%;
    height: 8%;

    transform:
        translate(-50%, -50%);

    border-radius: 50%;

    pointer-events: none;

    z-index: 15;

    border: 5px solid #ffd740;

    box-shadow:
        0 0 15px #ffd740,
        0 0 35px rgba(255,215,64,.7);

    animation:
        resaltarCasilla 1s ease infinite;
}

@keyframes resaltarCasilla {

    0%,
    100% {
        opacity: .4;
        transform:
            translate(-50%, -50%)
            scale(.8);
    }

    50% {
        opacity: 1;
        transform:
            translate(-50%, -50%)
            scale(1.15);
    }
}

/* ============================================================
   ESCALERAS Y SERPIENTES
   ============================================================ */

.escalera-activa {
    filter:
        drop-shadow(0 0 8px #00ff66)
        drop-shadow(0 0 15px #00ff66);
}

.serpiente-activa {
    filter:
        drop-shadow(0 0 8px #ff3333)
        drop-shadow(0 0 15px #ff3333);
}

/* ============================================================
   PARTICULAS
   ============================================================ */

.particula {
    position: absolute;

    width: 8px;
    height: 8px;

    border-radius: 50%;

    pointer-events: none;

    z-index: 60;

    animation:
        particulaVuelo .9s ease-out forwards;
}

@keyframes particulaVuelo {

    0% {
        opacity: 1;

        transform:
            translate(0,0)
            scale(1);
    }

    100% {
        opacity: 0;

        transform:
            translate(
                var(--dx),
                var(--dy)
            )
            scale(.2);
    }
}

/* ============================================================
   PANEL
   ============================================================ */

.panel {

    background: white;

    border-radius: 24px;

    padding: 22px;

    box-shadow:
        0 20px 50px rgba(0,0,0,.12);

    min-height: 600px;
}

.panel h2 {
    margin-top: 0;

    text-align: center;

    font-size: 26px;
}

/* ============================================================
   ESTADO
   ============================================================ */

.estado-box {

    padding: 12px;

    border-radius: 14px;

    background: #f1f5f9;

    text-align: center;

    margin-bottom: 14px;

    font-weight: bold;

    min-height: 44px;

    display: flex;
    align-items: center;
    justify-content: center;
}

/* ============================================================
   NOMBRE
   ============================================================ */

.nombre-box {

    display: flex;

    gap: 8px;

    margin-bottom: 15px;
}

.nombre-box input {

    flex: 1;

    min-width: 0;

    border:
        2px solid #ddd;

    border-radius: 10px;

    padding: 11px;

    font-size: 15px;

    outline: none;
}

.nombre-box input:focus {

    border-color: #1976d2;
}

.nombre-box button {

    border: 0;

    border-radius: 10px;

    padding: 0 15px;

    background: #1976d2;

    color: white;

    font-weight: bold;

    cursor: pointer;
}

/* ============================================================
   DADO 3D
   ============================================================ */

.dado-contenedor {

    width: 130px;
    height: 130px;

    margin: 10px auto 5px;

    perspective: 700px;

    display: flex;

    align-items: center;
    justify-content: center;
}

.dado-3d {

    width: 75px;
    height: 75px;

    position: relative;

    transform-style: preserve-3d;

    transition:
        transform .8s cubic-bezier(.2,.8,.2,1);
}

.cara {

    position: absolute;

    width: 75px;
    height: 75px;

    background:
        linear-gradient(
            145deg,
            #ffffff,
            #eeeeee
        );

    border:
        3px solid #222;

    border-radius: 12px;

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    grid-template-rows:
        repeat(3, 1fr);

    padding: 10px;

    box-shadow:
        inset 0 0 10px rgba(0,0,0,.12);
}

.cara.c1 {
    transform:
        rotateY(0deg)
        translateZ(37.5px);
}

.cara.c2 {
    transform:
        rotateY(90deg)
        translateZ(37.5px);
}

.cara.c3 {
    transform:
        rotateY(180deg)
        translateZ(37.5px);
}

.cara.c4 {
    transform:
        rotateY(-90deg)
        translateZ(37.5px);
}

.cara.c5 {
    transform:
        rotateX(90deg)
        translateZ(37.5px);
}

.cara.c6 {
    transform:
        rotateX(-90deg)
        translateZ(37.5px);
}

.punto {

    width: 13px;
    height: 13px;

    background: #222;

    border-radius: 50%;

    align-self: center;
    justify-self: center;
}

.dado-3d.lanzando {

    animation:
        dadoSacudida .22s infinite;
}

@keyframes dadoSacudida {

    0% {
        transform:
            rotateX(0deg)
            rotateY(0deg)
            rotateZ(0deg)
            translateY(0);
    }

    25% {
        transform:
            rotateX(90deg)
            rotateY(100deg)
            rotateZ(35deg)
            translateY(-7px);
    }

    50% {
        transform:
            rotateX(180deg)
            rotateY(220deg)
            rotateZ(90deg)
            translateY(0);
    }

    75% {
        transform:
            rotateX(270deg)
            rotateY(310deg)
            rotateZ(150deg)
            translateY(-7px);
    }

    100% {
        transform:
            rotateX(360deg)
            rotateY(400deg)
            rotateZ(180deg)
            translateY(0);
    }
}

/* ============================================================
   RESULTADO
   ============================================================ */

#resultadoDado {

.boton {

.boton:hover:not(:disabled) {

.boton:active:not(:disabled) {

.boton:disabled {

#btnDado {

        );

}

#btnReiniciar {

}

#btnAbandonar {

            135deg,
            #ef5350,
            #c62828
        );

    color: white;
}

/* ============================================================
   JUGADORES
   ============================================================ */

.jugadores {

    margin-top: 18px;
}

.jugadores h3 {

    margin:
        0 0 8px;

    font-size: 18px;
}

.jugador-item {

    display: flex;

    align-items: center;

    gap: 10px;

    padding: 9px;

    margin-bottom: 7px;

    border-radius: 10px;

    background: #f5f5f5;

    font-size: 14px;
}

.jugador-color {

    width: 18px;
    height: 18px;

    border-radius: 50%;

    border: 2px solid white;

    box-shadow:
        0 1px 4px rgba(0,0,0,.25);
}

.jugador-item.actual {

    outline:
        2px solid #ffd740;

    background: #fff8d8;
}

.jugador-item.turno {

    box-shadow:
        inset 4px 0 0 #43a047;
}

/* ============================================================
   VICTORIA
   ============================================================ */

.overlay-victoria {

    position: fixed;

    inset: 0;

    background:
        rgba(0,0,0,.72);

    display: flex;

    align-items: center;
    justify-content: center;

    z-index: 999;

    opacity: 0;

    pointer-events: none;

    transition:
        opacity .3s ease;
}

.overlay-victoria.visible {

    opacity: 1;

    pointer-events: auto;
}

.ventana-victoria {

    width: min(450px, 90%);

    background: white;

    border-radius: 25px;

    padding: 35px;

    text-align: center;

    box-shadow:
        0 25px 80px rgba(0,0,0,.4);

    animation:
        victoriaEntrada .6s ease;
}

@keyframes victoriaEntrada {

    0% {
        opacity: 0;

        transform:
            scale(.5)
            rotate(-5deg);
    }

    70% {
        transform:
            scale(1.05)
            rotate(2deg);
    }

    100% {
        opacity: 1;

        transform:
            scale(1)
            rotate(0);
    }
}

.trofeo {

    font-size: 80px;

    animation:
        trofeoAnim 1.3s ease infinite;
}

@keyframes trofeoAnim {

    0%,
    100% {
        transform:

    }

    50% {
        transform:
            translateY(-12px)

    }
}

.ventana-victoria h2 {

    font-size: 32px;

.ventana-victoria p {

#btnVictoria {

    background:
        linear-gradient(
            135deg,
            #43a047,
            #1b5e20
        );

/* ============================================================
   RESPONSIVE
   ============================================================ */

@media (max-width: 1000px) {

    .juego {

        grid-template-columns: 1fr;
    }

    .panel {

@media (max-width: 600px) {

    }

    .pieza {

        width: 27px;
        height: 27px;

        font-size: 10px;
    }

    .juego {

        gap: 12px;
    }
}

</style>
</head>

/* ============================================================
   CREAR TABLERO
   ============================================================ */

function crearTablero() {

    const existentes =
        tablero.querySelectorAll(".casilla");

    existentes.forEach(
        elemento => elemento.remove()
    );

    for (
        let fila = 0;
        fila < 10;
        fila++
    ) {

        for (
            let columna = 0;
            columna < 10;
            columna++
        ) {

            const casilla =
                document.createElement("div");

            casilla.className =
                "casilla";

            let numero;

            const filaDesdeAbajo =
                9 - fila;

            if (
                filaDesdeAbajo % 2 === 0
            ) {

                numero =
                    filaDesdeAbajo * 10 +
                    columna +
                    1;

            } else {

                numero =
                    filaDesdeAbajo * 10 +
                    (9 - columna) +
                    1;
            }

            if (numero === 100) {

                casilla.classList.add(
                    "meta"
                );

            }

            const texto =
                document.createElement("span");

            texto.className =
                "numero";

            texto.textContent =
                numero;

            casilla.appendChild(texto);

            tablero.insertBefore(
                casilla,
                svgElementos
            );
        }
    }
}

/* ============================================================
   POSICIÓN DE CASILLA
   ============================================================ */

function posicionCasilla(numero) {

    numero =
        Math.max(
            1,
            Math.min(
                100,
                Number(numero)
            )
        );

    const indice =
        numero - 1;

    const fila =
        Math.floor(
            indice / 10
        );

    const columna =
        indice % 10;

    const filaVisual =
        9 - fila;

    let columnaVisual;

    if (
        fila % 2 === 0
    ) {

        columnaVisual =
            columna;

    } else {

        columnaVisual =
            9 - columna;

    }

    return {

        x:
            columnaVisual * 10 + 5,

        y:
            filaVisual * 10 + 5

    };
}

/* ============================================================
   CENTRO
   ============================================================ */

function centroCasilla(numero) {

    return posicionCasilla(numero);

}

/* ============================================================
   SVG
   ============================================================ */

function crearLinea(
    x1,
    y1,
    x2,
    y2,
    clase
) {

    const linea =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "line"
        );

    linea.setAttribute(
        "x1",
        x1
    );

    linea.setAttribute(
        "y1",
        y1
    );

    linea.setAttribute(
        "x2",
        x2
    );

    linea.setAttribute(
        "y2",
        y2
    );

    linea.setAttribute(
        "stroke",
        clase === "escalera"
            ? "#1eaa46"
            : "#d23232"
    );

    linea.setAttribute(
        "stroke-width",
        clase === "escalera"
            ? "1.2"
            : "1.7"
    );

    linea.setAttribute(
        "stroke-linecap",
        "round"
    );

    linea.classList.add(
        clase
    );

    return linea;
}

/* ============================================================
   DIBUJAR ESCALERAS
   ============================================================ */

function dibujarEscalera(
    desde,
    hasta
) {

    const inicio =
        centroCasilla(desde);

    const fin =
        centroCasilla(hasta);

    const dx =
        fin.x - inicio.x;

    const dy =
        fin.y - inicio.y;

    const distancia =
        Math.sqrt(
            dx * dx +
            dy * dy
        );

    if (!distancia) {
        return;
    }

    const nx =
        -dy / distancia;

    const ny =
        dx / distancia;

    const separacion = 1.1;

    const x1a =
        inicio.x + nx * separacion;

    const y1a =
        inicio.y + ny * separacion;

    const x2a =
        fin.x + nx * separacion;

    const y2a =
        fin.y + ny * separacion;

    const x1b =
        inicio.x - nx * separacion;

    const y1b =
        inicio.y - ny * separacion;

    const x2b =
        fin.x - nx * separacion;

    const y2b =
        fin.y - ny * separacion;

    const grupo =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "g"
        );

    grupo.classList.add(
        "grupo-escalera"
    );

    grupo.dataset.desde =
        desde;

    grupo.dataset.hasta =
        hasta;

    grupo.appendChild(
        crearLinea(
            x1a,
            y1a,
            x2a,
            y2a,
            "escalera"
        )
    );

    grupo.appendChild(
        crearLinea(
            x1b,
            y1b,
            x2b,
            y2b,
            "escalera"
        )
    );

    const peldaños = 7;

    for (
        let i = 1;
        i < peldaños;
        i++
    ) {

        const t =
            i / peldaños;

        const x =
            inicio.x +
            dx * t;

        const y =
            inicio.y +
            dy * t;

        const px =
            x + nx * separacion;

        const py =
            y + ny * separacion;

        const qx =
            x - nx * separacion;

        const qy =
            y - ny * separacion;

        grupo.appendChild(
            crearLinea(
                px,
                py,
                qx,
                qy,
                "escalera"
            )
        );
    }

    svgElementos.appendChild(
        grupo
    );
}

/* ============================================================
   DIBUJAR SERPIENTE
   ============================================================ */

function dibujarSerpiente(
    desde,
    hasta
) {

    const inicio =
        centroCasilla(desde);

    const fin =
        centroCasilla(hasta);

    const dx =
        fin.x - inicio.x;

    const dy =
        fin.y - inicio.y;

    const distancia =
        Math.sqrt(
            dx * dx +
            dy * dy
        );

    if (!distancia) {
        return;
    }

    const nx =
        -dy / distancia;

    const ny =
        dx / distancia;

    const puntos = [];

    const segmentos = 18;

    for (
        let i = 0;
        i <= segmentos;
        i++
    ) {

        const t =
            i / segmentos;

        const amplitud =
            Math.sin(
                t * Math.PI * 4
            ) * 2;

        const x =
            inicio.x +
            dx * t +
            nx * amplitud;

        const y =
            inicio.y +
            dy * t +
            ny * amplitud;

        puntos.push(
            `${x},${y}`
        );
    }

    const grupo =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "g"
        );

    grupo.classList.add(
        "grupo-serpiente"
    );

    grupo.dataset.desde =
        desde;

    grupo.dataset.hasta =
        hasta;

    const polyline =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "polyline"
        );

    polyline.setAttribute(
        "points",
        puntos.join(" ")
    );

    polyline.setAttribute(
        "fill",
        "none"
    );

    polyline.setAttribute(
        "stroke",
        "#d23232"
    );

    polyline.setAttribute(
        "stroke-width",
        "2.8"
    );

    polyline.setAttribute(
        "stroke-linecap",
        "round"
    );

    grupo.appendChild(
        polyline
    );

    /* Cabeza */

    const cabeza =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "circle"
        );

    cabeza.setAttribute(
        "cx",
        fin.x
    );

    cabeza.setAttribute(
        "cy",
        fin.y
    );

    cabeza.setAttribute(
        "r",
        "2.2"
    );

    cabeza.setAttribute(
        "fill",
        "#c62828"
    );

    grupo.appendChild(
        cabeza
    );

    svgElementos.appendChild(
        grupo
    );
}

/* ============================================================
   DIBUJAR ELEMENTOS
   ============================================================ */

function dibujarElementos() {

    svgElementos.innerHTML = "";

    Object.entries(

    );
}

/* ============================================================
   POSICIÓN JUGADOR
   ============================================================ */

function obtenerPosicionJugador(
    jugador
) {

    if (!jugador) {
        return 1;
    }

    return Number(
        jugador.posicion ??
        jugador.casilla ??
        1
    );
}

/* ============================================================
   NOMBRE
   ============================================================ */

function obtenerNombreJugador(
    jugador,
    id
) {

    if (!jugador) {

        return `Jugador ${id}`;

    }

    return (
        jugador.nombre ??
        jugador.nick ??
        `Jugador ${id}`
    );
}

/* ============================================================
   COLOR
   ============================================================ */

function obtenerColorJugador(
    jugador,
    id
) {

    if (
        jugador &&
        jugador.color
    ) {

        return jugador.color;

    }

    const indice =
        (
            Number(id) - 1
        ) %
        COLORES.length;

    return COLORES[
        indice >= 0
            ? indice
            : 0
    ];
}

/* ============================================================
   OBTENER JUGADOR
   ============================================================ */

function obtenerJugador(
    jugadores,
    id
) {

    if (!jugadores) {
        return null;
    }

    return (
        jugadores[id] ??
        jugadores[String(id)] ??
        null
    );
}

/* ============================================================
   RENDERIZAR FICHAS
   ============================================================ */

function renderizarFichas() {

    const jugadores =
        estado.jugadores || {};

    const ids =
        Object.keys(jugadores);

    ids.forEach(
        id => {

            const jugador =
                jugadores[id];

            const posicion =
                posicionesVisuales[id] ??
                obtenerPosicionJugador(
                    jugador
                );

            posicionesVisuales[id] =
                posicion;

        }
    );

    Object.keys(
        posicionesVisuales
    ).forEach(
        id => {

            if (
                !jugadores[id]
            ) {

                delete posicionesVisuales[id];

            }

        }
    );

    capaFichas.innerHTML = "";

    ids.forEach(
        id => {

            const jugador =
                jugadores[id];

            const ficha =
                document.createElement(
                    "div"
                );

            ficha.className =
                "pieza";

            if (
                Number(id) ===
                Number(estado.mi_id)
            ) {

                ficha.classList.add(
                    "mia"
                );

            }

            ficha.id =
                `pieza-${id}`;

            ficha.textContent =
                id;

            ficha.style.background =
                obtenerColorJugador(
                    jugador,
                    id
                );

            const posicion =
                posicionesVisuales[id] ??
                obtenerPosicionJugador(
                    jugador
                );

            const coordenadas =
                posicionCasilla(
                    posicion
                );

            ficha.style.left =
                `${coordenadas.x}%`;

            ficha.style.top =
                `${coordenadas.y}%`;

            capaFichas.appendChild(
                ficha
            );
        }
    );
}

/* ============================================================
   DORMIR
   ============================================================ */

function dormir(ms) {

    return new Promise(
        resolve =>
            setTimeout(
                resolve,
                ms
            )
    );
}

/* ============================================================
   EASING
   ============================================================ */

function easeInOutCubic(t) {

    return t < .5
        ? 4 * t * t * t
        : 1 -
          Math.pow(
              -2 * t + 2,
              3
          ) / 2;
}

/* ============================================================
   MOVER ELEMENTO SUAVE
   ============================================================ */

function moverElementoSuave(
    id,
    desde,
    hasta,
    duracion = 450
) {

    return new Promise(
        resolve => {

            const ficha =
                document.getElementById(
                    `pieza-${id}`
                );

            if (!ficha) {

                posicionesVisuales[id] =
                    hasta;

                resolve();

                return;
            }

            const inicio =
                posicionCasilla(
                    desde
                );

            const fin =
                posicionCasilla(
                    hasta
                );

            ficha.classList.add(
                "moviendo"
            );

            const inicioTiempo =
                performance.now();

            function animar(
                tiempo
            ) {

                const progreso =
                    Math.min(
                        1,
                        (
                            tiempo -
                            inicioTiempo
                        ) /
                        duracion
                    );

                const t =
                    easeInOutCubic(
                        progreso
                    );

                const x =
                    inicio.x +
                    (
                        fin.x -
                        inicio.x
                    ) * t;

                const y =
                    inicio.y +
                    (
                        fin.y -
                        inicio.y
                    ) * t;

                ficha.style.left =
                    `${x}%`;

                ficha.style.top =
                    `${y}%`;

                if (
                    progreso < 1
                ) {

                    requestAnimationFrame(
                        animar
                    );

                } else {

                    ficha.classList.remove(
                        "moviendo"
                    );

                    posicionesVisuales[id] =
                        hasta;

                    resolve();
                }
            }

            requestAnimationFrame(
                animar
            );
        }
    );
}

/* ============================================================
   REBOTE
   ============================================================ */

async function reboteFicha(
    id
) {

    const ficha =
        document.getElementById(
            `pieza-${id}`
        );

    if (!ficha) {
        return;
    }

    ficha.classList.remove(
        "rebote"
    );

    void ficha.offsetWidth;

    ficha.classList.add(
        "rebote"
    );

    await dormir(450);

    ficha.classList.remove(
        "rebote"
    );
}

/* ============================================================
   MOVER POR CASILLAS
   ============================================================ */

async function moverFichaPorCasillas(
    id,
    inicio,
    final,
    velocidad = 360
) {

    if (
        inicio === final
    ) {

        await reboteFicha(id);

        return;
    }

    const paso =
        final > inicio
            ? 1
            : -1;

    let actual =
        inicio;

    while (
        actual !== final
    ) {

        const siguiente =
            actual + paso;

        await moverElementoSuave(
            id,
            actual,
            siguiente,
            velocidad
        );

        await dormir(70);

        actual =
            siguiente;
    }

    await reboteFicha(id);
}

/* ============================================================
   MENSAJE
   ============================================================ */

function mostrarMensaje(
    texto
) {

    resultadoDado.textContent =
        texto;

    resultadoDado.classList.remove(
        "mensaje-efecto"
    );

    void resultadoDado.offsetWidth;

    resultadoDado.classList.add(
        "mensaje-efecto"
    );
}

/* ============================================================
   PARTICULAS
   ============================================================ */

function crearParticulas(
    numeroCasilla,
    cantidad = 25
) {

    const posicion =
        posicionCasilla(
            numeroCasilla
        );

    const rect =
        tablero.getBoundingClientRect();

    for (
        let i = 0;
        i < cantidad;
        i++
    ) {

        const particula =
            document.createElement(
                "div"
            );

        particula.className =
            "particula";

        const dx =
            (
                Math.random() -
                .5
            ) * 180;

        const dy =
            (
                Math.random() -
                .5
            ) * 180;

        particula.style.left =
            `${posicion.x}%`;

        particula.style.top =
            `${posicion.y}%`;

        particula.style.setProperty(
            "--dx",
            `${dx}px`
        );

        particula.style.setProperty(
            "--dy",
            `${dy}px`
        );

        particula.style.background =
            COLORES[
                Math.floor(
                    Math.random() *
                    COLORES.length
                )
            ];

        tablero.appendChild(
            particula
        );

        setTimeout(
            () => {

                particula.remove();

            },
            1000
        );
    }
}

/* ============================================================
   ANIMACIÓN MOVIMIENTO
   ============================================================ */

async function animarMovimientoJugador(
    id,
    posicionAnterior,
    posicionFinal,
    dado
) {

    if (animando) {
        return;
    }

    animando = true;

    actualizarBotonDado();

    const inicio =
        Number(posicionAnterior);

    const final =
        Number(posicionFinal);

    let intermedia =
        inicio +
        Number(dado || 0);

    if (
        intermedia > 100
    ) {

        intermedia =
            inicio;

    }

    /* Movimiento normal */

    if (
        intermedia !== inicio
    ) {

        await moverFichaPorCasillas(
            id,
            inicio,
            intermedia,
            300
        );

    } else {

        await reboteFicha(id);

    }

    /* ESCALERA */

    if (
        ESCALERAS[intermedia]
    ) {

        const destino =
            ESCALERAS[
                intermedia
            ];

        await resaltarCasilla(
            intermedia,
            800
        );

        activarEscalera(
            intermedia,
            destino
        );

        mostrarMensaje(
            `🪜 ¡Escalera! ${intermedia} → ${destino}`
        );

        crearParticulas(
            intermedia,
            30
        );

        await dormir(700);

        await moverElementoSuave(
            id,
            intermedia,
            destino,
            1500
        );

        crearParticulas(
            destino,
            35
        );

        await dormir(300);
    }

    /* SERPIENTE */

    else if (
        SERPIENTES[intermedia]
    ) {

        const destino =
            SERPIENTES[
                intermedia
            ];

        await resaltarCasilla(
            intermedia,
            800
        );

        activarSerpiente(
            intermedia,
            destino
        );

        mostrarMensaje(
            `🐍 ¡Serpiente! ${intermedia} → ${destino}`
        );

        crearParticulas(
            intermedia,
            30
        );

        await dormir(700);

        await moverElementoSuave(
            id,
            intermedia,
            destino,
            1700
        );

        crearParticulas(
            destino,
            35
        );

        await dormir(300);
    }

    /* CORRECCIÓN FINAL */

    if (
        posicionesVisuales[id] !==
        final
    ) {

        await moverElementoSuave(
            id,
            posicionesVisuales[id] ??
            intermedia,
            final,
            400
        );
    }

    posicionesVisuales[id] =
        final;

    animando = false;

    actualizarEstadoTexto();

    actualizarListaJugadores();

    actualizarBotonDado();
}

/* ============================================================
   ROTACIONES DADO
   ============================================================ */

const ROTACIONES_DADO = {

    1:
        "rotateX(0deg) rotateY(0deg) rotateZ(0deg)",

    2:
        "rotateX(0deg) rotateY(-90deg) rotateZ(0deg)",

    3:
        "rotateX(0deg) rotateY(180deg) rotateZ(0deg)",

    4:
        "rotateX(0deg) rotateY(90deg) rotateZ(0deg)",

    5:
        "rotateX(-90deg) rotateY(0deg) rotateZ(0deg)",

    6:
        "rotateX(90deg) rotateY(0deg) rotateZ(0deg)"

};

/* ============================================================
   MOSTRAR CARA
   ============================================================ */

function mostrarCaraDado(
    numero
) {

    dado3d.style.transform =
        ROTACIONES_DADO[
            numero
        ] ||
        ROTACIONES_DADO[1];
}

/* ============================================================
   ANIMAR DADO
   ============================================================ */

async function animarDado(
    resultado
) {

    btnDado.disabled =
        true;

    dado3d.classList.add(
        "lanzando"
    );

    const rondas = 15;

    for (
        let i = 0;
        i < rondas;
        i++
    ) {

        const cara =
            1 +
            Math.floor(
                Math.random() * 6
            );

        mostrarCaraDado(
            cara
        );

        await dormir(
            90
        );
    }

    dado3d.classList.remove(
        "lanzando"
    );

    mostrarCaraDado(
        Number(resultado)
    );

    resultadoDado.textContent =
        `🎲 Salió ${resultado}`;

    resultadoDado.classList.remove(
        "mensaje-efecto"
    );

    void resultadoDado.offsetWidth;

    resultadoDado.classList.add(
        "mensaje-efecto"
    );

    await dormir(
        500
    );

    dado3d.style.transition =
        "transform .8s cubic-bezier(.2,.8,.2,1)";

    actualizarBotonDado();
}

/* ============================================================
   ESTADO TEXTO
   ============================================================ */

function actualizarEstadoTexto() {

    if (
        !socket ||
        socket.readyState !==
        WebSocket.OPEN
    ) {

        estadoConexion.textContent =
            "🔴 Desconectado";

        return;
    }

    if (
        estado.ganador
    ) {

        estadoConexion.textContent =
            "🏆 Partida terminada";

        return;
    }

    if (
        Number(estado.turno) ===
        Number(estado.mi_id)
    ) {

        estadoConexion.textContent =
            "🟢 ¡Es tu turno!";

        return;
    }

    if (
        estado.turno
    ) {

        const jugador =
            obtenerJugador(
                estado.jugadores,
                estado.turno
            );

        const nombre =
            obtenerNombreJugador(
                jugador,
                estado.turno
            );

        estadoConexion.textContent =
            `⏳ Turno de ${nombre}`;

        return;
    }

    estadoConexion.textContent =
        estado.ultimo_evento ||
        "🟢 Conectado";
}

   LISTA JUGADORES

function actualizarListaJugadores() {

    const ids =

        );

    if (

    ) {

    ids
        .sort(

        )

                const item =

                    );

                if (
                    Number(id) ===
                    Number(estado.mi_id)
                ) {

                    item.classList.add(
                        "actual"
                    );
                }

                if (
                    Number(id) ===
                    Number(estado.turno)
                ) {

                    item.classList.add(
                        "turno"
                    );
                }

                const color =
                    document.createElement(
                        "span"
                    );

                color.className =
                    "jugador-color";

                color.style.background =
                    obtenerColorJugador(
                        jugador,
                        id
                    );

                const nombre =
                    obtenerNombreJugador(
                        jugador,
                        id
                    );

                const posicion =
                    obtenerPosicionJugador(
                        jugador
                    );

                item.appendChild(
                    color
                );

                const texto =
                    document.createElement(
                        "span"
                    );

                texto.textContent =
                    `${nombre} — casilla ${posicion}`;

                item.appendChild(
                    texto
                );

                if (
                    Number(id) ===
                    Number(estado.mi_id)
                ) {

                    const tu =
                        document.createElement(
                            "strong"
                        );

                    tu.textContent =
                        " (TÚ)";

                    item.appendChild(
                        tu
                    );
                }

                listaJugadores.appendChild(
                    item
                );
            }
        );
}

/* ============================================================
   BOTÓN DADO
   ============================================================ */

function actualizarBotonDado() {

    const conectado =
        socket &&
        socket.readyState ===
        WebSocket.OPEN;

    if (!conectado) {

        btnDado.disabled =
            true;

        return;
    }

    if (animando) {

        btnDado.disabled =
            true;

        return;
    }

    if (estado.ganador) {

        btnDado.disabled =
            true;

        return;
    }

    if (
        estado.mi_id === null ||
        estado.mi_id === undefined
    ) {

        btnDado.disabled =
            true;

        return;
    }

    if (
        estado.turno === null ||
        estado.turno === undefined
    ) {

        btnDado.disabled =
            true;

        return;
    }

    const esMiTurno =
        Number(estado.turno) ===
        Number(estado.mi_id);

    btnDado.disabled =
        !esMiTurno;
}

/* ============================================================
   ENVIAR
   ============================================================ */

function enviar(
    mensaje
) {

    if (
        !socket ||
        socket.readyState !==
        WebSocket.OPEN
    ) {

        mostrarMensaje(
            "🔴 No hay conexión con el servidor."
        );

        return false;
    }

    try {

        socket.send(
            JSON.stringify(
                mensaje
            )
        );

        return true;

    } catch (error) {

        console.error(
            "Error enviando:",
            error
        );

        return false;
    }
}

/* ============================================================
   RECIBIR ESTADO
   ============================================================ */

async function recibirEstado(
    nuevoEstado
) {

    const estadoAnterior = {

        ...estado,

        jugadores:
            estado.jugadores || {}

    };

    const jugadoresNuevos =
        nuevoEstado.jugadores ||
        {};

    const jugadoresAnteriores =
        estadoAnterior.jugadores ||
        {};

    const miIdAnterior =
        estadoAnterior.mi_id;

    /*
     * IMPORTANTE:
     *
     * No reemplazamos completamente estado.
     *
     * Conservamos mi_id porque algunos
     * estados enviados por el servidor
     * no contienen el ID local.
     */

    estado = {

        ...estado,

        ...nuevoEstado,

        mi_id:
            nuevoEstado.mi_id ??
            nuevoEstado.jugador_id ??
            nuevoEstado.id ??
            miIdAnterior,

        jugadores:
            nuevoEstado.jugadores ||
            {}

    };

    /*
     * PRIMER ESTADO
     */

    if (
        Object.keys(
            posicionesVisuales
        ).length === 0
    ) {

        for (
            const [
                id,
                jugador
            ]
            of Object.entries(
                jugadoresNuevos
            )
        ) {

            posicionesVisuales[id] =
                obtenerPosicionJugador(
                    jugador
                );
        }

        renderizarFichas();

        actualizarEstadoTexto();

        actualizarListaJugadores();

        actualizarBotonDado();

        return;
    }

    /*
     * BUSCAR JUGADOR QUE CAMBIÓ
     */

    let jugadorMovido =
        null;

    for (
        const [
            id,
            jugadorNuevo
        ]
        of Object.entries(
            jugadoresNuevos
        )
    ) {

        const nuevo =
            obtenerPosicionJugador(
                jugadorNuevo
            );

        const jugadorAnterior =
            obtenerJugador(
                jugadoresAnteriores,
                id
            );

        const anterior =
            posicionesVisuales[id] ??
            (
                jugadorAnterior
                    ? obtenerPosicionJugador(
                        jugadorAnterior
                    )
                    : nuevo
            );

        if (
            nuevo !== anterior
        ) {

            jugadorMovido = {

                id,

                anterior,

                nuevo

            };

            break;
        }
    }

    renderizarFichas();

    actualizarEstadoTexto();

    actualizarListaJugadores();

    /*
     * ANIMAR MOVIMIENTO
     */

    if (
        jugadorMovido &&
        !animando
    ) {

        const dado =
            nuevoEstado.ultimo_dado ??
            nuevoEstado.dado ??
            estado.ultimo_dado ??
            estado.dado ??
            0;

        await animarMovimientoJugador(

            jugadorMovido.id,

            jugadorMovido.anterior,

            jugadorMovido.nuevo,

            Number(dado)

        );
    }

    /*
     * VICTORIA
     */

    if (
        nuevoEstado.ganador &&
        nuevoEstado.ganador !==
        ultimaPosicionGanador
    ) {

        ultimaPosicionGanador =
            nuevoEstado.ganador;

        mostrarVictoria(
            nuevoEstado.ganador
        );
    }

    actualizarEstadoTexto();

    actualizarListaJugadores();

    actualizarBotonDado();
}

/* ============================================================
   PROCESAR MENSAJE
   ============================================================ */

async function procesarMensaje(
    mensaje
) {

    console.log(
        "📨 Servidor:",
        mensaje
    );

    switch (
        mensaje.tipo
    ) {

        /* ====================================================
           CONEXIÓN
           ==================================================== */

        case "conexion":

        case "asignar_id":

        {

            const id =
                mensaje.id ??
                mensaje.jugador_id ??
                mensaje.mi_id;

            if (
                id !== undefined &&
                id !== null
            ) {

                estado.mi_id =
                    Number(id);

            }

            if (
                mensaje.estado
            ) {

                await recibirEstado(
                    mensaje.estado
                );

            }

            actualizarEstadoTexto();

            actualizarListaJugadores();

            actualizarBotonDado();

            break;
        }

        /* ====================================================
           ESTADO
           ==================================================== */

        case "estado":

        {

            let datos =
                mensaje.estado ??
                mensaje;

            if (
                datos &&
                datos.estado
            ) {

                datos =
                    datos.estado;
            }

            await recibirEstado(
                datos
            );

            break;
        }

        /* ====================================================
           RESULTADO DADO
           ==================================================== */

        case "resultado_dado":

        case "resultado":

        {

            const resultado =
                Number(
                    mensaje.valor ??
                    mensaje.resultado ??
                    mensaje.dado ??
                    mensaje.ultimo_dado
                );

            if (
                resultado >= 1 &&
                resultado <= 6
            ) {

                await animarDado(
                    resultado
                );

            }

            break;
        }

        /* ====================================================
           MENSAJE
           ==================================================== */

        case "mensaje":

        {

            mostrarMensaje(
                mensaje.mensaje ??
                mensaje.texto ??
                "Mensaje del servidor"
            );

            break;
        }

        /* ====================================================
           ERROR
           ==================================================== */

        case "error":

        {

            mostrarMensaje(
                `⚠️ ${
                    mensaje.mensaje ??
                    mensaje.error ??
                    "Error"
                }`
            );

            actualizarBotonDado();

            break;
        }

        /* ====================================================
           SERVIDOR LLENO
           ==================================================== */

        case "lleno":

        {

            estadoConexion.textContent =
                "🔴 Servidor lleno";

            mostrarMensaje(
                mensaje.mensaje ??
                "El servidor está lleno."
            );

            btnDado.disabled =
                true;

            break;
        }

        /* ====================================================
           SERVIDOR CERRANDO
           ==================================================== */

        case "servidor_cerrando":

        case "servidor_cerrado":

        {

            mostrarMensaje(
                "🔴 El servidor se está cerrando."
            );

            btnDado.disabled =
                true;

            break;
        }

        /* ====================================================
           REINICIO
           ==================================================== */

        case "reinicio":

        {

            posicionesVisuales =
                {};

            animando =
                false;

            ultimaPosicionGanador =
                null;

            ocultarVictoria();

            mostrarCaraDado(1);

            resultadoDado.textContent =
                "🎲 Esperando...";

            if (
                mensaje.estado
            ) {

                await recibirEstado(
                    mensaje.estado
                );

            }

            actualizarBotonDado();

            break;
        }

        default:

            console.log(
                "Mensaje desconocido:",
                mensaje
            );

            break;
    }
}

/* ============================================================
   CONECTAR
   ============================================================ */

function conectar() {

    if (
        socket &&
        (
            socket.readyState ===
            WebSocket.OPEN ||
            socket.readyState ===
            WebSocket.CONNECTING
        )
    ) {

        return;
    }

    estadoConexion.textContent =
        "🔄 Conectando...";

    try {

        socket =
            new WebSocket(
                SERVER_URL
            );

    } catch (error) {

        console.error(
            error
        );

        estadoConexion.textContent =
            "🔴 Error creando conexión";

        return;
    }

    socket.onopen =
        () => {

            console.log(
                "🟢 WebSocket conectado"
            );

            estadoConexion.textContent =
                "🟢 Conectado";

            actualizarBotonDado();

            /*
             * Pedimos al servidor un ping
             * para confirmar que está activo.
             */

            enviar({
                tipo: "ping"
            });
        };

    socket.onmessage =
        async evento => {

            try {

                const mensaje =
                    JSON.parse(
                        evento.data
                    );

                await procesarMensaje(
                    mensaje
                );

            } catch (error) {

                console.error(
                    "Error procesando mensaje:",
                    error
                );
            }
        };

    socket.onerror =
        error => {

            console.error(
                "WebSocket error:",
                error
            );

            estadoConexion.textContent =
                "🔴 Error de conexión";

            actualizarBotonDado();
        };

    socket.onclose =
        () => {

            console.log(
                "🔴 WebSocket cerrado"
            );

            estadoConexion.textContent =
                "🔴 Desconectado";

            btnDado.disabled =
                true;
        };
}

/* ============================================================
   BOTÓN DADO
   ============================================================ */

btnDado.addEventListener(
    "click",
    () => {

        /*
         * Comprobaciones de seguridad
         */

        if (
            animando
        ) {

            return;
        }

        if (
            !socket ||
            socket.readyState !==
            WebSocket.OPEN
        ) {

            mostrarMensaje(
                "🔴 No estás conectado."
            );

            return;
        }

        if (
            estado.mi_id === null ||
            estado.mi_id === undefined
        ) {

            mostrarMensaje(
                "⏳ Esperando asignación de jugador..."
            );

            return;
        }

        if (
            estado.turno === null ||
            estado.turno === undefined
        ) {

            mostrarMensaje(
                "⏳ Esperando el turno..."
            );

            return;
        }

        if (
            Number(estado.turno) !==
            Number(estado.mi_id)
        ) {

            mostrarMensaje(
                "⏳ Todavía no es tu turno."
            );

            actualizarBotonDado();

            return;
        }

        /*
         * Enviar al servidor
         */

        const enviado =
            enviar({
                tipo:
                    "lanzar_dado"
            });

        if (
            enviado
        ) {

            btnDado.disabled =
                true;

            resultadoDado.textContent =
                "🎲 Lanzando...";

            dado3d.classList.add(
                "lanzando"
            );
        }
    }
);

/* ============================================================
   BOTÓN NOMBRE
   ============================================================ */

btnNombre.addEventListener(
    "click",
    () => {

        const nombre =
            nombreInput.value.trim();

        if (!nombre) {

            mostrarMensaje(
                "✏️ Escribe un nombre."
            );

            nombreInput.focus();

            return;
        }

        const enviado =
            enviar({

                tipo: "nombre",

                nombre: nombre

            });

        if (
            enviado
        ) {

            nombreInput.disabled =
                true;

            btnNombre.disabled =
                true;

            mostrarMensaje(
                `👤 Nombre: ${nombre}`
            );
        }
    }
);

/* ============================================================
   ENTER NOMBRE
   ============================================================ */

nombreInput.addEventListener(
    "keydown",
    evento => {

        if (
            evento.key ===
            "Enter"
        ) {

            btnNombre.click();

        }
    }
);

/* ============================================================
   REINICIAR
   ============================================================ */

btnReiniciar.addEventListener(
    "click",
    () => {

        if (
            !socket ||
            socket.readyState !==
            WebSocket.OPEN
        ) {

            mostrarMensaje(
                "🔴 No hay conexión."
            );

            return;
        }

        enviar({
            tipo: "reiniciar"
        });
    }
);

/* ============================================================
   ABANDONAR
   ============================================================ */

btnAbandonar.addEventListener(
    "click",
    () => {

        if (
            abandonando
        ) {

            enviar({
                tipo: "abandonar"
            });

            abandonando =
                false;

            btnAbandonar.textContent =
                "🚪 ABANDONAR";

            return;
        }

        abandonando =
            true;

        btnAbandonar.textContent =
            "⚠️ CONFIRMAR ABANDONO";

        mostrarMensaje(
            "Pulsa nuevamente para abandonar."
        );

        setTimeout(
            () => {

                if (
                    abandonando
                ) {

                    abandonando =
                        false;

                    btnAbandonar.textContent =
                        "🚪 ABANDONAR";
                }

            },
            4000
        );
    }
);

/* ============================================================
   VICTORIA
   ============================================================ */

function mostrarVictoria(
    ganador
) {

    const jugador =
        obtenerJugador(
            estado.jugadores,
            ganador
        );

    const nombre =
        obtenerNombreJugador(
            jugador,
            ganador
        );

    textoVictoria.textContent =
        `🎉 ${nombre} ha llegado a la casilla 100.`;

    overlayVictoria.classList.add(
        "visible"
    );

    crearParticulas(
        100,
        60
    );
}

/* ============================================================
   OCULTAR VICTORIA
   ============================================================ */

function ocultarVictoria() {

    overlayVictoria.classList.remove(
        "visible"
    );
}

/* ============================================================
   BOTÓN VICTORIA
   ============================================================ */

btnVictoria.addEventListener(
    "click",
    () => {

        ocultarVictoria();

        enviar({
            tipo: "reiniciar"
        });
    }
);

/* ============================================================
   INICIALIZACIÓN
   ============================================================ */

crearTablero();

dibujarElementos();

mostrarCaraDado(1);

actualizarBotonDado();

actualizarEstadoTexto();

actualizarListaJugadores();

conectar();

/* ============================================================
   DEBUG
   ============================================================ */

window.addEventListener(
    "beforeunload",
    () => {

        try {

            if (
                socket &&
                socket.readyState ===
                WebSocket.OPEN
            ) {

                socket.close();

            }

        } catch (error) {

            console.error(
                error
            );
        }
    }
);

</script>

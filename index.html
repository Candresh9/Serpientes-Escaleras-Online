<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>
    Serpientes y Escaleras Online
</title>


<style>

* {
    box-sizing: border-box;
}


body {

    margin: 0;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:
        linear-gradient(
            135deg,
            #111827,
            #1e293b
        );

    color: white;

    min-height: 100vh;

}


header {

    text-align: center;

    padding: 20px;

}


h1 {

    margin: 0;

    font-size: 32px;

}


#estadoConexion {

    display: inline-block;

    margin-top: 10px;

    padding: 8px 15px;

    border-radius: 20px;

    background: #64748b;

    font-weight: bold;

}


.conectado {

    background: #16a34a !important;

}


.error {

    background: #dc2626 !important;

}


.contenedor {

    display: flex;

    gap: 25px;

    justify-content: center;

    align-items: flex-start;

    padding: 20px;

    flex-wrap: wrap;

}


/* ==========================================================
   TABLERO
   ========================================================== */

#tablero {

    width: min(
        90vw,
        650px
    );

    height: min(
        90vw,
        650px
    );

    display: grid;

    grid-template-columns:
        repeat(10, 1fr);

    grid-template-rows:
        repeat(10, 1fr);

    border:
        4px solid white;

    background: #f8fafc;

    border-radius: 10px;

    overflow: hidden;

}


.casilla {

    position: relative;

    display: flex;

    align-items: center;

    justify-content: center;

    color: #111827;

    font-weight: bold;

    font-size: clamp(
        10px,
        1.8vw,
        17px
    );

    border:
        1px solid #94a3b8;

}


.casilla:nth-child(odd) {

    background: #dbeafe;

}


.casilla:nth-child(even) {

    background: #fef3c7;

}


.numero {

    position: absolute;

    top: 3px;

    left: 5px;

    font-size: 11px;

    opacity: .7;

}


/* ==========================================================
   FICHAS
   ========================================================== */

.fichas {

    display: flex;

    flex-wrap: wrap;

    gap: 2px;

    justify-content: center;

    align-items: center;

}


.ficha {

    width: 25px;

    height: 25px;

    border-radius: 50%;

    display: flex;

    align-items: center;

    justify-content: center;

    color: white;

    font-size: 10px;

    font-weight: bold;

    border: 2px solid white;

    box-shadow:
        0 2px 5px #0008;

}


.ficha1 {
    background: #ef4444;
}

.ficha2 {
    background: #3b82f6;
}

.ficha3 {
    background: #22c55e;
}

.ficha4 {
    background: #a855f7;
}


/* ==========================================================
   PANEL
   ========================================================== */

.panel {

    width: 330px;

    max-width: 90vw;

    background:
        rgba(
            15,
            23,
            42,
            .95
        );

    border:
        1px solid #475569;

    border-radius: 15px;

    padding: 20px;

    box-shadow:
        0 10px 30px #0008;

}


.panel h2 {

    margin-top: 0;

}


#dado {

    font-size: 70px;

    text-align: center;

    margin: 15px 0;

}


button {

    width: 100%;

    border: none;

    padding: 14px;

    margin-top: 10px;

    border-radius: 10px;

    font-size: 17px;

    font-weight: bold;

    cursor: pointer;

}


#btnDado {

    background: #22c55e;

    color: white;

}


#btnDado:hover {

    background: #16a34a;

}


#btnDado:disabled {

    background: #475569;

    cursor: not-allowed;

}


#btnAbandonar {

    background: #dc2626;

    color: white;

}


#btnReiniciar {

    background: #2563eb;

    color: white;

}


#nombre {

    width: 100%;

    padding: 12px;

    border-radius: 8px;

    border: 1px solid #64748b;

    margin-top: 8px;

    font-size: 16px;

}


#jugadores {

    margin-top: 15px;

}


.jugador {

    padding: 10px;

    margin-top: 6px;

    border-radius: 8px;

    background: #1e293b;

}


.mi-turno {

    border:
        2px solid #22c55e;

}


.evento {

    margin-top: 15px;

    background: #020617;

    padding: 12px;

    border-radius: 8px;

    min-height: 50px;

}


.info {

    margin-top: 15px;

    color: #cbd5e1;

    line-height: 1.5;

}


</style>

</head>


<body>


<header>

<h1>
🎲 Serpientes y Escaleras Online
</h1>

<div id="estadoConexion">
    CONECTANDO...
</div>

</header>


<div class="contenedor">


<!-- ======================================================
     TABLERO
     ====================================================== -->

<div id="tablero"></div>


<!-- ======================================================
     PANEL
     ====================================================== -->

<div class="panel">

<h2>
🎮 Partida
</h2>


<label>
Tu nombre:
</label>

<input
    id="nombre"
    type="text"
    maxlength="20"
    placeholder="Escribe tu nombre"
>


<button
    onclick="cambiarNombre()"
>
Guardar nombre
</button>


<div id="dado">
    🎲
</div>


<button
    id="btnDado"
    onclick="lanzarDado()"
    disabled
>
🎲 Lanzar dado
</button>


<button
    id="btnReiniciar"
    onclick="reiniciarJuego()"
>
🔄 Reiniciar
</button>


<button
    id="btnAbandonar"
    onclick="abandonar()"
>
🚪 Abandonar
</button>


<h2>
👥 Jugadores
</h2>

<div id="jugadores">
    Esperando...
</div>


<div class="evento">

<b>
Último evento:
</b>

<div id="evento">
    Conectando con el servidor...
</div>

</div>


<div class="info">

<b>
Tu ID:
</b>

<span id="miId">
-
</span>

<br>

<b>
Turno:
</b>

<span id="turno">
-
</span>

</div>

</div>

</div>


<script>


// ==========================================================
// CONFIGURACIÓN
// ==========================================================

const SERVER_URL =
    "wss://serpientes-escaleras-phl7.onrender.com";


let socket = null;

let miId = null;

let estado = {

    jugadores: {},

    turno: null,

    ganador: null,

    dado: 0,

    ultimo_evento:
        "Conectando..."

};


// ==========================================================
// ELEMENTOS
// ==========================================================

const tablero =
    document.getElementById(
        "tablero"
    );

const estadoConexion =
    document.getElementById(
        "estadoConexion"
    );

const btnDado =
    document.getElementById(
        "btnDado"
    );

const dado =
    document.getElementById(
        "dado"
    );

const evento =
    document.getElementById(
        "evento"
    );

const jugadores =
    document.getElementById(
        "jugadores"
    );

const miIdElemento =
    document.getElementById(
        "miId"
    );

const turnoElemento =
    document.getElementById(
        "turno"
    );


// ==========================================================
// CREAR TABLERO
// ==========================================================

function crearTablero() {

    tablero.innerHTML = "";


    for (
        let fila = 0;
        fila < 10;
        fila++
    ) {

        let numeros = [];


        // ----------------------------------------------
        // FILAS ALTERNADAS
        // ----------------------------------------------

        if (
            fila % 2 === 0
        ) {

            for (
                let columna = 1;
                columna <= 10;
                columna++
            ) {

                numeros.push(
                    fila * 10 + columna
                );

            }

        }

        else {

            for (
                let columna = 10;
                columna >= 1;
                columna--
            ) {

                numeros.push(
                    fila * 10 + columna
                );

            }

        }


        numeros.forEach(
            numero => {

                const casilla =
                    document.createElement(
                        "div"
                    );

                casilla.className =
                    "casilla";

                casilla.id =
                    "casilla-" + numero;


                const texto =
                    document.createElement(
                        "div"
                    );

                texto.className =
                    "numero";

                texto.textContent =
                    numero;


                casilla.appendChild(
                    texto
                );


                const fichas =
                    document.createElement(
                        "div"
                    );

                fichas.className =
                    "fichas";

                fichas.id =
                    "fichas-" + numero;


                casilla.appendChild(
                    fichas
                );


                tablero.appendChild(
                    casilla
                );

            }
        );

    }

}


// ==========================================================
// CONECTAR
// ==========================================================

function conectar() {

    actualizarConexion(
        "CONECTANDO...",
        false
    );


    try {

        socket =
            new WebSocket(
                SERVER_URL
            );


        socket.onopen = function() {

            actualizarConexion(
                "CONECTADO",
                true
            );

            evento.textContent =
                "Conectado al servidor.";


            console.log(
                "WebSocket conectado."
            );

        };


        socket.onmessage =
            function(e) {

                try {

                    const mensaje =
                        JSON.parse(
                            e.data
                        );


                    procesarMensaje(
                        mensaje
                    );

                }

                catch(error) {

                    console.error(
                        "Mensaje inválido:",
                        error
                    );

                }

            };


        socket.onerror =
            function(error) {

                console.error(
                    "WebSocket error:",
                    error
                );

                actualizarConexion(
                    "ERROR",
                    false
                );

            };


        socket.onclose =
            function() {

                actualizarConexion(
                    "DESCONECTADO",
                    false
                );


                btnDado.disabled =
                    true;


                evento.textContent =
                    "Conexión cerrada. Intentando reconectar...";


                setTimeout(
                    conectar,
                    5000
                );

            };

    }

    catch(error) {

        console.error(
            error
        );

        actualizarConexion(
            "ERROR",
            false
        );

    }

}


// ==========================================================
// ESTADO DE CONEXIÓN
// ==========================================================

function actualizarConexion(
    texto,
    conectado
) {

    estadoConexion.textContent =
        texto;


    estadoConexion.className =
        conectado
            ? "conectado"
            : "error";

}


// ==========================================================
// PROCESAR MENSAJE
// ==========================================================

function procesarMensaje(
    mensaje
) {

    console.log(
        "Servidor:",
        mensaje
    );


    switch(
        mensaje.tipo
    ) {


        // ==================================================
        // CONEXIÓN
        // ==================================================

        case "conexion":

            miId =
                mensaje.id;


            miIdElemento.textContent =
                miId;


            evento.textContent =
                "Has entrado a la partida.";


            break;


        // ==================================================
        // ESTADO
        // ==================================================

        case "estado":

            estado =
                mensaje;


            renderizar();


            break;


        // ==================================================
        // DADO
        // ==================================================

        case "resultado_dado":

            mostrarDado(
                mensaje.dado
            );


            break;


        // ==================================================
        // MENSAJE
        // ==================================================

        case "mensaje":

            evento.textContent =
                mensaje.mensaje || "";


            break;


        // ==================================================
        // ERROR
        // ==================================================

        case "error":

            evento.textContent =
                "⚠️ " +
                mensaje.mensaje;


            break;


        // ==================================================
        // LLENO
        // ==================================================

        case "lleno":

            evento.textContent =
                "❌ " +
                mensaje.mensaje;


            actualizarConexion(
                "PARTIDA LLENA",
                false
            );


            break;


        // ==================================================
        // REINICIO
        // ==================================================

        case "reinicio":

            evento.textContent =
                "🔄 " +
                mensaje.mensaje;


            break;


        // ==================================================
        // PONG
        // ==================================================

        case "pong":

            break;

    }

}


// ==========================================================
// RENDERIZAR
// ==========================================================

function renderizar() {

    // ----------------------------------------------
    // LIMPIAR FICHAS
    // ----------------------------------------------

    document
        .querySelectorAll(
            ".fichas"
        )
        .forEach(
            elemento => {

                elemento.innerHTML =
                    "";

            }
        );


    // ----------------------------------------------
    // JUGADORES
    // ----------------------------------------------

    const lista =
        Object.values(
            estado.jugadores || {}
        );


    lista.forEach(
        (jugador, indice) => {

            let posicion =
                jugador.posicion;


            if (
                posicion < 1
            ) {

                posicion = 1;

            }


            if (
                posicion > 100
            ) {

                posicion = 100;

            }


            const contenedor =
                document.getElementById(
                    "fichas-" +
                    posicion
                );


            if (!contenedor) {

                return;

            }


            const ficha =
                document.createElement(
                    "div"
                );


            ficha.className =
                "ficha ficha" +
                (
                    (indice % 4) + 1
                );


            ficha.textContent =
                jugador.nombre
                    .substring(
                        0,
                        1
                    )
                    .toUpperCase();


            ficha.title =
                jugador.nombre +
                " - casilla " +
                jugador.posicion;


            contenedor.appendChild(
                ficha
            );

        }
    );


    // ----------------------------------------------
    // LISTA DE JUGADORES
    // ----------------------------------------------

    jugadores.innerHTML =
        "";


    if (
        lista.length === 0
    ) {

        jugadores.textContent =
            "No hay jugadores.";

    }


    lista.forEach(
        jugador => {

            const elemento =
                document.createElement(
                    "div"
                );


            elemento.className =
                "jugador";


            if (
                estado.turno ===
                jugador.id
            ) {

                elemento.classList.add(
                    "mi-turno"
                );

            }


            let texto =
                "🎮 " +
                jugador.nombre +
                " — casilla " +
                jugador.posicion;


            if (
                jugador.id ===
                miId
            ) {

                texto +=
                    " ⭐ Tú";

            }


            if (
                estado.turno ===
                jugador.id
            ) {

                texto +=
                    " 🎲";

            }


            elemento.textContent =
                texto;


            jugadores.appendChild(
                elemento
            );

        }
    );


    // ----------------------------------------------
    // TURNO
    // ----------------------------------------------

    const jugadorTurno =
        estado.jugadores[
            estado.turno
        ];


    if (
        jugadorTurno
    ) {

        turnoElemento.textContent =
            jugadorTurno.nombre;

    }

    else {

        turnoElemento.textContent =
            "-";

    }


    // ----------------------------------------------
    // BOTÓN DE DADO
    // ----------------------------------------------

    const esMiTurno =
        estado.turno ===
        miId;


    const hayGanador =
        estado.ganador !== null &&
        estado.ganador !== undefined;


    btnDado.disabled =
        !esMiTurno ||
        hayGanador ||
        !socket ||
        socket.readyState !==
            WebSocket.OPEN;


    // ----------------------------------------------
    // EVENTO
    // ----------------------------------------------

    if (
        estado.ultimo_evento
    ) {

        evento.textContent =
            estado.ultimo_evento;

    }


    // ----------------------------------------------
    // GANADOR
    // ----------------------------------------------

    if (
        estado.ganador
    ) {

        const ganador =
            estado.jugadores[
                estado.ganador
            ];


        if (ganador) {

            evento.textContent =
                "🏆 " +
                ganador.nombre +
                " ha ganado la partida!";

        }

    }

}


// ==========================================================
// DADO
// ==========================================================

function mostrarDado(
    numero
) {

    const dados = {

        1: "⚀",

        2: "⚁",

        3: "⚂",

        4: "⚃",

        5: "⚄",

        6: "⚅"

    };


    dado.textContent =
        dados[numero] ||
        "🎲";

}


// ==========================================================
// ENVIAR
// ==========================================================

function enviar(
    tipo,
    datos = {}
) {

    if (
        !socket ||
        socket.readyState !==
            WebSocket.OPEN
    ) {

        evento.textContent =
            "❌ No estás conectado.";

        return;

    }


    socket.send(
        JSON.stringify({

            tipo:
                tipo,

            ...datos

        })
    );

}


// ==========================================================
// CAMBIAR NOMBRE
// ==========================================================

function cambiarNombre() {

    const input =
        document.getElementById(
            "nombre"
        );


    const nombre =
        input.value.trim();


    if (!nombre) {

        evento.textContent =
            "Escribe un nombre.";

        return;

    }


    enviar(
        "nombre",
        {
            nombre:
                nombre
        }
    );

}


// ==========================================================
// LANZAR DADO
// ==========================================================

function lanzarDado() {

    enviar(
        "lanzar_dado"
    );

}


// ==========================================================
// REINICIAR
// ==========================================================

function reiniciarJuego() {

    enviar(
        "reiniciar"
    );

}


// ==========================================================
// ABANDONAR
// ==========================================================

function abandonar() {

    if (
        confirm(
            "¿Quieres abandonar la partida?"
        )
    ) {

        enviar(
            "abandonar"
        );

    }

}


// ==========================================================
// INICIAR
// ==========================================================

crearTablero();

conectar();


</script>


</body>

</html>

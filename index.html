// ==========================================================
// CREAR TABLERO
// ==========================================================

function crearTablero() {

    tablero.innerHTML = "";


    /*
        Numeración clásica:

        100 99 98 ... 91
        81  82 83 ... 90
        ...
        20  19 18 ... 11
        1   2  3  ... 10
    */


    for (
        let fila = 0;
        fila < 10;
        fila++
    ) {

        const numeros = [];


        const numeroInicial =
            100 -
            fila * 10;


        if (
            fila % 2 === 0
        ) {

            for (
                let n = numeroInicial;
                n > numeroInicial - 10;
                n--
            ) {

                numeros.push(n);

            }

        }

        else {

            for (
                let n =
                    numeroInicial - 9;

                n <= numeroInicial;

                n++
            ) {

                numeros.push(n);

            }

        }


        numeros.forEach(
            numero => {

                const casilla =
                    document.createElement(
                        "div"
                    );

                casilla.className =
                    "casilla";

                casilla.id =
                    "casilla-" +
                    numero;


                const numeroElemento =
                    document.createElement(
                        "div"
                    );

                numeroElemento.className =
                    "numero";

                numeroElemento.textContent =
                    numero;


                casilla.appendChild(
                    numeroElemento
                );


                const fichas =
                    document.createElement(
                        "div"
                    );

                fichas.className =
                    "fichas";

                fichas.id =
                    "fichas-" +
                    numero;


                casilla.appendChild(
                    fichas
                );


                tablero.appendChild(
                    casilla
                );

            }
        );

    }

}


// ==========================================================
// POSICIÓN DE UNA CASILLA
// ==========================================================

function posicionCasilla(
    numero
) {

    /*
        Devuelve coordenadas
        en porcentaje del tablero.

        1  = abajo izquierda
        10 = abajo derecha
        11 = segunda fila derecha
        etc.
    */


    const indice =
        numero - 1;


    const fila =
        Math.floor(
            indice / 10
        );


    let columna =
        indice % 10;


    if (
        fila % 2 === 1
    ) {

        columna =
            9 - columna;

    }


    /*
        SVG:

        x = columna
        y = fila

        Cada casilla ocupa 10%.
    */


    const x =
        columna * 10 + 5;


    const y =
        95 - fila * 10;


    return {
        x: x,
        y: y
    };

}


// ==========================================================
// DIBUJAR ESCALERA
// ==========================================================

function dibujarEscalera(
    desde,
    hasta
) {

    const inicio =
        posicionCasilla(
            desde
        );

    const fin =
        posicionCasilla(
            hasta
        );


    const dx =
        fin.x - inicio.x;

    const dy =
        fin.y - inicio.y;


    const longitud =
        Math.sqrt(
            dx * dx +
            dy * dy
        );


    if (
        longitud === 0
    ) {

        return;

    }


    /*
        Vector perpendicular
    */

    const px =
        -dy / longitud * 1.2;

    const py =
        dx / longitud * 1.2;


    const x1a =
        inicio.x + px;

    const y1a =
        inicio.y + py;


    const x1b =
        inicio.x - px;

    const y1b =
        inicio.y - py;


    const x2a =
        fin.x + px;

    const y2a =
        fin.y + py;


    const x2b =
        fin.x - px;

    const y2b =
        fin.y - py;


    /*
        Lados de la escalera
    */

    crearLinea(
        x1a,
        y1a,
        x2a,
        y2a,
        "escalera"
    );


    crearLinea(
        x1b,
        y1b,
        x2b,
        y2b,
        "escalera"
    );


    /*
        Peldaños
    */

    const cantidad =
        Math.max(
            4,
            Math.floor(
                longitud / 5
            )
        );


    for (
        let i = 1;
        i < cantidad;
        i++
    ) {

        const t =
            i / cantidad;


        const cx =
            inicio.x +
            dx * t;


        const cy =
            inicio.y +
            dy * t;


        crearLinea(
            cx + px,
            cy + py,
            cx - px,
            cy - py,
            "escalon"
        );

    }

}


// ==========================================================
// CREAR LÍNEA SVG
// ==========================================================

function crearLinea(
    x1,
    y1,
    x2,
    y2,
    clase
) {

    const linea =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "line"
        );


    linea.setAttribute(
        "x1",
        x1
    );

    linea.setAttribute(
        "y1",
        y1
    );

    linea.setAttribute(
        "x2",
        x2
    );

    linea.setAttribute(
        "y2",
        y2
    );


    linea.setAttribute(
        "class",
        clase
    );


    elementosJuego.appendChild(
        linea
    );

}


// ==========================================================
// DIBUJAR SERPIENTE
// ==========================================================

function dibujarSerpiente(
    desde,
    hasta
) {

    const inicio =
        posicionCasilla(
            desde
        );

    const fin =
        posicionCasilla(
            hasta
        );


    const dx =
        fin.x - inicio.x;

    const dy =
        fin.y - inicio.y;


    const distancia =
        Math.sqrt(
            dx * dx +
            dy * dy
        );


    /*
        Vector perpendicular
    */

    const px =
        -dy / distancia;

    const py =
        dx / distancia;


    /*
        Curva central
    */

    const amplitud =
        2.5;


    const segmentos =
        Math.max(
            8,
            Math.floor(
                distancia / 4
            )
        );


    let puntos = [];


    for (
        let i = 0;
        i <= segmentos;
        i++
    ) {

        const t =
            i / segmentos;


        const x =
            inicio.x +
            dx * t;


        const y =
            inicio.y +
            dy * t;


        /*
            Onda
        */

        const onda =
            Math.sin(
                t * Math.PI * 3
            ) *
            amplitud *
            (
                0.3 +
                Math.sin(t * Math.PI)
            );


        puntos.push({

            x:
                x +
                px * onda,

            y:
                y +
                py * onda

        });

    }


    let pathData =
        "";


    puntos.forEach(
        (punto, indice) => {

            if (
                indice === 0
            ) {

                pathData +=
                    `M ${punto.x} ${punto.y}`;

            }

            else {

                pathData +=
                    ` L ${punto.x} ${punto.y}`;

            }

        }
    );


    const path =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "path"
        );


    path.setAttribute(
        "d",
        pathData
    );


    path.setAttribute(
        "class",
        "serpiente"
    );


    elementosJuego.appendChild(
        path
    );


    /*
        Cabeza
    */

    const cabeza =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "circle"
        );


    cabeza.setAttribute(
        "cx",
        inicio.x
    );

    cabeza.setAttribute(
        "cy",
        inicio.y
    );

    cabeza.setAttribute(
        "r",
        "2.5"
    );

    cabeza.setAttribute(
        "class",
        "serpiente-cabeza"
    );


    elementosJuego.appendChild(
        cabeza
    );


    /*
        Ojos
    */

    const ojo1 =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "circle"
        );


    ojo1.setAttribute(
        "cx",
        inicio.x - 0.8
    );

    ojo1.setAttribute(
        "cy",
        inicio.y - 0.7
    );

    ojo1.setAttribute(
        "r",
        "0.55"
    );

    ojo1.setAttribute(
        "class",
        "serpiente-ojo"
    );


    elementosJuego.appendChild(
        ojo1
    );


    const ojo2 =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "circle"
        );


    ojo2.setAttribute(
        "cx",
        inicio.x + 0.8
    );

    ojo2.setAttribute(
        "cy",
        inicio.y - 0.7
    );

    ojo2.setAttribute(
        "r",
        "0.55"
    );

    ojo2.setAttribute(
        "class",
        "serpiente-ojo"
    );


    elementosJuego.appendChild(
        ojo2
    );


    /*
        Lengua
    */

    const lengua =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "line"
        );


    lengua.setAttribute(
        "x1",
        inicio.x
    );

    lengua.setAttribute(
        "y1",
        inicio.y - 2
    );

    lengua.setAttribute(
        "x2",
        inicio.x
    );

    lengua.setAttribute(
        "y2",
        inicio.y - 3.5
    );

    lengua.setAttribute(
        "stroke",
        "#dc2626"
    );

    lengua.setAttribute(
        "stroke-width",
        "0.6"
    );


    elementosJuego.appendChild(
        lengua
    );

}

function dibujarElementosJuego() {

    elementosJuego.innerHTML = "";

// ==========================================================
// CONECTAR
// ==========================================================

function conectar() {

    actualizarConexion(
        "CONECTANDO...",
        false
    );


    try {

        socket =
            new WebSocket(
                SERVER_URL
            );


        socket.onopen =
            function() {

                actualizarConexion(
                    "CONECTADO",
                    true
                );


                evento.textContent =
                    "Conectado al servidor.";

            };


        socket.onmessage =
            function(e) {

                try {

                    const mensaje =
                        JSON.parse(
                            e.data
                        );


                    procesarMensaje(
                        mensaje
                    );

                }

                catch(error) {

                    console.error(
                        error
                    );

                }

            };


        socket.onerror =
            function(error) {

                console.error(
                    "WebSocket:",
                    error
                );


                actualizarConexion(
                    "ERROR",
                    false
                );

            };


        socket.onclose =
            function() {

                actualizarConexion(
                    "DESCONECTADO",
                    false
                );


                btnDado.disabled =
                    true;


                evento.textContent =
                    "Conexión cerrada. Reconectando...";


                setTimeout(
                    conectar,
                    5000
                );

            };

    }

    catch(error) {

        console.error(
            error
        );

    }

}


// ==========================================================
// CONEXIÓN
// ==========================================================

function actualizarConexion(
    texto,
    conectado
) {

    estadoConexion.textContent =
        texto;


    estadoConexion.className =
        conectado
            ? "conectado"
            : "error";

}


// ==========================================================
// PROCESAR MENSAJES
// ==========================================================

function procesarMensaje(
    mensaje
) {

    console.log(
        "Servidor:",
        mensaje
    );


    switch(
        mensaje.tipo
    ) {

        case "conexion":

            miId =
                mensaje.id;


            miIdElemento.textContent =
                miId;


            evento.textContent =
                "Has entrado a la partida.";


            break;


        case "estado":

            estado =
                mensaje;


            renderizar();


            break;


        case "resultado_dado":

            mostrarDado(
                mensaje.dado
            );


            break;


        case "resultado":

            if (
                mensaje.dado
            ) {

                mostrarDado(
                    mensaje.dado
                );

            }

            break;


        case "mensaje":

            evento.textContent =
                mensaje.mensaje || "";


            break;


        case "error":

            evento.textContent =
                "⚠️ " +
                mensaje.mensaje;


            break;


        case "lleno":

            evento.textContent =
                "❌ " +
                mensaje.mensaje;


            actualizarConexion(
                "PARTIDA LLENA",
                false
            );


            break;


        case "reinicio":

            evento.textContent =
                "🔄 " +
                mensaje.mensaje;


            break;

    }

}


// ==========================================================
// RENDERIZAR
// ==========================================================

function renderizar() {

    /*
        Dibujar serpientes y escaleras
    */

    dibujarElementosJuego();


    /*
        Limpiar fichas
    */

    document
        .querySelectorAll(
            ".fichas"
        )
        .forEach(
            elemento => {

                elemento.innerHTML =
                    "";

            }
        );


    /*
        Jugadores
    */

    const lista =
        Object.values(
            estado.jugadores || {}
        );


    lista.forEach(
        (jugador, indice) => {

            let posicion =
                jugador.posicion;


            /*
                Si está en 0,
                lo colocamos visualmente
                en la casilla 1.
            */

            if (
                posicion < 1
            ) {

                posicion = 1;

            }


            if (
                posicion > 100
            ) {

                posicion = 100;

            }


            const contenedor =
                document.getElementById(
                    "fichas-" +
                    posicion
                );


            if (!contenedor) {

                return;

            }


            const ficha =
                document.createElement(
                    "div"
                );


            ficha.className =
                "ficha ficha" +
                (
                    (indice % 4) + 1
                );


            ficha.textContent =
                jugador.nombre
                    .substring(
                        0,
                        1
                    )
                    .toUpperCase();


            ficha.title =
                jugador.nombre +
                " - casilla " +
                jugador.posicion;


            contenedor.appendChild(
                ficha
            );

        }
    );


    /*
        Lista de jugadores
    */

    jugadores.innerHTML = "";


    if (
        lista.length === 0
    ) {

        jugadores.textContent =
            "No hay jugadores.";

    }


    lista.forEach(
        jugador => {

            const elemento =
                document.createElement(
                    "div"
                );


            elemento.className =
                "jugador";


            if (
                estado.turno ===
                jugador.id
            ) {

                elemento.classList.add(
                    "mi-turno"
                );

            }


            let texto =
                "🎮 " +
                jugador.nombre +
                " — casilla " +
                jugador.posicion;


            if (
                jugador.id ===
                miId
            ) {

                texto +=
                    " ⭐ Tú";

            }


            if (
                estado.turno ===
                jugador.id
            ) {

                texto +=
                    " 🎲";

            }


            elemento.textContent =
                texto;


            jugadores.appendChild(
                elemento
            );

        }
    );


    /*
        Turno
    */

    const jugadorTurno =
        estado.jugadores[
            estado.turno
        ];


    if (
        jugadorTurno
    ) {

        turnoElemento.textContent =
            jugadorTurno.nombre;

    }

    else {

        turnoElemento.textContent =
            "-";

    }


    /*
        Botón dado
    */

    const esMiTurno =
        estado.turno ===
        miId;


    const hayGanador =
        estado.ganador !== null &&
        estado.ganador !== undefined;


    btnDado.disabled =
        !esMiTurno ||
        hayGanador ||
        !socket ||
        socket.readyState !==
            WebSocket.OPEN;


    /*
        Evento
    */

    if (
        estado.ultimo_evento
    ) {

        evento.textContent =
            estado.ultimo_evento;

    }


    /*
        Ganador
    */

    if (
        estado.ganador
    ) {

        const ganador =
            estado.jugadores[
                estado.ganador
            ];


        if (ganador) {

            evento.textContent =
                "🏆 " +
                ganador.nombre +
                " ha ganado la partida!";

        }

    }

}


// ==========================================================
// MOSTRAR DADO
// ==========================================================

function mostrarDado(
    numero
) {

    const dados = {

        1: "⚀",

        2: "⚁",

        3: "⚂",

        4: "⚃",

        5: "⚄",

        6: "⚅"

    };


    dado.textContent =
        dados[numero] ||
        "🎲";

}


// ==========================================================
// ENVIAR
// ==========================================================

function enviar(
    tipo,
    datos = {}
) {

    if (
        !socket ||
        socket.readyState !==
            WebSocket.OPEN
    ) {

        evento.textContent =
            "❌ No estás conectado.";

        return;

    }


    socket.send(
        JSON.stringify({

            tipo:
                tipo,

            ...datos

        })
    );

}


// ==========================================================
// NOMBRE
// ==========================================================

function cambiarNombre() {

    const input =
        document.getElementById(
            "nombre"
        );


    const nombre =
        input.value.trim();


    if (!nombre) {

        evento.textContent =
            "Escribe un nombre.";

        return;

    }


    enviar(
        "nombre",
        {
            nombre:
                nombre
        }
    );

}


// ==========================================================
// DADO
// ==========================================================

function lanzarDado() {

    enviar(
        "lanzar_dado"
    );

}


// ==========================================================
// REINICIAR
// ==========================================================

function reiniciarJuego() {

    enviar(
        "reiniciar"
    );

}


// ==========================================================
// ABANDONAR
// ==========================================================

function abandonar() {

    if (
        confirm(
            "¿Quieres abandonar la partida?"
        )
    ) {

        enviar(
            "abandonar"
        );

    }

}


// ==========================================================
// INICIO
// ==========================================================

crearTablero();

conectar();

</script>

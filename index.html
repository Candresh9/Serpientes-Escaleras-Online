<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Serpientes y Escaleras Online</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background:
        radial-gradient(circle at top, #263b58, #101722 70%);
    color: white;
    min-height: 100vh;
}

header {
    background: rgba(0,0,0,.25);
    border-bottom: 1px solid rgba(255,255,255,.1);
    padding: 16px 25px;
}

.header-content {
    max-width: 1250px;
    margin: auto;

    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
}

.logo {
    font-size: 25px;
    font-weight: bold;
}

.logo span {
    color: #ffd43b;
}

.connection {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
}

.connection-dot {
    width: 11px;
    height: 11px;
    border-radius: 50%;
    background: #ff4d4d;
}

.connection-dot.online {
    background: #32d583;
    box-shadow: 0 0 12px #32d583;
}

main {
    max-width: 1250px;
    margin: auto;
    padding: 25px;
}

/* =========================
   PANTALLA DE INICIO
========================= */

#pantallaInicio {
    min-height: calc(100vh - 100px);

    display: flex;
    align-items: center;
    justify-content: center;
}

.inicio {
    width: 100%;
    max-width: 650px;

    text-align: center;

    background: rgba(255,255,255,.07);
    border: 1px solid rgba(255,255,255,.12);

    border-radius: 25px;

    padding: 50px 35px;

    box-shadow: 0 20px 60px rgba(0,0,0,.25);
}

.dados-logo {
    font-size: 85px;
    margin-bottom: 15px;
}

.inicio h1 {
    font-size: clamp(38px, 7vw, 65px);
    margin-bottom: 15px;
}

.inicio h1 span {
    color: #ffd43b;
}

.inicio p {
    color: #bdc7d5;
    line-height: 1.6;
    margin-bottom: 30px;
}

.nombre-input {
    width: 100%;
    max-width: 430px;

    padding: 16px 18px;

    border: 2px solid rgba(255,255,255,.15);
    border-radius: 12px;

    background: rgba(0,0,0,.25);
    color: white;

    font-size: 17px;

    outline: none;

    margin-bottom: 15px;
}

.nombre-input:focus {
    border-color: #ffd43b;
}

.btn {
    border: none;
    cursor: pointer;

    padding: 15px 28px;

    border-radius: 12px;

    font-size: 17px;
    font-weight: bold;

    transition: .2s;
}

.btn:hover {
    transform: translateY(-2px);
}

.btn-primary {
    background: #ffd43b;
    color: #171717;

    box-shadow: 0 10px 25px rgba(255,212,59,.2);
}

.btn-primary:hover {
    background: #ffe16b;
}

.btn-danger {
    background: #e5484d;
    color: white;
}

.btn-secondary {
    background: #374151;
    color: white;
}

/* =========================
   JUEGO
========================= */

#pantallaJuego {
    display: none;
}

.game-layout {
    display: grid;

    grid-template-columns:
        minmax(500px, 760px)
        minmax(280px, 350px);

    gap: 25px;

    justify-content: center;
}

/* =========================
   TABLERO
========================= */

.board-container {
    width: 100%;

    background: rgba(0,0,0,.2);

    border-radius: 20px;

    padding: 15px;

    box-shadow: 0 20px 50px rgba(0,0,0,.2);
}

.board {
    position: relative;

    width: 100%;

    aspect-ratio: 1 / 1;

    display: grid;

    grid-template-columns:
        repeat(10, 1fr);

    grid-template-rows:
        repeat(10, 1fr);

    overflow: hidden;

    border-radius: 12px;

    border: 3px solid rgba(255,255,255,.25);
}

.cell {
    position: relative;

    border: 1px solid rgba(0,0,0,.18);

    display: flex;

    align-items: flex-start;
    justify-content: flex-start;

    padding: 5px;

    font-size: clamp(9px, 1.5vw, 14px);

    font-weight: bold;

    color: rgba(0,0,0,.65);
}

.cell:nth-child(odd) {
    background: #f5d58a;
}

.cell:nth-child(even) {
    background: #e9b95e;
}

.cell.start {
    background: #7bd88f !important;
}

.cell.finish {
    background: #ffd43b !important;
}

.cell-number {
    position: absolute;
    top: 3px;
    left: 5px;
}

.special {
    position: absolute;

    inset: 0;

    display: flex;

    align-items: center;
    justify-content: center;

    font-size: clamp(17px, 3vw, 32px);

    opacity: .75;

    pointer-events: none;
}

.player {
    position: absolute;

    width: 25px;
    height: 25px;

    border-radius: 50%;

    border: 3px solid white;

    box-shadow: 0 3px 8px rgba(0,0,0,.5);

    z-index: 10;

    transform: translate(-50%, -50%);
}

.player.p0 {
    background: #e63946;
}

.player.p1 {
    background: #457b9d;
}

.player.p2 {
    background: #2a9d8f;
}

.player.p3 {
    background: #9b5de5;
}

/* =========================
   PANEL
========================= */

.panel {
    background: rgba(255,255,255,.07);

    border:
        1px solid rgba(255,255,255,.1);

    border-radius: 20px;

    padding: 25px;

    height: fit-content;
}

.panel h2 {
    margin-bottom: 20px;
}

.status {
    background: rgba(0,0,0,.22);

    padding: 15px;

    border-radius: 12px;

    margin-bottom: 15px;

    color: #d6deea;

    line-height: 1.5;
}

.turn {
    background: rgba(255,212,59,.12);

    border:
        1px solid rgba(255,212,59,.3);

    padding: 15px;

    border-radius: 12px;

    margin-bottom: 20px;

    text-align: center;
}

.turn strong {
    color: #ffd43b;
}

.players-list {
    display: flex;

    flex-direction: column;

    gap: 10px;

    margin-bottom: 20px;
}

.player-card {
    display: flex;

    align-items: center;

    gap: 10px;

    padding: 12px;

    background: rgba(0,0,0,.2);

    border-radius: 10px;
}

.player-color {
    width: 17px;
    height: 17px;

    border-radius: 50%;

    border: 2px solid white;
}

.dice-area {
    text-align: center;

    padding: 15px 0;
}

.dice {
    font-size: 75px;

    min-height: 100px;

    display: flex;

    justify-content: center;

    align-items: center;
}

.dice-number {
    font-size: 55px;
    font-weight: bold;
}

.btn-dice {
    width: 100%;

    font-size: 19px;

    padding: 17px;
}

.btn-dice:disabled {
    opacity: .45;
    cursor: not-allowed;

    transform: none;
}

.event {
    min-height: 70px;

    margin-top: 20px;

    padding: 13px;

    border-radius: 10px;

    background: rgba(0,0,0,.2);

    color: #cbd5e1;

    font-size: 14px;

    line-height: 1.5;
}

.abandonar {
    width: 100%;

    margin-top: 15px;
}

/* =========================
   GANADOR
========================= */

.winner {
    position: fixed;

    inset: 0;

    background: rgba(0,0,0,.75);

    z-index: 100;

    display: none;

    align-items: center;

    justify-content: center;

    padding: 20px;
}

.winner-box {
    max-width: 500px;
    width: 100%;

    text-align: center;

    background: #182231;

    border:
        1px solid rgba(255,255,255,.15);

    border-radius: 25px;

    padding: 50px 30px;
}

.winner-icon {
    font-size: 80px;

    margin-bottom: 15px;
}

.winner-box h2 {
    font-size: 40px;

    color: #ffd43b;

    margin-bottom: 15px;
}

.winner-box p {
    color: #cbd5e1;

    margin-bottom: 25px;
}

/* =========================
   RESPONSIVE
========================= */

@media (max-width: 950px) {

    .game-layout {
        grid-template-columns: 1fr;

        max-width: 760px;

        margin: auto;
    }

}

@media (max-width: 600px) {

    main {
        padding: 12px;
    }

    header {
        padding: 13px;
    }

    .logo {
        font-size: 19px;
    }

    .board-container {
        padding: 7px;
    }

    .panel {
        padding: 18px;
    }

    .player {
        width: 18px;
        height: 18px;
        border-width: 2px;
    }

}
</style>
</head>

<body>

<header>

    <div class="header-content">

        <div class="logo">
            🎲 Serpientes<span>Escaleras</span>
        </div>

        <div class="connection">

            <div
                id="connectionDot"
                class="connection-dot">
            </div>

            <span id="connectionText">
                Desconectado
            </span>

        </div>

    </div>

</header>


<!-- =====================================
     INICIO
====================================== -->

<section id="pantallaInicio">

    <div class="inicio">

        <div class="dados-logo">
            🐍🎲🪜
        </div>

        <h1>
            Serpientes y
            <span>Escaleras</span>
        </h1>

        <p>
            Juego multijugador online.
            Conéctate desde tu navegador
            y juega con hasta 4 personas.
        </p>

        <input
            id="nombreJugador"
            class="nombre-input"
            type="text"
            maxlength="20"
            placeholder="Escribe tu nombre">

        <br>

        <button
            id="btnEntrar"
            class="btn btn-primary"
            onclick="entrarJuego()">

            🎮 Entrar al juego

        </button>

        <div
            id="errorInicio"
            style="
                color:#ff7777;
                margin-top:15px;
            ">
        </div>

    </div>

</section>


<!-- =====================================
     JUEGO
====================================== -->

<main id="pantallaJuego">

    <div class="game-layout">

        <!-- TABLERO -->

        <div class="board-container">

            <div
                id="board"
                class="board">
            </div>

        </div>


        <!-- PANEL -->

        <aside class="panel">

            <h2>🎮 Partida</h2>

            <div
                id="status"
                class="status">

                Conectando...

            </div>

            <div
                id="turn"
                class="turn">

                Esperando jugadores...

            </div>

            <h3 style="margin-bottom:12px;">
                👥 Jugadores
            </h3>

            <div
                id="playersList"
                class="players-list">
            </div>


            <div class="dice-area">

                <div
                    id="dice"
                    class="dice">

                    🎲

                </div>

                <button
                    id="btnDado"
                    class="btn btn-primary btn-dice"
                    onclick="lanzarDado()"
                    disabled>

                    🎲 Lanzar dado

                </button>

            </div>


            <div
                id="event"
                class="event">

                Esperando conexión...

            </div>


            <button
                class="btn btn-danger abandonar"
                onclick="abandonar()">

                🚪 Abandonar partida

            </button>

        </aside>

    </div>

</main>


<!-- =====================================
     GANADOR
====================================== -->

<div
    id="winner"
    class="winner">

    <div class="winner-box">

        <div class="winner-icon">
            🏆
        </div>

        <h2>
            ¡Ganador!
        </h2>

        <p id="winnerText">
            ¡Has ganado!
        </p>

        <button
            class="btn btn-primary"
            onclick="cerrarGanador()">

            🎮 Seguir

        </button>

    </div>

</div>


<script>

/* ============================================================
   CONFIGURACIÓN
============================================================ */

const SERVER_URL =
    "wss://serpientes-escaleras-phl7.onrender.com";


/* ============================================================
   VARIABLES
============================================================ */

let socket = null;

let miId = null;

let nombre = "";

let estadoJuego = {

    jugadores: {},

    turno: 0,

    ganador: null,

    dado: 1,

    ultimo_dado: 1,

    ultimo_evento: "",

    escaleras: {},

    serpientes: {}

};

let conectado = false;


/* ============================================================
   TABLERO
============================================================ */

const ESCALERAS_DEFAULT = {

    4: 25,
    13: 46,
    33: 49,
    42: 63,
    50: 69,
    62: 81,
    74: 92

};

const SERPIENTES_DEFAULT = {

    27: 5,
    40: 3,
    43: 18,
    54: 31,
    66: 45,
    76: 58,
    89: 53,
    99: 41

};


/* ============================================================
   CREAR TABLERO
============================================================ */

function crearTablero() {

    const board =
        document.getElementById("board");

    board.innerHTML = "";

    /*
       Creamos las casillas 100 → 1
       para producir el patrón clásico
       de serpientes y escaleras.
    */

    for (let fila = 9; fila >= 0; fila--) {

        let inicio = fila * 10 + 1;
        let numeros = [];

        for (let i = 0; i < 10; i++) {

            numeros.push(inicio + i);

        }

        if ((9 - fila) % 2 === 1) {

            numeros.reverse();

        }

        numeros.forEach(numero => {

            const cell =
                document.createElement("div");

            cell.className = "cell";

            cell.dataset.numero = numero;

            if (numero === 1) {

                cell.classList.add("start");

            }

            if (numero === 100) {

                cell.classList.add("finish");

            }

            const numeroTexto =
                document.createElement("span");

            numeroTexto.className =
                "cell-number";

            numeroTexto.textContent =
                numero;

            cell.appendChild(numeroTexto);


            const escaleras =
                estadoJuego.escaleras &&
                Object.keys(estadoJuego.escaleras).length
                    ? estadoJuego.escaleras
                    : ESCALERAS_DEFAULT;

            const serpientes =
                estadoJuego.serpientes &&
                Object.keys(estadoJuego.serpientes).length
                    ? estadoJuego.serpientes
                    : SERPIENTES_DEFAULT;


            if (escaleras[numero]) {

                const icon =
                    document.createElement("div");

                icon.className = "special";

                icon.textContent = "🪜";

                cell.appendChild(icon);

            }

            if (serpientes[numero]) {

                const icon =
                    document.createElement("div");

                icon.className = "special";

                icon.textContent = "🐍";

                cell.appendChild(icon);

            }

            board.appendChild(cell);

        });

    }

    dibujarJugadores();

}


/* ============================================================
   POSICIÓN DE UNA CASILLA
============================================================ */

function obtenerPosicion(numero) {

    numero = Math.max(1, Math.min(100, Number(numero)));

    const indice =
        100 - numero;

    const fila =
        Math.floor(indice / 10);

    let columna =
        indice % 10;

    if (fila % 2 === 1) {

        columna = 9 - columna;

    }

    return {

        fila: fila,
        columna: columna

    };

}


/* ============================================================
   DIBUJAR JUGADORES
============================================================ */

function dibujarJugadores() {

    const board =
        document.getElementById("board");

    board.querySelectorAll(".player").forEach(p => {

        p.remove();

    });


    const jugadores =
        estadoJuego.jugadores || {};


    Object.entries(jugadores).forEach(
        ([id, jugador], indice) => {

            let posicion = 1;

            if (typeof jugador === "object") {

                posicion =
                    jugador.posicion ??
                    jugador.position ??
                    jugador.casilla ??
                    jugador.pos ??
                    1;

            } else {

                posicion =
                    jugador;

            }

            const pos =
                obtenerPosicion(posicion);


            const jugadorElemento =
                document.createElement("div");

            jugadorElemento.className =
                "player p" + (indice % 4);


            /*
               Cada jugador recibe un pequeño
               desplazamiento para que varios
               jugadores puedan verse en la
               misma casilla.
            */

            const desplazamientos = [

                [-18, -18],
                [18, -18],
                [-18, 18],
                [18, 18]

            ];

            const desplazamiento =
                desplazamientos[indice % 4];


            jugadorElemento.style.left =
                `calc(${(pos.columna + .5) * 10}% + ${desplazamiento[0]}px)`;

            jugadorElemento.style.top =
                `calc(${(pos.fila + .5) * 10}% + ${desplazamiento[1]}px)`;


            jugadorElemento.title =
                obtenerNombreJugador(jugador);


            board.appendChild(jugadorElemento);

        }
    );

}


/* ============================================================
   NOMBRE DEL JUGADOR
============================================================ */

function obtenerNombreJugador(jugador) {

    if (!jugador) {

        return "Jugador";

    }

    if (typeof jugador === "string") {

        return jugador;

    }

    return jugador.nombre ||
           jugador.name ||
           "Jugador";

}


/* ============================================================
   ENTRAR
============================================================ */

function entrarJuego() {

    const input =
        document.getElementById("nombreJugador");

    nombre =
        input.value.trim();

    if (!nombre) {

        document.getElementById(
            "errorInicio"
        ).textContent =
            "Escribe tu nombre.";

        return;

    }


    document.getElementById(
        "errorInicio"
    ).textContent = "";


    document.getElementById(
        "btnEntrar"
    ).disabled = true;


    conectarServidor();

}


/* ============================================================
   CONECTAR WEBSOCKET
============================================================ */

function conectarServidor() {

    actualizarConexion(
        false,
        "Conectando..."
    );


    try {

        socket =
            new WebSocket(SERVER_URL);

    }

    catch (error) {

        mostrarError(
            "No se pudo crear la conexión."
        );

        return;

    }


    socket.onopen = function() {

        conectado = true;

        actualizarConexion(
            true,
            "Servidor conectado"
        );


        /*
           Enviamos el nombre del jugador.
           El servidor puede aceptar "nombre"
           o "conexion".
        */

        enviar({

            tipo: "conexion",

            nombre: nombre

        });


        /*
           También enviamos una variante
           compatible con servidores que
           esperan directamente el nombre.
        */

        setTimeout(() => {

            if (
                socket &&
                socket.readyState === WebSocket.OPEN &&
                !miId
            ) {

                enviar({

                    tipo: "nombre",

                    nombre: nombre

                });

            }

        }, 300);

    };


    socket.onmessage = function(event) {

        try {

            const mensaje =
                JSON.parse(event.data);

            procesarMensaje(mensaje);

        }

        catch (error) {

            console.error(
                "Mensaje inválido:",
                event.data
            );

        }

    };


    socket.onerror = function(error) {

        console.error(
            "WebSocket:",
            error
        );

        actualizarConexion(
            false,
            "Error de conexión"
        );

        mostrarError(
            "No se pudo conectar al servidor."
        );

    };


    socket.onclose = function() {

        conectado = false;

        actualizarConexion(
            false,
            "Desconectado"
        );

        document.getElementById(
            "btnDado"
        ).disabled = true;

    };

}


/* ============================================================
   ENVIAR
============================================================ */

function enviar(datos) {

    if (
        !socket ||
        socket.readyState !== WebSocket.OPEN
    ) {

        return false;

    }

    socket.send(
        JSON.stringify(datos)
    );

    return true;

}


/* ============================================================
   PROCESAR MENSAJES
============================================================ */

function procesarMensaje(mensaje) {

    console.log(
        "Servidor:",
        mensaje
    );


    switch (mensaje.tipo) {

        case "asignar_id":

            miId =
                mensaje.id;

            break;


        case "conexion":

            if (mensaje.id !== undefined) {

                miId =
                    mensaje.id;

            }

            actualizarEstado(
                mensaje
            );

            break;


        case "estado":

            actualizarEstado(
                mensaje
            );

            break;


        case "resultado_dado":

        case "resultado":

        case "dado":

            if (
                mensaje.valor !== undefined
            ) {

                estadoJuego.ultimo_dado =
                    mensaje.valor;

                estadoJuego.dado =
                    mensaje.valor;

            }

            if (
                mensaje.dado !== undefined
            ) {

                estadoJuego.ultimo_dado =
                    mensaje.dado;

                estadoJuego.dado =
                    mensaje.dado;

            }

            actualizarEstado(
                mensaje
            );

            break;


        case "mensaje":

            mostrarEvento(
                mensaje.mensaje ||
                mensaje.texto ||
                "Mensaje del servidor."
            );

            break;


        case "error":

            mostrarEvento(
                "❌ " +
                (
                    mensaje.mensaje ||
                    mensaje.error ||
                    "Error del servidor."
                )
            );

            break;


        case "lleno":

            mostrarError(
                "La partida está llena. Máximo 4 jugadores."
            );

            if (socket) {

                socket.close();

            }

            break;


        case "reinicio":

            estadoJuego.ganador =
                null;

            mostrarEvento(
                "🔄 La partida fue reiniciada."
            );

            actualizarInterfaz();

            cerrarGanador();

            break;


        case "servidor_cerrando":

        case "servidor_cerrado":

            mostrarEvento(
                "⚠️ El servidor se está cerrando."
            );

            break;


        default:

            /*
               Algunos servidores pueden enviar
               el estado sin especificar tipo.
            */

            if (
                mensaje.jugadores !== undefined
            ) {

                actualizarEstado(
                    mensaje
                );

            }

            break;

    }

}


/* ============================================================
   ACTUALIZAR ESTADO
============================================================ */

function actualizarEstado(mensaje) {

    if (mensaje.jugadores !== undefined) {

        estadoJuego.jugadores =
            mensaje.jugadores;

    }

    if (mensaje.turno !== undefined) {

        estadoJuego.turno =
            mensaje.turno;

    }

    if (mensaje.ganador !== undefined) {

        estadoJuego.ganador =
            mensaje.ganador;

    }

    if (mensaje.dado !== undefined) {

        estadoJuego.dado =
            mensaje.dado;

        estadoJuego.ultimo_dado =
            mensaje.dado;

    }

    if (mensaje.ultimo_dado !== undefined) {

        estadoJuego.ultimo_dado =
            mensaje.ultimo_dado;

    }

    if (mensaje.ultimo_evento !== undefined) {

        estadoJuego.ultimo_evento =
            mensaje.ultimo_evento;

    }

    if (mensaje.escaleras !== undefined) {

        estadoJuego.escaleras =
            mensaje.escaleras;

    }

    if (mensaje.serpientes !== undefined) {

        estadoJuego.serpientes =
            mensaje.serpientes;

    }

    actualizarInterfaz();

}


/* ============================================================
   ACTUALIZAR INTERFAZ
============================================================ */

function actualizarInterfaz() {

    crearTablero();

    actualizarJugadores();

    actualizarTurno();

    actualizarDado();

    actualizarEvento();

    comprobarGanador();

}


/* ============================================================
   JUGADORES
============================================================ */

function actualizarJugadores() {

    const lista =
        document.getElementById(
            "playersList"
        );

    lista.innerHTML = "";


    const jugadores =
        estadoJuego.jugadores || {};


    Object.entries(jugadores).forEach(
        ([id, jugador], indice) => {

            const tarjeta =
                document.createElement("div");

            tarjeta.className =
                "player-card";


            const color =
                document.createElement("div");

            color.className =
                "player-color";


            const colores = [

                "#e63946",
                "#457b9d",
                "#2a9d8f",
                "#9b5de5"

            ];

            color.style.background =
                colores[indice % 4];


            const texto =
                document.createElement("div");


            const nombreJugador =
                obtenerNombreJugador(
                    jugador
                );


            let posicion = 1;

            if (
                jugador &&
                typeof jugador === "object"
            ) {

                posicion =
                    jugador.posicion ??
                    jugador.position ??
                    jugador.casilla ??
                    jugador.pos ??
                    1;

            }


            texto.innerHTML =
                `<strong>${escapeHTML(nombreJugador)}</strong>
                 <br>
                 <small>Casilla ${posicion}</small>`;


            if (
                String(id) ===
                String(miId)
            ) {

                texto.innerHTML +=
                    ` <small>(Tú)</small>`;

            }


            tarjeta.appendChild(color);

            tarjeta.appendChild(texto);

            lista.appendChild(tarjeta);

        }
    );

}


/* ============================================================
   TURNO
============================================================ */

function actualizarTurno() {

    const elemento =
        document.getElementById(
            "turn"
        );


    const jugadores =
        estadoJuego.jugadores || {};


    let jugadorTurno =
        jugadores[
            estadoJuego.turno
        ];


    if (!jugadorTurno) {

        jugadorTurno =
            jugadores[
                String(estadoJuego.turno)
            ];

    }


    let nombreTurno =
        obtenerNombreJugador(
            jugadorTurno
        );


    if (
        !jugadorTurno &&
        Object.keys(jugadores).length
    ) {

        /*
           Compatibilidad con servidores
           que usan índice en lugar de ID.
        */

        const lista =
            Object.values(jugadores);

        const indice =
            Number(estadoJuego.turno);

        if (
            lista[indice]
        ) {

            nombreTurno =
                obtenerNombreJugador(
                    lista[indice]
                );

        }

    }


    if (nombreTurno === "Jugador") {

        nombreTurno =
            "Esperando jugador";

    }


    const esMiTurno =
        String(estadoJuego.turno) ===
        String(miId);


    if (esMiTurno) {

        elemento.innerHTML =
            "🎯 <strong>¡ES TU TURNO!</strong>";

    }

    else {

        elemento.innerHTML =
            `⏳ Turno de <strong>${escapeHTML(nombreTurno)}</strong>`;

    }


    document.getElementById(
        "btnDado"
    ).disabled =
        !conectado ||
        !esMiTurno ||
        !!estadoJuego.ganador;

}


/* ============================================================
   DADO
============================================================ */

function actualizarDado() {

    const dado =
        Number(
            estadoJuego.ultimo_dado ||
            estadoJuego.dado ||
            1
        );


    const elemento =
        document.getElementById(
            "dice"
        );


    const caras = {

        1: "⚀",
        2: "⚁",
        3: "⚂",
        4: "⚃",
        5: "⚄",
        6: "⚅"

    };


    elemento.textContent =
        caras[dado] || "🎲";

}


/* ============================================================
   LANZAR DADO
============================================================ */

function lanzarDado() {

    const boton =
        document.getElementById(
            "btnDado"
        );


    if (boton.disabled) {

        return;

    }


    boton.disabled = true;


    /*
       El servidor acepta "lanzar_dado".
    */

    enviar({

        tipo: "lanzar_dado"

    });


    mostrarEvento(
        "🎲 Lanzando el dado..."
    );


    /*
       Reactivar después de unos segundos
       por seguridad.
    */

    setTimeout(() => {

        actualizarTurno();

    }, 1500);

}


/* ============================================================
   ABANDONAR
============================================================ */

function abandonar() {

    const confirmar =
        confirm(
            "¿Quieres abandonar la partida?"
        );


    if (!confirmar) {

        return;

    }


    enviar({

        tipo: "abandonar"

    });


    if (socket) {

        socket.close();

    }


    location.reload();

}


/* ============================================================
   GANADOR
============================================================ */

function comprobarGanador() {

    if (
        estadoJuego.ganador === null ||
        estadoJuego.ganador === undefined
    ) {

        return;

    }


    let ganador =
        estadoJuego.ganador;


    const jugadores =
        estadoJuego.jugadores || {};


    if (
        jugadores[ganador]
    ) {

        ganador =
            obtenerNombreJugador(
                jugadores[ganador]
            );

    }

    else if (
        jugadores[String(ganador)]
    ) {

        ganador =
            obtenerNombreJugador(
                jugadores[String(ganador)]
            );

    }

    else if (
        typeof ganador === "object"
    ) {

        ganador =
            obtenerNombreJugador(
                ganador
            );

    }


    document.getElementById(
        "winnerText"
    ).textContent =
        `🏆 ${ganador} ha ganado la partida.`;


    document.getElementById(
        "winner"
    ).style.display =
        "flex";

}


function cerrarGanador() {

    document.getElementById(
        "winner"
    ).style.display =
        "none";

}


/* ============================================================
   EVENTOS
============================================================ */

function actualizarEvento() {

    if (
        estadoJuego.ultimo_evento
    ) {

        mostrarEvento(
            estadoJuego.ultimo_evento
        );

    }

}


function mostrarEvento(texto) {

    document.getElementById(
        "event"
    ).textContent =
        texto || "";

}


/* ============================================================
   CONEXIÓN
============================================================ */

function actualizarConexion(
    online,
    texto
) {

    const punto =
        document.getElementById(
            "connectionDot"
        );

    const textoElemento =
        document.getElementById(
            "connectionText"
        );


    if (online) {

        punto.classList.add(
            "online"
        );

    }

    else {

        punto.classList.remove(
            "online"
        );

    }


    textoElemento.textContent =
        texto;

}


/* ============================================================
   ERROR
============================================================ */

function mostrarError(texto) {

    document.getElementById(
        "errorInicio"
    ).textContent =
        texto;

    document.getElementById(
        "btnEntrar"
    ).disabled =
        false;

}


/* ============================================================
   SEGURIDAD HTML
============================================================ */

function escapeHTML(texto) {

    return String(texto)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


/* ============================================================
   INICIO
============================================================ */

crearTablero();


/*
   Permitir ENTER para entrar.
*/

document
    .getElementById("nombreJugador")
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter"
            ) {

                entrarJuego();

            }

        }
    );

</script>

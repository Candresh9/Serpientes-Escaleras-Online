<!DOCTYPE html>

<head>
<meta charset="UTF-8">

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    font-family:Arial, Helvetica, sans-serif;
    background:
        radial-gradient(circle at top left,#dff4ff,transparent 35%),
        radial-gradient(circle at bottom right,#ffe5e5,transparent 35%),
        linear-gradient(135deg,#eef7ff,#f7f7f7);
    color:#202020;
    overflow-x:hidden;
}

.app{
    width:min(1450px,96%);
    margin:auto;
    padding:25px 0 40px;
}

.titulo{
    text-align:center;
    font-size:38px;
    font-weight:900;
    margin-bottom:22px;
    text-shadow:0 4px 10px rgba(0,0,0,.15);
}

.juego{
    display:grid;
    grid-template-columns:minmax(600px,1fr) 340px;
    gap:25px;
    align-items:start;
}

/* ============================================================
   TABLERO
   ============================================================ */

.tablero-contenedor{
    background:white;
    border-radius:25px;
    padding:20px;
    box-shadow:
        0 20px 50px rgba(0,0,0,.15),
        inset 0 0 0 1px rgba(0,0,0,.05);
}

#tablero{
    position:relative;
    width:100%;
    aspect-ratio:1/1;
    display:grid;
    grid-template-columns:repeat(10,1fr);
    grid-template-rows:repeat(10,1fr);
    border:5px solid #171717;
    border-radius:18px;
    overflow:hidden;
    background:#fff;
}

.casilla{
    position:relative;
    display:flex;
    justify-content:center;
    align-items:center;
    border:1px solid rgba(0,0,0,.18);
    font-size:15px;
    font-weight:800;
    user-select:none;
}

.casilla:nth-child(odd){
    background:#f4f8ff;
}

.casilla:nth-child(even){
    background:#fff;
}

.numero{
    position:absolute;
    top:5px;
    left:7px;
    font-size:13px;
    opacity:.7;
}

.svg-elementos{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    pointer-events:none;
    z-index:4;
}

.capa-fichas{
    position:absolute;
    inset:0;
    pointer-events:none;
    z-index:10;
}

/* ============================================================
   FICHAS
   ============================================================ */

.pieza{
    position:absolute;
    width:34px;
    height:34px;
    border-radius:50%;
    transform:translate(-50%,-50%);
    border:4px solid white;
    box-shadow:
        0 5px 12px rgba(0,0,0,.35),
        inset 0 2px 4px rgba(255,255,255,.6);
    transition:
        box-shadow .25s,
        transform .25s;
    z-index:20;
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    font-size:13px;
    font-weight:900;
}

.pieza.mia{
    width:40px;
    height:40px;
    border:4px solid #ffd600;
    box-shadow:
        0 0 0 3px rgba(255,214,0,.25),
        0 7px 16px rgba(0,0,0,.4);
}

.pieza.moviendo{
    z-index:50;
    transform:translate(-50%,-50%) scale(1.12);
}

.pieza.rebote{
    animation:reboteFicha .45s ease;
}

@keyframes reboteFicha{
    0%{
        transform:translate(-50%,-50%) scale(1);
    }

    40%{
        transform:translate(-50%,-65%) scale(1.18);
    }

    70%{
        transform:translate(-50%,-45%) scale(.96);
    }

    100%{
        transform:translate(-50%,-50%) scale(1);
    }
}

/* ============================================================
   RESALTADO DE CASILLA
   ============================================================ */

.resaltado-casilla{
    position:absolute;
    width:58px;
    height:58px;
    border-radius:50%;
    border:5px solid #ffd600;
    transform:translate(-50%,-50%);
    pointer-events:none;
    z-index:7;
    animation:resaltarCasilla 1s ease-in-out infinite;
}

@keyframes resaltarCasilla{
    0%,100%{
        opacity:.35;
        transform:translate(-50%,-50%) scale(.9);
    }

    50%{
        opacity:1;
        transform:translate(-50%,-50%) scale(1.12);
    }
}

/* ============================================================
   ESCALERAS Y SERPIENTES
   ============================================================ */

.escalera-activa{
    filter:
        drop-shadow(0 0 6px #00ff66)
        drop-shadow(0 0 12px #00ff66);
    animation:brilloEscalera .7s ease-in-out infinite alternate;
}

@keyframes brilloEscalera{
    from{
        opacity:.7;
    }

    to{
        opacity:1;
    }
}

.serpiente-activa{
    filter:
        drop-shadow(0 0 6px #ff1744)
        drop-shadow(0 0 12px #ff1744);
    animation:brilloSerpiente .7s ease-in-out infinite alternate;
}

@keyframes brilloSerpiente{
    from{
        opacity:.7;
    }

    to{
        opacity:1;
    }
}

/* ============================================================
   PARTICULAS
   ============================================================ */

.particula{

    height:8px;

    pointer-events:none;
    z-index:100;

@keyframes particulaVuelo{
    0%{

        opacity:0;
        transform:

   DADO 3D

.zona-dado{

.dado-escena{

.dado-3d{
    width:80px;

    transform-style:preserve-3d;
    transition:transform .4s cubic-bezier(.2,.8,.2,1);
}

.cara{
    position:absolute;

    height:80px;
    border-radius:15px;

.cara1{

.cara2{
    transform:rotateY(90deg) translateZ(40px);
}

.cara3{
    transform:rotateY(180deg) translateZ(40px);
}

.cara4{
    transform:rotateY(-90deg) translateZ(40px);
}

.cara5{
    transform:rotateX(90deg) translateZ(40px);
}

.cara6{

.puntos{

    }

    50%{

    }

    75%{
        transform:rotateX(45deg) rotateY(30deg) rotateZ(15deg)

    }

    100%{
        transform:rotateX(-20deg) rotateY(-30deg) rotateZ(-5deg)

function dormir(ms){

/* ============================================================
   TABLERO
   ============================================================ */

function crearTablero(){

    tablero
        .querySelectorAll(".casilla")
        .forEach(elemento =>
            elemento.remove()
        );


    for(
        let numero = 1;
        numero <= 100;
        numero++
    ){

        const casilla =
            document.createElement("div");

        casilla.className =
            "casilla";

        casilla.dataset.numero =
            numero;

        const numeroTexto =
            document.createElement("span");

        numeroTexto.className =
            "numero";

        numeroTexto.textContent =
            numero;

        casilla.appendChild(
            numeroTexto
        );

        tablero.insertBefore(
            casilla,
            svgElementos
        );

    }

}


/*
    Convierte número de casilla
    a coordenadas porcentuales.

    El tablero usa zigzag:
    1 -> izquierda abajo
    10 -> derecha abajo
    11 -> derecha segunda fila
    etc.
*/

function posicionCasilla(numero){

    numero =
        Math.max(
            1,
            Math.min(
                100,
                Number(numero)
            )
        );

    const indice =
        numero - 1;

    const fila =
        Math.floor(indice / 10);

    const columna =
        indice % 10;

    const filaVisual =
        9 - fila;

    let columnaVisual;

    if(fila % 2 === 0){

        columnaVisual =
            columna;

    }else{

        columnaVisual =
            9 - columna;

    }

    return {

        x:
            columnaVisual * 10 + 5,

        y:
            filaVisual * 10 + 5

    };

}

    const linea =

}


/* ============================================================
   ESCALERAS
   ============================================================ */

function dibujarEscalera(
    desde,
    hasta
){

    const inicio =
        posicionCasilla(desde);

    const final =
        posicionCasilla(hasta);

    const grupo =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "g"
        );

    grupo.dataset.tipo =
        "escalera";

    grupo.dataset.desde =
        desde;

    grupo.dataset.hasta =
        hasta;

    grupo.classList.add(
        "escalera-svg"
    );


    const dx =
        final.x - inicio.x;

    const dy =
        final.y - inicio.y;

    const distancia =
        Math.sqrt(
            dx*dx +
            dy*dy
        );

    if(distancia === 0){
        return grupo;
    }


    const nx =
        -dy / distancia;

    const ny =
        dx / distancia;


    const separacion =
        1.4;


    const rail1 =
        crearLinea(
            inicio.x + nx*separacion,
            inicio.y + ny*separacion,
            final.x + nx*separacion,
            final.y + ny*separacion,
            "#1eaa45",
            1.2
        );


    const rail2 =
        crearLinea(
            inicio.x - nx*separacion,
            inicio.y - ny*separacion,
            final.x - nx*separacion,
            final.y - ny*separacion,
            "#1eaa45",
            1.2
        );


    grupo.appendChild(
        rail1
    );

    grupo.appendChild(
        rail2
    );


    const peldaños = 7;


    for(
        let i=1;
        i<peldaños;
        i++
    ){

        const t =
            i / peldaños;

        const cx =
            inicio.x +
            dx*t;

        const cy =
            inicio.y +
            dy*t;


        const peldaño =
            crearLinea(
                cx + nx*separacion,
                cy + ny*separacion,
                cx - nx*separacion,
                cy - ny*separacion,
                "#26c65b",
                1
            );


        grupo.appendChild(
            peldaño
        );

    }


    svgElementos.appendChild(
        grupo
    );

}


/* ============================================================
   SERPIENTES
   ============================================================ */

function dibujarSerpiente(
    desde,
    hasta
){

    const inicio =
        posicionCasilla(desde);

    const final =
        posicionCasilla(hasta);

    const grupo =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "g"
        );

    grupo.dataset.tipo =
        "serpiente";

    grupo.dataset.desde =
        desde;

    grupo.dataset.hasta =
        hasta;

    grupo.classList.add(
        "serpiente-svg"
    );


    const path =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "path"
        );


    const dx =
        final.x - inicio.x;

    const dy =
        final.y - inicio.y;


    const longitud =
        Math.sqrt(
            dx*dx +
            dy*dy
        );


    const nx =
        -dy / Math.max(
            longitud,
            1
        );

    const ny =
        dx / Math.max(
            longitud,
            1
        );


    const amplitud =
        Math.min(
            6,
            longitud * .25
        );


    const puntos = [];

    const segmentos = 20;


    for(
        let i=0;
        i<=segmentos;
        i++
    ){

        const t =
            i / segmentos;

        const baseX =
            inicio.x +
            dx*t;

        const baseY =
            inicio.y +
            dy*t;

        const onda =
            Math.sin(
                t * Math.PI * 4
            ) *
            amplitud *
            (1 - Math.abs(
                t-.5
            )*.5);

        puntos.push({

            x:
                baseX +
                nx*onda,

            y:
                baseY +
                ny*onda

        });

    }


    let d =
        `M ${puntos[0].x} ${puntos[0].y}`;


    for(
        let i=1;
        i<puntos.length;
        i++
    ){

        d +=
            ` L ${puntos[i].x} ${puntos[i].y}`;

    }


    path.setAttribute(
        "d",
        d
    );

    path.setAttribute(
        "fill",
        "none"
    );

    path.setAttribute(
        "stroke",
        "#d23232"
    );

    path.setAttribute(
        "stroke-width",
        "1.7"
    );

    path.setAttribute(
        "stroke-linecap",
        "round"
    );


    grupo.appendChild(
        path
    );


    /*
        Cabeza
    */

    const cabeza =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "circle"
        );

    cabeza.setAttribute(
        "cx",
        inicio.x
    );

    cabeza.setAttribute(
        "cy",
        inicio.y
    );

    cabeza.setAttribute(
        "r",
        "2"
    );

    cabeza.setAttribute(
        "fill",
        "#c62828"
    );


    grupo.appendChild(
        cabeza
    );


    svgElementos.appendChild(
        grupo
    );

}

){

    if(!jugador){

    }

    if(
        jugador.posicion !== undefined
    ){

        return Number(
            jugador.posicion
        );

    }

    if(
        jugador.casilla !== undefined
    ){

        return Number(

        );

    }

    return 1;

}

/* ============================================================
   MOVIMIENTO SUAVE
   ============================================================ */

function easeInOutCubic(t){

    return t < .5

        ? 4*t*t*t

        : 1 -
          Math.pow(
              -2*t+2,
              3
          ) / 2;

}


function moverElementoSuave(
    id,
    desde,
    hasta,
    duracion=450
){

    return new Promise(resolve => {

        const ficha =
            document.getElementById(
                `pieza-${id}`
            );


        if(!ficha){

            resolve();

            return;

        }


        const inicio =
            posicionCasilla(
                desde
            );

        const final =
            posicionCasilla(
                hasta
            );


        ficha.classList.add(
            "moviendo"
        );


        const tiempoInicio =
            performance.now();


        function animar(
            tiempoActual
        ){

            const progreso =
                Math.min(
                    1,
                    (
                        tiempoActual -
                        tiempoInicio
                    ) / duracion
                );


            const suavizado =
                easeInOutCubic(
                    progreso
                );


            const x =
                inicio.x +
                (
                    final.x -
                    inicio.x
                ) *
                suavizado;


            const y =
                inicio.y +
                (
                    final.y -
                    inicio.y
                ) *
                suavizado;


            ficha.style.left =
                `${x}%`;

            ficha.style.top =
                `${y}%`;


            if(
                progreso < 1
            ){

                requestAnimationFrame(
                    animar
                );

            }else{

                ficha.classList.remove(
                    "moviendo"
                );

                posicionesVisuales[id] =
                    hasta;

                resolve();

            }

        }


        requestAnimationFrame(
            animar
        );

    });

}


/* ============================================================
   MOVER CASILLA POR CASILLA
   ============================================================ */

async function moverFichaPorCasillas(
    id,
    inicio,
    final,
    velocidad=360
){

    if(
        inicio === final
    ){

        await dormir(200);

        return;

    }


    const paso =
        final > inicio
            ? 1
            : -1;


    let actual =
        inicio;


    while(
        actual !== final
    ){

        const siguiente =
            actual + paso;


        await moverElementoSuave(
            id,
            actual,
            siguiente,
            velocidad
        );


        actual =
            siguiente;


        await dormir(80);

    }

}

/* ============================================================
   ANIMACIÓN COMPLETA DEL MOVIMIENTO
   ============================================================ */

async function animarMovimientoJugador(
    id,
    posicionAnterior,
    posicionFinal,
    dado
){

    if(animando){
        return;
    }


    animando = true;

    actualizarBotonDado();


    let inicio =
        Number(
            posicionAnterior
        );


    let final =
        Number(
            posicionFinal
        );


    dado =
        Number(dado) || 0;


    /*
        El movimiento normal que produjo el dado.
    */

    let posicionIntermedia =
        inicio + dado;


    if(
        posicionIntermedia > 100
    ){

        posicionIntermedia =
            100;

    }


    /*
        Si por alguna razón el servidor
        informa una posición diferente,
        siempre respetamos el servidor
        al final.
    */


    await moverFichaPorCasillas(
        id,
        inicio,
        posicionIntermedia,
        360
    );


    await reboteFicha(
        id
    );


    /*
        ESCALERA
    */

    if(
        ESCALERAS[
            posicionIntermedia
        ] !== undefined
    ){

        const destinoEscalera =
            Number(
                ESCALERAS[
                    posicionIntermedia
                ]
            );


        await resaltarCasilla(
            posicionIntermedia,
            900
        );


        await activarEscalera(
            posicionIntermedia,
            destinoEscalera
        );


        await dormir(300);


        await moverElementoSuave(
            id,
            posicionIntermedia,
            destinoEscalera,
            1500
        );


        crearParticulas(
            destinoEscalera,
            40
        );


        await reboteFicha(
            id
        );


        posicionIntermedia =
            destinoEscalera;

    }


    /*
        SERPIENTE
    */

    else if(
        SERPIENTES[
            posicionIntermedia
        ] !== undefined
    ){

        const destinoSerpiente =
            Number(
                SERPIENTES[
                    posicionIntermedia
                ]
            );


        await resaltarCasilla(
            posicionIntermedia,
            900
        );


        await activarSerpiente(
            posicionIntermedia,
            destinoSerpiente
        );


        await dormir(300);


        await moverElementoSuave(
            id,
            posicionIntermedia,
            destinoSerpiente,
            1700
        );


        crearParticulas(
            destinoSerpiente,
            35
        );


        await reboteFicha(
            id
        );


        posicionIntermedia =
            destinoSerpiente;

    }


    /*
        Corrección final usando
        la posición real del servidor.
    */

    if(
        posicionIntermedia !== final
    ){

        await moverElementoSuave(
            id,
            posicionIntermedia,
            final,
            500
        );

    }


    posicionesVisuales[id] =
        final;


    await reboteFicha(
        id
    );


    animando = false;


    actualizarBotonDado();

}


/* ============================================================
   DADO
   ============================================================ */

const ROTACIONES_DADO = {

    1:
        "rotateX(0deg) rotateY(0deg) rotateZ(0deg)",

    2:
        "rotateX(0deg) rotateY(-90deg) rotateZ(0deg)",

    3:
        "rotateX(0deg) rotateY(180deg) rotateZ(0deg)",

    4:
        "rotateX(0deg) rotateY(90deg) rotateZ(0deg)",

    5:
        "rotateX(-90deg) rotateY(0deg) rotateZ(0deg)",

    6:
        "rotateX(90deg) rotateY(0deg) rotateZ(0deg)"

};


function mostrarCaraDado(
    numero
){

    numero =
        Number(numero);


    if(
        !ROTACIONES_DADO[numero]
    ){

        return;

    }


    dado3d.style.transform =
        ROTACIONES_DADO[numero];

}


/* ============================================================
   ANIMAR DADO
   ============================================================ */

async function animarDado(
    resultado
){

    /*
        MUY IMPORTANTE:

        Mientras el dado está girando,
        la ficha NO puede moverse.
    */

    dadoTerminado = false;


    btnDado.disabled = true;


    dado3d.classList.add(
        "lanzando"
    );


    resultadoDado.textContent =
        "🎲 Lanzando...";


    resultadoDado.classList.remove(
        "mensaje-efecto"
    );


    /*
        Animación de lanzamiento
    */

    const rondas = 20;


    for(
        let i=0;
        i<rondas;
        i++
    ){

        const cara =
            1 +
            Math.floor(
                Math.random()*6
            );


        mostrarCaraDado(
            cara
        );


        await dormir(
            100
        );

    }


    /*
        DETENER COMPLETAMENTE
    */

    dado3d.classList.remove(
        "lanzando"
    );


    /*
        Mostrar resultado final
    */

    mostrarCaraDado(
        Number(resultado)
    );


    resultadoDado.textContent =
        `🎲 Salió ${resultado}`;


    resultadoDado.classList.remove(
        "mensaje-efecto"
    );


    void resultadoDado.offsetWidth;


    resultadoDado.classList.add(
        "mensaje-efecto"
    );


    /*
        PAUSA DESPUÉS DE DETENERSE.

        Durante esta pausa la ficha
        tampoco se mueve.
    */

    await dormir(
        900
    );


    /*
        Ahora sí:
        EL DADO TERMINÓ.
    */

    dadoTerminado = true;


    /*
        Si el movimiento llegó mientras
        el dado estaba girando,
        lo ejecutamos ahora.
    */

    if(
        resultadoDadoPendiente
    ){

        const movimiento =
            resultadoDadoPendiente;


        resultadoDadoPendiente =
            null;


        await ejecutarMovimientoPendiente(
            movimiento
        );

    }


    actualizarBotonDado();

}


/* ============================================================
   MOVIMIENTO PENDIENTE
   ============================================================ */

async function ejecutarMovimientoPendiente(
    movimiento
){

    if(
        !movimiento
    ){

        return;

    }


    await animarMovimientoJugador(

        movimiento.id,

        movimiento.anterior,

        movimiento.nuevo,

        movimiento.dado

    );

}


/* ============================================================
   ACTUALIZAR BOTÓN DEL DADO
   ============================================================ */

function actualizarBotonDado(){

    if(!socket){

        btnDado.disabled =
            true;

        return;

    }


    if(
        socket.readyState !==
        WebSocket.OPEN
    ){

        btnDado.disabled =
            true;

        return;

    }


    if(
        animando
    ){

        btnDado.disabled =
            true;

        return;

    }


    if(
        estado.ganador !== null &&
        estado.ganador !== undefined
    ){

        btnDado.disabled =
            true;

        return;

    }


    if(
        estado.mi_id === null ||
        estado.mi_id === undefined
    ){

        btnDado.disabled =
            true;

        return;

    }


    if(
        estado.turno === null ||
        estado.turno === undefined
    ){

        btnDado.disabled =
            true;

        return;

    }


    btnDado.disabled =
        Number(estado.turno) !==
        Number(estado.mi_id);

}


/* ============================================================
   RENDERIZAR JUGADORES
   ============================================================ */

function renderizarJugadores(){

    listaJugadores.innerHTML =
        "";


    const jugadores =
        estado.jugadores || {};


    const ids =
        Object.keys(jugadores)
            .sort(
                (a,b) =>
                    Number(a)-Number(b)
            );


    ids.forEach(id => {

        const jugador =
            jugadores[id];


        const item =
            document.createElement(
                "div"
            );

        item.className =
            "jugador-item";


        if(
            Number(id) ===
            Number(estado.turno)
        ){

            item.classList.add(
                "turno"
            );

        }


        const color =
            document.createElement(
                "div"
            );

        color.className =
            "color-jugador";

        color.style.background =
            obtenerColorJugador(
                jugador,
                id
            );


        const info =
            document.createElement(
                "div"
            );

        info.className =
            "info-jugador";


        const nombre =
            document.createElement(
                "div"
            );

        nombre.className =
            "nombre-jugador";

        nombre.textContent =
            obtenerNombreJugador(
                jugador,
                id
            );


        if(
            Number(id) ===
            Number(estado.mi_id)
        ){

            nombre.textContent +=
                " ⭐";

        }


        const posicion =
            document.createElement(
                "div"
            );

        posicion.className =
            "posicion-jugador";

        posicion.textContent =
            `Casilla ${obtenerPosicionJugador(
                jugador
            )}`;


        info.appendChild(
            nombre
        );

        info.appendChild(
            posicion
        );


        item.appendChild(
            color
        );

        item.appendChild(
            info
        );


        listaJugadores.appendChild(
            item
        );

    });


}


/* ============================================================
   ESTADO DE CONEXIÓN
   ============================================================ */

function actualizarEstadoConexion(){

    if(
        socket &&
        socket.readyState ===
        WebSocket.OPEN
    ){

        estadoConexion.textContent =
            "🟢 Conectado al servidor";

        estadoConexion.style.background =
            "#e8f5e9";

        estadoConexion.style.borderColor =
            "#b7dfb9";

    }else{

        estadoConexion.textContent =

        estadoConexion.style.background =
            "#ffebee";

        estadoConexion.style.borderColor =
            "#ffcdd2";

    }

}


/* ============================================================
   ACTUALIZAR MENSAJE DE TURNO
   ============================================================ */

function actualizarMensajeEstado(){

    if(
        estado.ganador !== null &&
        estado.ganador !== undefined
    ){

        return;

    }


    if(
        estado.turno === null ||
        estado.turno === undefined
    ){

        return;

    }


    const jugadorTurno =
        obtenerJugador(
            estado.jugadores,
            estado.turno
        );


    const nombre =
        obtenerNombreJugador(
            jugadorTurno,
            estado.turno
        );


    if(
        Number(estado.turno) ===
        Number(estado.mi_id)
    ){

    }else{

        estadoConexion.textContent =
            `⏳ Turno de ${nombre}`;

    }

}


/* ============================================================
   MOSTRAR VICTORIA
   ============================================================ */

function mostrarVictoria(
    ganadorId
){

    const jugador =
        obtenerJugador(
            estado.jugadores,
            ganadorId
        );


    const nombre =
        obtenerNombreJugador(

        );


    textoVictoria.textContent =

    );

    );

}


/* ============================================================
   CERRAR VICTORIA
   ============================================================ */

function cerrarVictoria(){

    victoria.classList.remove(
        "visible"
    );

}


/* ============================================================
   WEBSOCKET
   ============================================================ */

function conectar(){

    try{

        estadoConexion.textContent =
            "🔄 Conectando...";


        socket =
            new WebSocket(
                SERVER_URL
            );


        socket.onopen =
            () => {

                console.log(
                    "WebSocket conectado"
                );


                actualizarEstadoConexion();


                /*
                    Ping inicial
                */

                enviar({

                    tipo:
                        "ping"

                });


                actualizarBotonDado();

            };


        socket.onmessage =
            async evento => {

                try{

                    const mensaje =
                        JSON.parse(
                            evento.data
                        );


                    await procesarMensaje(
                        mensaje
                    );


                }catch(error){

                    console.error(
                        "Error procesando mensaje:",
                        error
                    );

                }

            };


        socket.onclose =
            () => {

                console.log(
                    "WebSocket cerrado"
                );


                actualizarEstadoConexion();


                btnDado.disabled =
                    true;


                if(
                    !abandonando
                ){

                    estadoConexion.textContent =
                        "🔴 Conexión perdida";

                }

            };


        socket.onerror =
            error => {

                console.error(
                    "WebSocket error:",
                    error
                );


                estadoConexion.textContent =
                    "❌ Error de conexión";

            };


    }catch(error){

        console.error(
            error
        );

        estadoConexion.textContent =
            "❌ No se pudo conectar";

    }

}


/* ============================================================
   ENVIAR
   ============================================================ */

function enviar(
    datos
){

    if(
        !socket ||
        socket.readyState !==
        WebSocket.OPEN
    ){

        return false;

    }


    socket.send(
        JSON.stringify(
            datos
        )
    );


    return true;

}


/* ============================================================
   PROCESAR MENSAJES
   ============================================================ */

async function procesarMensaje(
    mensaje
){

    console.log(
        "Servidor:",
        mensaje
    );


    const tipo =
        mensaje.tipo;


    /* --------------------------------------------------------
       CONEXIÓN
       -------------------------------------------------------- */

    if(
        tipo === "conexion"
    ){

        estado.mi_id =
            mensaje.jugador_id ??
            mensaje.mi_id ??
            mensaje.id ??
            null;


        if(
            mensaje.estado
        ){

            await recibirEstado(
                mensaje.estado
            );

        }


        actualizarBotonDado();

        return;

    }


    /* --------------------------------------------------------
       ESTADO
       -------------------------------------------------------- */

    if(
        tipo === "estado"
    ){

        await recibirEstado(
            mensaje
        );

        return;

    }


    /* --------------------------------------------------------
       RESULTADO DEL DADO
       -------------------------------------------------------- */

    if(
        tipo === "resultado_dado"
    ){

        const resultado =
            Number(
                mensaje.resultado ??
                mensaje.dado ??
                mensaje.valor
            );


        estado.ultimo_dado =
            resultado;


        await animarDado(
            resultado
        );


        return;

    }


    /* --------------------------------------------------------
       MENSAJE
       -------------------------------------------------------- */

    if(
        tipo === "mensaje"
    ){

        if(
            mensaje.mensaje
        ){

            await mostrarMensaje(
                mensaje.mensaje
            );

        }


        return;

    }


    /* --------------------------------------------------------
       ERROR
       -------------------------------------------------------- */

    if(
        tipo === "error"
    ){

        await mostrarMensaje(
            `⚠️ ${
                mensaje.mensaje ||
                "Ocurrió un error"
            }`
        );


        return;

    }


    /* --------------------------------------------------------
       SERVIDOR LLENO
       -------------------------------------------------------- */

    if(
        tipo === "lleno"
    ){

        estadoConexion.textContent =
            "🚫 Servidor lleno";

        btnDado.disabled =
            true;


        return;

    }


    /* --------------------------------------------------------
       SERVIDOR CERRANDO
       -------------------------------------------------------- */

    if(
        tipo === "servidor_cerrando"
    ){

        estadoConexion.textContent =
            "🔴 Servidor cerrado";

        btnDado.disabled =
            true;


        return;

    }

}


/* ============================================================
   RECIBIR ESTADO
   ============================================================ */

async function recibirEstado(
    nuevoEstado
){

    /*
        Guardamos nuestro ID anterior.

        Esto evita perderlo cuando el servidor
        manda un estado que no contiene mi_id.
    */

    const miIdAnterior =
        estado.mi_id;


    /*
        Detectar posiciones antes del cambio.
    */

    const jugadoresAnteriores =
        estado.jugadores || {};


    const posicionesAnteriores =
        {};


    Object.keys(
        jugadoresAnteriores
    ).forEach(id => {

        posicionesAnteriores[id] =
            obtenerPosicionJugador(
                jugadoresAnteriores[id]
            );

    });


    /*
        Actualizamos estado sin perder mi_id.
    */

    estado = {

        ...estado,

        ...nuevoEstado,

        mi_id:
            nuevoEstado.mi_id ??
            nuevoEstado.jugador_id ??
            nuevoEstado.id ??
            miIdAnterior,

        jugadores:
            nuevoEstado.jugadores ||
            {}

    };


    /*
        Detectar qué jugador cambió.
    */

    let jugadorMovido =
        null;


    const jugadoresNuevos =
        estado.jugadores || {};


    Object.keys(
        jugadoresNuevos
    ).forEach(id => {

        const nuevoJugador =
            jugadoresNuevos[id];


        const nuevaPosicion =
            obtenerPosicionJugador(
                nuevoJugador
            );


        const anterior =
            posicionesAnteriores[id] ??
            posicionesVisuales[id] ??
            nuevaPosicion;


        if(
            anterior !== nuevaPosicion &&
            !jugadorMovido
        ){

            jugadorMovido = {

                id:id,

                anterior:anterior,

                nuevo:nuevaPosicion

            };

        }

    });


    /*
        Render inicial / jugadores.
    */

    renderizarJugadores();


    /*
        Si no estamos animando, actualizamos
        visualmente las fichas que no están
        involucradas en la animación.
    */

    Object.keys(
        jugadoresNuevos
    ).forEach(id => {

        const nuevaPosicion =
            obtenerPosicionJugador(
                jugadoresNuevos[id]
            );


        if(
            !jugadorMovido ||
            String(id) !==
            String(jugadorMovido.id)
        ){

            posicionesVisuales[id] =
                nuevaPosicion;

        }

    });


    if(
        !animando
    ){

        renderizarFichas();

    }


    /*
        ========================================================
        SINCRONIZACIÓN CRÍTICA
        ========================================================

        Si el jugador acaba de lanzar el dado:

        dadoTerminado = false

        Entonces el servidor puede enviar el estado
        antes o durante la animación del dado.

        En ese caso NO movemos inmediatamente la ficha.

        Guardamos el movimiento.
    */

    if(
        jugadorMovido
    ){

        const dado =
            nuevoEstado.ultimo_dado ??
            nuevoEstado.dado ??
            estado.ultimo_dado ??
            estado.dado ??
            0;


        const movimiento = {

            id:
                jugadorMovido.id,

            anterior:
                jugadorMovido.anterior,

            nuevo:
                jugadorMovido.nuevo,

            dado:
                Number(dado)

        };


        if(
            dadoTerminado
        ){

            /*
                El dado ya terminó.
                Podemos mover.
            */

            if(
                !animando
            ){

                await ejecutarMovimientoPendiente(
                    movimiento
                );

            }

        }else{

            /*
                El dado todavía está girando.
            */

            resultadoDadoPendiente =
                movimiento;

        }

    }


    /*
        Victoria.
    */

    if(
        estado.ganador !== null &&
        estado.ganador !== undefined
    ){

        if(
            Number(
                estado.ganador
            ) !==
            Number(
                ultimaPosicionGanador
            )
        ){

            ultimaPosicionGanador =
                estado.ganador;


            await dormir(
                500
            );


            mostrarVictoria(
                estado.ganador
            );

        }

    }else{

        ultimaPosicionGanador =
            null;

        cerrarVictoria();

    }


    actualizarMensajeEstado();

    actualizarBotonDado();

}

   NOMBRE

btnNombre.addEventListener(

nombreInput.addEventListener(

        }

    }
);


/* ============================================================
   LANZAR DADO
   ============================================================ */

btnDado.addEventListener(
    "click",
    () => {

        if(
            animando
        ){

            return;

        }


        if(
            !socket ||
            socket.readyState !==
            WebSocket.OPEN
        ){

            return;

        }


        if(
            estado.mi_id === null ||
            estado.mi_id === undefined
        ){

            return;

        }


        if(
            estado.turno === null ||
            estado.turno === undefined
        ){

            return;

        }


        if(
            Number(estado.turno) !==
            Number(estado.mi_id)
        ){

            return;

        }


        /*
            ====================================================
            MUY IMPORTANTE

            Antes de enviar el lanzamiento:

            el dado todavía NO está terminado.

            Esto evita que un estado del servidor
            recibido rápidamente haga que la ficha
            se mueva antes del dado.
            ====================================================
        */

        dadoTerminado =
            false;


        resultadoDadoPendiente =
            null;


        animando = true;


        btnDado.disabled =
            true;


        const enviado =
            enviar({

                tipo:
                    "lanzar_dado"

            });


        if(
            !enviado
        ){

            animando =
                false;

            dadoTerminado =
                true;

            actualizarBotonDado();

        }

    }
);

   REINICIAR
   ============================================================ */

function reiniciarPartida(){

    cerrarVictoria();


    dadoTerminado =
        true;


    resultadoDadoPendiente =
        null;


    animando =
        false;


    enviar({

        tipo:
            "reiniciar"

    });


    actualizarBotonDado();

}


btnReiniciar.addEventListener(

);


btnVictoriaReiniciar.addEventListener(

/* ============================================================

btnAbandonar.addEventListener(

        ){

            abandonando =

    }
);


/* ============================================================

crearTablero();

dibujarElementos();

renderizarFichas();

renderizarJugadores();

actualizarEstadoConexion();

actualizarBotonDado();

conectar();


/* ============================================================

   ============================================================ */

window.addEventListener(

    () => {

        if(
            socket &&
            socket.readyState ===
            WebSocket.OPEN
        ){

            try{

                socket.close();

            }catch(error){

                console.error(error);

            }

        }

    }
);

</script>

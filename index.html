<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Serpientes y Escaleras Online</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background:
        radial-gradient(circle at top, #ffffff 0%, #e8eef5 45%, #d8e0e8 100%);
    color: #171717;
    min-height: 100vh;
}

.app {
    width: min(1450px, 96vw);
    margin: auto;
    padding: 20px;
}

.titulo {
    text-align: center;
    font-size: clamp(28px, 4vw, 46px);
    font-weight: 900;
    margin-bottom: 20px;
    letter-spacing: 1px;
}

.juego {
    display: grid;
    grid-template-columns: minmax(600px, 1fr) 340px;
    gap: 22px;
    align-items: start;
}

.tablero-contenedor {
    background: rgba(255,255,255,.88);
    border-radius: 24px;
    padding: 18px;
    box-shadow:
        0 20px 50px rgba(0,0,0,.14),
        inset 0 0 0 1px rgba(255,255,255,.8);
}

#tablero {
    width: 100%;
    aspect-ratio: 1 / 1;
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    grid-template-rows: repeat(10, 1fr);
    border: 5px solid #252525;
    border-radius: 14px;
    overflow: hidden;
    background: white;
    position: relative;
}

.casilla {
    position: relative;
    display: flex;
    align-items: flex-start;
    justify-content: flex-start;
    border: 1px solid rgba(0,0,0,.14);
    font-weight: 900;
    font-size: clamp(10px, 1.2vw, 16px);
    padding: 5px;
    overflow: hidden;
}

.casilla:nth-child(odd) {
    background: #fffdf3;
}

.casilla:nth-child(even) {
    background: #edf7ff;
}

.numero {
    position: relative;
    z-index: 2;
    opacity: .75;
}

.pieza-capa {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 20;
}

.tablero-svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 10;
}

.pieza {
    position: absolute;
    width: 38px;
    height: 38px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    border: 4px solid white;

    box-shadow:
        0 5px 8px rgba(0,0,0,.35),
        inset 0 3px 4px rgba(255,255,255,.5);

    z-index: 30;

    /*
       Importante:
       NO usamos transition de left/top.
       El movimiento lo controla JavaScript
       mediante requestAnimationFrame.
    */

    will-change:
        left,
        top,
        transform;

    transition:
        transform .16s cubic-bezier(.2,.8,.2,1),
        filter .16s ease,
        box-shadow .16s ease;
}

.pieza::after {
    content: "";
    position: absolute;
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: rgba(255,255,255,.78);
    left: 7px;
    top: 5px;
    pointer-events: none;
}

.pieza.rebote {
    transform:
        translate(-50%, -64%)
        scale(1.18);

    filter:
        brightness(1.15)
        drop-shadow(0 5px 8px rgba(0,0,0,.3));
}

.pieza.mia {
    border-color: #fff;

    box-shadow:
        0 0 0 3px #222,
        0 8px 15px rgba(0,0,0,.35),
        inset 0 3px 4px rgba(255,255,255,.5);
}

.pieza.moviendo {
    z-index: 50;

    filter:
        brightness(1.08)
        drop-shadow(0 8px 10px rgba(0,0,0,.35));
}

.pieza.salto {
    transform:
        translate(-50%, -75%)
        scale(1.08);
}

.panel {
    background: rgba(255,255,255,.94);
    border-radius: 24px;
    padding: 22px;
    box-shadow: 0 20px 50px rgba(0,0,0,.14);
}

.panel h2 {
    margin: 0 0 15px;
    text-align: center;
    font-size: 25px;
}

.estado {
    padding: 13px;
    background: #f1f4f7;
    border-radius: 12px;
    text-align: center;
    font-weight: 700;
    margin-bottom: 15px;
    min-height: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.nombre-box {
    display: flex;
    gap: 7px;
    margin-bottom: 15px;
}

.nombre-box input {
    min-width: 0;
    flex: 1;
    border: 2px solid #d2d8de;
    border-radius: 10px;
    padding: 10px;
    font-size: 15px;
}

button {
    border: 0;
    border-radius: 11px;
    padding: 12px 15px;
    font-weight: 900;
    cursor: pointer;

    transition:
        transform .12s ease,
        filter .12s ease,
        opacity .12s ease;
}

button:hover {
    filter: brightness(1.06);
}

button:active {
    transform: scale(.96);
}

button:disabled {
    opacity: .45;
    cursor: not-allowed;
}

.btn-nombre {
    background: #252525;
    color: white;
}

.boton-dado {
    width: 100%;
    padding: 15px;
    background:
        linear-gradient(
            135deg,
            #2678ff,
            #1250c9
        );
    color: white;
    font-size: 18px;
    margin-top: 10px;

    box-shadow:
        0 6px 14px rgba(18,80,201,.25);
}

.boton-dado:not(:disabled):hover {
    transform: translateY(-2px);
    box-shadow:
        0 9px 18px rgba(18,80,201,.35);
}

.boton-reinicio {
    width: 100%;
    margin-top: 10px;
    background: #45a866;
    color: white;
}

.boton-abandonar {
    width: 100%;
    margin-top: 10px;
    background: #df4848;
    color: white;
}

.jugadores {
    margin-top: 20px;
}

.jugador {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px;
    border-radius: 10px;
    margin-bottom: 7px;
    background: #f1f3f5;

    transition:
        .25s ease;
}

.jugador.turno {
    background: #fff3c4;

    box-shadow:
        inset 0 0 0 2px #f1c232;

    transform:
        translateX(3px);
}

.punto {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    border: 2px solid white;
    box-shadow: 0 1px 4px rgba(0,0,0,.3);
}

.dado-area {
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 15px 0 20px;
    perspective: 900px;
    min-height: 125px;
}

.dado-3d {
    width: 86px;
    height: 86px;
    position: relative;

    transform-style: preserve-3d;

    /*
       El cubo se moverá mediante
       JavaScript.
    */

    will-change:
        transform;

    transition:
        transform .55s
        cubic-bezier(.18,.89,.32,1.28);
}

.cara {
    position: absolute;

    width: 86px;
    height: 86px;

    background:
        linear-gradient(
            145deg,
            #ffffff 0%,
            #f7f8f9 45%,
            #dfe4e8 100%
        );

    border: 3px solid #202020;
    border-radius: 15px;

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    grid-template-rows:
        repeat(3, 1fr);

    padding: 12px;

    box-shadow:
        inset 0 0 12px rgba(0,0,0,.12),
        0 10px 20px rgba(0,0,0,.2);

    backface-visibility: hidden;
}

.cara::after {
    content: "";

    position: absolute;
    inset: 3px;

    border-radius: 11px;

    pointer-events: none;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.5),
            transparent 45%,
            rgba(0,0,0,.06)
        );
}

.cara-1 {
    transform:
        rotateY(0deg)
        translateZ(43px);
}

.cara-2 {
    transform:
        rotateY(90deg)
        translateZ(43px);
}

.cara-3 {
    transform:
        rotateY(180deg)
        translateZ(43px);
}

.cara-4 {
    transform:
        rotateY(-90deg)
        translateZ(43px);
}

.cara-5 {
    transform:
        rotateX(90deg)
        translateZ(43px);
}

.cara-6 {
    transform:
        rotateX(-90deg)
        translateZ(43px);
}

.punto-dado {
    width: 14px;
    height: 14px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 35% 30%,
            #555 0%,
            #202020 45%,
            #000 100%
        );

    align-self: center;
    justify-self: center;

    box-shadow:
        inset 1px 1px 2px rgba(255,255,255,.3),
        0 1px 2px rgba(0,0,0,.35);

    position: relative;
    z-index: 3;
}

.cara[data-numero="1"] .p1 {
    grid-area: 2 / 2;
}

.cara[data-numero="2"] .p1 {
    grid-area: 1 / 1;
}

.cara[data-numero="2"] .p2 {
    grid-area: 3 / 3;
}

.cara[data-numero="3"] .p1 {
    grid-area: 1 / 1;
}

.cara[data-numero="3"] .p2 {
    grid-area: 2 / 2;
}

.cara[data-numero="3"] .p3 {
    grid-area: 3 / 3;
}

.cara[data-numero="4"] .p1 {
    grid-area: 1 / 1;
}

.cara[data-numero="4"] .p2 {
    grid-area: 1 / 3;
}

.cara[data-numero="4"] .p3 {
    grid-area: 3 / 1;
}

.cara[data-numero="4"] .p4 {
    grid-area: 3 / 3;
}

.cara[data-numero="5"] .p1 {
    grid-area: 1 / 1;
}

.cara[data-numero="5"] .p2 {
    grid-area: 1 / 3;
}

.cara[data-numero="5"] .p3 {
    grid-area: 2 / 2;
}

.cara[data-numero="5"] .p4 {
    grid-area: 3 / 1;
}

.cara[data-numero="5"] .p5 {
    grid-area: 3 / 3;
}

.cara[data-numero="6"] .p1 {
    grid-area: 1 / 1;
}

.cara[data-numero="6"] .p2 {
    grid-area: 1 / 3;
}

.cara[data-numero="6"] .p3 {
    grid-area: 2 / 1;
}

.cara[data-numero="6"] .p4 {
    grid-area: 2 / 3;
}

.cara[data-numero="6"] .p5 {
    grid-area: 3 / 1;
}

.cara[data-numero="6"] .p6 {
    grid-area: 3 / 3;
}


/* ============================================================
   ANIMACIÓN DEL DADO
============================================================ */

.dado-3d.lanzando {
    animation:
        dadoSacudida .12s infinite alternate;
}

@keyframes dadoSacudida {

    0% {
        transform:
            rotateX(-20deg)
            rotateY(-25deg)
            rotateZ(-5deg)
            scale(1);
    }

    50% {
        transform:
            rotateX(25deg)
            rotateY(20deg)
            rotateZ(4deg)
            scale(1.06);
    }

    100% {
        transform:
            rotateX(-18deg)
            rotateY(30deg)
            rotateZ(-4deg)
            scale(1);
    }
}

.dado-3d.resultado {
    animation:
        dadoResultado .5s
        cubic-bezier(.2,1.5,.4,1);
}

@keyframes dadoResultado {

    0% {
        transform:
            scale(.85)
            rotateZ(-10deg);
    }

    55% {
        transform:
            scale(1.18)
            rotateZ(5deg);
    }

    100% {
        transform:
            scale(1)
            rotateZ(0);
    }
}

.resultado-dado {
    text-align: center;
    font-size: 18px;
    font-weight: 900;
    min-height: 27px;

    transition:
        transform .2s ease;
}

.resultado-dado.animando {
    animation:
        textoDado .25s infinite alternate;
}

@keyframes textoDado {

    from {
        transform:
            scale(1);
    }

    to {
        transform:
            scale(1.08);
    }
}


/* ============================================================
   MENSAJE
============================================================ */

.mensaje-efecto {
    position: absolute;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%,-50%)
        scale(.5);

    z-index: 200;

    pointer-events: none;

    opacity: 0;

    font-size:
        clamp(28px,5vw,65px);

    font-weight: 1000;

    text-shadow:
        0 4px 0 white,
        0 7px 12px rgba(0,0,0,.45);

    white-space: nowrap;
}

.mensaje-efecto.mostrar {
    animation:
        efectoTexto 1.1s ease forwards;
}

@keyframes efectoTexto {

    0% {
        opacity: 0;

        transform:
            translate(-50%,-50%)
            scale(.4)
            rotate(-8deg);
    }

    25% {
        opacity: 1;

        transform:
            translate(-50%,-50%)
            scale(1.2)
            rotate(4deg);
    }

    65% {
        opacity: 1;

        transform:
            translate(-50%,-50%)
            scale(1)
            rotate(0deg);
    }

    100% {
        opacity: 0;

        transform:
            translate(-50%,-65%)
            scale(1.15);
    }
}


/* ============================================================
   CASILLA DESTACADA
============================================================ */

.resaltado-casilla {
    animation:
        resaltarCasilla .35s
        ease-in-out 5;
}

@keyframes resaltarCasilla {

    0%,100% {
        filter:
            brightness(1);
    }

    50% {
        filter:
            brightness(1.75)
            saturate(1.35);
    }
}


/* ============================================================
   PARTÍCULAS
============================================================ */

.particula {
    position: absolute;

    width: 9px;
    height: 9px;

    border-radius: 50%;

    pointer-events: none;

    z-index: 100;

    animation:
        particulaVuelo .8s
        cubic-bezier(.2,.8,.2,1)
        forwards;
}

@keyframes particulaVuelo {

    0% {
        opacity: 1;

        transform:
            translate(0,0)
            scale(1.25);
    }

    100% {
        opacity: 0;

        transform:
            translate(var(--dx),var(--dy))
            scale(.05)
            rotate(180deg);
    }
}


/* ============================================================
   EFECTO DE IMPACTO
============================================================ */

.impacto {
    position: absolute;

    width: 45px;
    height: 45px;

    border-radius: 50%;

    border: 4px solid white;

    pointer-events: none;

    z-index: 90;

    animation:
        impacto .7s ease-out
        forwards;
}

@keyframes impacto {

    0% {
        opacity: .9;

        transform:
            translate(-50%,-50%)
            scale(.25);
    }

    70% {
        opacity: .45;

        transform:
            translate(-50%,-50%)
            scale(1.7);
    }

    100% {
        opacity: 0;

        transform:
            translate(-50%,-50%)
            scale(2.3);
    }
}


/* ============================================================
   VICTORIA
============================================================ */

.victoria {
    position: fixed;

    inset: 0;

    background:
        rgba(0,0,0,.65);

    display: none;

    align-items: center;
    justify-content: center;

    z-index: 1000;

    backdrop-filter:
        blur(5px);
}

.victoria.visible {
    display: flex;

    animation:
        aparecer .35s ease;
}

.victoria-card {
    background: white;

    padding: 40px;

    border-radius: 25px;

    text-align: center;

    max-width: 500px;
    width: 90%;

    box-shadow:
        0 30px 80px rgba(0,0,0,.4);

    animation:
        victoriaEntrada .7s
        cubic-bezier(.2,1.5,.4,1);
}

.victoria-trofeo {
    font-size: 80px;

    animation:
        trofeo 1s
        ease-in-out
        infinite alternate;
}

@keyframes victoriaEntrada {

    from {
        transform:
            scale(.3)
            rotate(-8deg);

        opacity: 0;
    }

    to {
        transform:
            scale(1)
            rotate(0);

        opacity: 1;
    }
}

@keyframes trofeo {

    from {
        transform:
            rotate(-8deg)
            scale(1);
    }

    to {
        transform:
            rotate(8deg)
            scale(1.12);
    }
}

@keyframes aparecer {

    from {
        opacity: 0;
    }

    to {
        opacity: 1;
    }
}


/* ============================================================
   ESCALERAS
============================================================ */

.escalera-rail {
    stroke: #18843b;
    stroke-width: 1.8;
    stroke-linecap: round;

    filter:
        drop-shadow(
            0 2px 2px rgba(0,0,0,.3)
        );

    transition:
        stroke-width .25s ease;
}

.escalera-peldaño {
    stroke: #28a94e;
    stroke-width: 1.3;
    stroke-linecap: round;
}

.escalera-brillo {
    stroke: #83ffab;
    stroke-width: 3;
    opacity: 0;
}

.escalera-activa {
    animation:
        escaleraPulso .45s
        infinite alternate;
}

.escalera-activa .escalera-rail,
.escalera-activa .escalera-peldaño {

    animation:
        escaleraBrillo .35s
        infinite alternate;
}

@keyframes escaleraBrillo {

    from {
        filter:
            brightness(1);
    }

    to {
        filter:
            brightness(2)
            drop-shadow(
                0 0 6px #54ff82
            );
    }
}

@keyframes escaleraPulso {

    from {
        transform:
            scale(1);
        transform-origin:
            center;
    }

    to {
        filter:
            drop-shadow(
                0 0 8px
                rgba(84,255,130,.65)
            );
    }
}


/* ============================================================
   SERPIENTES
============================================================ */

.serpiente-cuerpo {
    fill: none;

    stroke: #d32f2f;

    stroke-width: 3.8;

    stroke-linecap: round;
    stroke-linejoin: round;

    filter:
        drop-shadow(
            0 3px 2px rgba(0,0,0,.3)
        );

    transition:
        stroke-width .2s ease;
}

.serpiente-borde {
    fill: none;

    stroke: #8c1717;

    stroke-width: 5.8;

    opacity: .45;
}

.serpiente-activa {
    animation:
        serpienteSacudida .12s
        infinite alternate;
}

.serpiente-activa .serpiente-cuerpo {

    animation:
        serpienteBrillo .3s
        infinite alternate;
}

@keyframes serpienteBrillo {

    from {
        filter:
            brightness(1);
    }

    to {
        filter:
            brightness(1.8)
            drop-shadow(
                0 0 7px #ff4545
            );
    }
}

@keyframes serpienteSacudida {

    from {
        transform:
            translateX(-.3px);
    }

    to {
        transform:
            translateX(.3px);
    }
}


/* ============================================================
   RESPONSIVE
============================================================ */

@media(max-width: 950px) {

    .juego {
        grid-template-columns: 1fr;
    }

    .tablero-contenedor {
        max-width: 760px;
        margin: auto;
        width: 100%;
    }

    .panel {
        max-width: 760px;
        margin: auto;
        width: 100%;
    }
}

@media(max-width: 620px) {

    .app {
        width: 100%;
        padding: 8px;
    }

    .tablero-contenedor {
        padding: 8px;
        border-radius: 15px;
    }

    .panel {
        border-radius: 15px;
        padding: 15px;
    }

    .pieza {
        width: 29px;
        height: 29px;
        border-width: 3px;
    }

    .pieza::after {
        width: 6px;
        height: 6px;
        left: 5px;
        top: 4px;
    }

    .dado-3d,
    .cara {
        width: 70px;
        height: 70px;
    }

    .cara-1 {
        transform:
            rotateY(0deg)
            translateZ(35px);
    }

    .cara-2 {
        transform:
            rotateY(90deg)
            translateZ(35px);
    }

    .cara-3 {
        transform:
            rotateY(180deg)
            translateZ(35px);
    }

    .cara-4 {
        transform:
            rotateY(-90deg)
            translateZ(35px);
    }

    .cara-5 {
        transform:
            rotateX(90deg)
            translateZ(35px);
    }

    .cara-6 {
        transform:
            rotateX(-90deg)
            translateZ(35px);
    }
}

</style>
</head>

<body>

<div class="app">

    <div class="titulo">
        🐍 ESCALERAS Y SERPIENTES 🪜
    </div>

    <div class="juego">

        <div class="tablero-contenedor">

            <div id="tablero">

                <svg
                    id="tableroSvg"
                    class="tablero-svg"
                    viewBox="0 0 100 100"
                    preserveAspectRatio="none">
                </svg>

                <div
                    id="piezaCapa"
                    class="pieza-capa">
                </div>

                <div
                    id="mensajeEfecto"
                    class="mensaje-efecto">
                </div>

            </div>

        </div>


        <div class="panel">

            <h2>🎮 Partida</h2>

            <div
                id="estadoTexto"
                class="estado">
                Conectando al servidor...
            </div>

            <div class="nombre-box">

                <input
                    id="nombreInput"
                    type="text"
                    maxlength="20"
                    placeholder="Tu nombre">

                <button
                    class="btn-nombre"
                    id="btnNombre">
                    OK
                </button>

            </div>


            <div class="dado-area">

                <div
                    id="dado3d"
                    class="dado-3d">

                    <div
                        class="cara cara-1"
                        data-numero="1">

                        <span
                            class="punto-dado p1">
                        </span>

                    </div>


                    <div
                        class="cara cara-2"
                        data-numero="2">

                        <span
                            class="punto-dado p1">
                        </span>

                        <span
                            class="punto-dado p2">
                        </span>

                    </div>


                    <div
                        class="cara cara-3"
                        data-numero="3">

                        <span
                            class="punto-dado p1">
                        </span>

                        <span
                            class="punto-dado p2">
                        </span>

                        <span
                            class="punto-dado p3">
                        </span>

                    </div>


                    <div
                        class="cara cara-4"
                        data-numero="4">

                        <span
                            class="punto-dado p1">

function crearTablero() {

    tablero
        .querySelectorAll(
            ".casilla"
        )
        .forEach(
            e => e.remove()
        );


    for (
        let fila = 0;
        fila < 10;
        fila++
    ) {

        const filaReal =
            9 - fila;

        const izquierdaADerecha =
            filaReal % 2 === 0;


        for (
            let columna = 0;
            columna < 10;
            columna++
        ) {

            let numero;


            if (
                izquierdaADerecha
            ) {

                numero =
                    filaReal * 10 +
                    columna +
                    1;

            } else {

                numero =
                    filaReal * 10 +
                    (9 - columna) +
                    1;
            }


            const casilla =
                document.createElement(
                    "div"
                );

            casilla.className =
                "casilla";

            casilla.dataset.numero =
                numero;


            const numeroTexto =
                document.createElement(
                    "span"
                );

            numeroTexto.className =
                "numero";

            numeroTexto.textContent =
                numero;


            casilla.appendChild(
                numeroTexto
            );


            tablero.appendChild(
                casilla
            );
        }
    }
}


/* ============================================================
   COORDENADAS
============================================================ */

function posicionCasilla(numero) {

    numero =
        Math.max(
            1,
            Math.min(
                100,
                Number(numero)
            )
        );


    const indice =
        numero - 1;


    const fila =
        Math.floor(
            indice / 10
        );


    const columna =
        indice % 10;


    const filaVisual =
        9 - fila;


    let columnaVisual;


    if (
        fila % 2 === 0
    ) {

        columnaVisual =
            columna;

    } else {

        columnaVisual =
            9 - columna;

    }


    return {

        x:
            columnaVisual * 10 + 5,

        y:
            filaVisual * 10 + 5

    };
}


/* ============================================================
   SVG
============================================================ */

function crearSvgElemento(
    tipo,
    atributos = {}
) {

    const elemento =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            tipo
        );


    for (
        const [
            clave,
            valor
        ]
        of Object.entries(
            atributos
        )
    ) {

        elemento.setAttribute(
            clave,
            valor
        );

    }


    return elemento;
}


/* ============================================================
   ESCALERAS
============================================================ */

function dibujarEscalera(
    desde,
    hasta
) {

    const grupo =
        crearSvgElemento(
            "g",
            {

                class:
                    "escalera",

                "data-desde":
                    desde,

                "data-hasta":
                    hasta

            }
        );


    const a =
        posicionCasilla(
            desde
        );

    const b =
        posicionCasilla(
            hasta
        );


    const dx =
        b.x - a.x;

    const dy =
        b.y - a.y;


    const distancia =
        Math.sqrt(
            dx * dx +
            dy * dy
        );


    const nx =
        -dy /
        distancia *
        1.15;

    const ny =
        dx /
        distancia *
        1.15;


    const x1 =
        a.x + nx;

    const y1 =
        a.y + ny;

    const x2 =
        b.x + nx;

    const y2 =
        b.y + ny;

    const x3 =
        a.x - nx;

    const y3 =
        a.y - ny;

    const x4 =
        b.x - nx;

    const y4 =
        b.y - ny;


    const rail1 =
        crearSvgElemento(
            "line",
            {

                x1,
                y1,
                x2,
                y2,

                class:
                    "escalera-rail"

            }
        );


    const rail2 =
        crearSvgElemento(
            "line",
            {

                x1: x3,
                y1: y3,

                x2: x4,
                y2: y4,

                class:
                    "escalera-rail"

            }
        );


    grupo.appendChild(
        rail1
    );

    grupo.appendChild(
        rail2
    );


    const peldaños = 7;


    for (
        let i = 1;
        i < peldaños;
        i++
    ) {

        const t =
            i / peldaños;


        const cx =
            a.x +
            dx * t;

        const cy =
            a.y +
            dy * t;


        const px =
            nx * 1.05;

        const py =
            ny * 1.05;


        const peldaño =
            crearSvgElemento(
                "line",
                {

                    x1:
                        cx - px,

                    y1:
                        cy - py,

                    x2:
                        cx + px,

                    y2:
                        cy + py,

                    class:
                        "escalera-peldaño"

                }
            );


        grupo.appendChild(
            peldaño
        );
    }


    tableroSvg.appendChild(
        grupo
    );
}


/* ============================================================
   SERPIENTES
============================================================ */

function dibujarSerpiente(
    desde,
    hasta
) {

    const grupo =
        crearSvgElemento(
            "g",
            {

                class:
                    "serpiente",

                "data-desde":
                    desde,

                "data-hasta":
                    hasta

            }
        );


    const a =
        posicionCasilla(
            desde
        );

    const b =
        posicionCasilla(
            hasta
        );


    const dx =
        b.x - a.x;

    const dy =
        b.y - a.y;


    const distancia =
        Math.sqrt(
            dx * dx +
            dy * dy
        );


    const nx =
        -dy /
        distancia;

    const ny =
        dx /
        distancia;


    const amplitud =
        Math.min(
            5,
            Math.max(
                2.5,
                distancia * .09
            )
        );


    let path =
        `M ${a.x} ${a.y}`;


    const segmentos = 8;


    for (
        let i = 1;
        i <= segmentos;
        i++
    ) {

        const t =
            i / segmentos;


        const cx =
            a.x +
            dx * t;

        const cy =
            a.y +
            dy * t;


        const onda =
            Math.sin(
                t *
                Math.PI *
                4
            ) *
            amplitud;


        const px =
            cx +
            nx * onda;

        const py =
            cy +
            ny * onda;


        path +=
            ` L ${px} ${py}`;
    }


    const borde =
        crearSvgElemento(
            "path",
            {

                d: path,

                class:
                    "serpiente-borde"

            }
        );


    const cuerpo =
        crearSvgElemento(
            "path",
            {

                d: path,

                class:
                    "serpiente-cuerpo"

            }
        );


    grupo.appendChild(
        borde
    );

    grupo.appendChild(
        cuerpo
    );


    const cabeza =
        crearSvgElemento(
            "circle",
            {

                cx: a.x,

                cy: a.y,

                r: 2.8,

                fill: "#d32f2f",

                stroke: "#721111",

                "stroke-width":
                    0.7

            }
        );


    grupo.appendChild(
        cabeza
    );


    const ojo1 =
        crearSvgElemento(
            "circle",
            {

                cx:
                    a.x - 1,

                cy:
                    a.y - 1,

                r: .45,

                fill:
                    "white"

            }
        );


    const ojo2 =
        crearSvgElemento(
            "circle",
            {

                cx:
                    a.x + 1,

                cy:
                    a.y - 1,

                r: .45,

                fill:
                    "white"

            }
        );


    grupo.appendChild(
        ojo1
    );

    grupo.appendChild(
        ojo2
    );


    tableroSvg.appendChild(
        grupo
    );
}

/* ============================================================
   UTILIDADES ANIMACIÓN
============================================================ */

function dormir(ms) {

    return new Promise(
        resolve =>
            setTimeout(
                resolve,
                ms
            )
    );
}


function easeInOutCubic(t) {

    return t < .5

        ? 4 *
          t *
          t *
          t

        : 1 -
          Math.pow(
              -2 * t + 2,
              3
          ) / 2;
}


function easeOutBack(t) {

    const c1 =
        1.70158;

    const c3 =
        c1 + 1;

    return 1 +
        c3 *
        Math.pow(
            t - 1,
            3
        ) +
        c1 *
        Math.pow(
            t - 1,
            2
        );
}


/* ============================================================
   MOVIMIENTO PRECISO
============================================================ */

function moverElementoSuave(
    id,
    desde,
    hasta,
    duracion = 320
) {

    return new Promise(
        resolve => {

            const pieza =
                document.getElementById(
                    `pieza-${id}`
                );


            if (!pieza) {

                resolve();

                return;
            }


            const inicio =
                posicionCasilla(
                    desde
                );


            const fin =
                posicionCasilla(
                    hasta
                );


            pieza.classList.add(
                "moviendo"
            );


            const inicioTiempo =
                performance.now();


            function frame(
                ahora
            ) {

                const progreso =
                    Math.min(
                        1,
                        (
                            ahora -
                            inicioTiempo
                        )
                        /
                        duracion
                    );


                const suavizado =
                    easeInOutCubic(
                        progreso
                    );


                const x =
                    inicio.x +
                    (
                        fin.x -
                        inicio.x
                    )
                    *
                    suavizado;


                /*
                   Pequeño salto vertical
                   para que la ficha
                   parezca realmente
                   desplazarse.
                */

                const salto =
                    Math.sin(
                        progreso *
                        Math.PI
                    )
                    *
                    1.8;


                const y =
                    inicio.y +
                    (
                        fin.y -
                        inicio.y
                    )
                    *
                    suavizado -
                    salto;


                pieza.style.left =
                    `${x}%`;


                pieza.style.top =
                    `${y}%`;


                /*
                   Pequeña inclinación
                   durante el movimiento.
                */

                const inclinacion =
                    Math.sin(
                        progreso *
                        Math.PI
                    ) *
                    5;


                pieza.style.transform =
                    `translate(-50%, -50%)
                     rotate(${inclinacion}deg)
                     scale(${1 + Math.sin(
                         progreso *
                         Math.PI
                     ) * .035})`;


                if (
                    progreso < 1
                ) {

                    requestAnimationFrame(
                        frame
                    );

                } else {

                    pieza.style.left =
                        `${fin.x}%`;

                    pieza.style.top =
                        `${fin.y}%`;

                    pieza.style.transform =
                        "translate(-50%, -50%)";

                    pieza.classList.remove(
                        "moviendo"
                    );

                    resolve();
                }
            }


            requestAnimationFrame(
                frame
            );
        }
    );
}


/* ============================================================

async function reboteFicha(

) {

    const pieza =
        document.getElementById(

    if (!pieza) {

    pieza.classList.add(

    await dormir(120);


    pieza.classList.remove(

    await dormir(90);
}


/* ============================================================
   MOVIMIENTO CASILLA POR CASILLA
============================================================ */

async function moverFichaPorCasillas(
    id,
    inicio,
    final,
    velocidad = 240
) {

    if (
        final === inicio
    ) {
        return;
    }


    const direccion =
        final > inicio
            ? 1
            : -1;


    const cantidad =
        Math.abs(
            final - inicio
        );


    for (
        let i = 1;
        i <= cantidad;
        i++
    ) {

        const destino =
            inicio +
            i *
            direccion;


        await moverElementoSuave(
            id,

            destino -
            direccion,

            destino,

            velocidad
        );


        posicionesVisuales[id] =
            destino;


        await reboteFicha(
            id
        );
    }
}


/* ============================================================
   MOVIMIENTO ESPECIAL
============================================================ */

async function moverEspecial(
    id,
    desde,
    hasta,
    tipo
) {

    const pieza =
        document.getElementById(
            `pieza-${id}`
        );


    if (!pieza) {
        return;
    }


    const inicio =
        posicionCasilla(
            desde
        );


    const fin =
        posicionCasilla(
            hasta
        );


    const diferenciaX =
        fin.x - inicio.x;

    const diferenciaY =
        fin.y - inicio.y;


    const duracion =
        tipo === "escalera"
            ? 1500
            : 1750;


    const inicioTiempo =
        performance.now();


    pieza.classList.add(
        "moviendo"
    );


    return new Promise(
        resolve => {

            function frame(
                ahora
            ) {

                const progreso =
                    Math.min(
                        1,
                        (
                            ahora -
                            inicioTiempo
                        )
                        /
                        duracion
                    );


                const suave =
                    easeInOutCubic(
                        progreso
                    );


                let x =
                    inicio.x +
                    diferenciaX *
                    suave;


                let y =
                    inicio.y +
                    diferenciaY *
                    suave;


                /*
                   La ficha sube haciendo
                   un pequeño arco.
                */

                const arco =
                    Math.sin(
                        progreso *
                        Math.PI
                    );


                if (
                    tipo ===
                    "escalera"
                ) {

                    y -=
                        arco *
                        2.5;

                } else {

                    /*
                       La serpiente hace
                       una bajada ligeramente
                       ondulada.
                    */

                    x +=
                        Math.sin(
                            progreso *
                            Math.PI *
                            4
                        ) *
                        1.2;
                }


                pieza.style.left =
                    `${x}%`;


                pieza.style.top =
                    `${y}%`;


                const escala =
                    1 +
                    arco *
                    .07;


                pieza.style.transform =
                    `translate(-50%, -50%)
                     scale(${escala})`;


                if (
                    progreso < 1
                ) {

                    requestAnimationFrame(
                        frame
                    );

                } else {

                    pieza.style.left =
                        `${fin.x}%`;

                    pieza.style.top =
                        `${fin.y}%`;

                    pieza.style.transform =
                        "translate(-50%, -50%)";

                    pieza.classList.remove(
                        "moviendo"
                    );

                    resolve();
                }
            }


            requestAnimationFrame(
                frame
            );
        }
    );
}

/* ============================================================
   ANIMACIÓN COMPLETA DEL MOVIMIENTO
============================================================ */

async function animarMovimientoJugador(
    id,
    posicionAnterior,
    posicionFinal,
    dado
) {

    /*
       Si ya hay una animación,
       no empezamos otra encima.
    */

    if (animando) {
        return;
    }


    animando = true;


    btnDado.disabled = true;


    const pieza =
        document.getElementById(
            `pieza-${id}`
        );


    if (pieza) {

        pieza.classList.add(
            "moviendo"
        );
    }


    let posicionIntermedia;


    /*
       El servidor ya realizó
       la escalera/serpiente.

       Nosotros reconstruimos
       primero dónde cayó el dado.
    */

    if (
        dado &&
        dado > 0
    ) {

        const posible =
            posicionAnterior +
            Number(dado);


        if (
            posible > 100
        ) {

            posicionIntermedia =
                posicionAnterior;

        } else {

            posicionIntermedia =
                posible;
        }

    } else {

        posicionIntermedia =
            posicionFinal;
    }


    /*
       MOVIMIENTO NORMAL
    */

    if (
        posicionIntermedia !==
        posicionAnterior
    ) {

        await moverFichaPorCasillas(

            id,

            posicionAnterior,

            posicionIntermedia,

            245

        );
    }


    /*
       ESCALERA
    */

    const destinoEscalera =
        ESCALERAS[
            posicionIntermedia
        ];


    if (
        destinoEscalera &&
        destinoEscalera !==
        posicionIntermedia
    ) {

        resaltarCasilla(
            posicionIntermedia
        );


        activarEscalera(
            posicionIntermedia,
            destinoEscalera
        );


        mostrarMensaje(
            "🪜 ¡ESCALERA!"
        );


        crearImpacto(
            posicionIntermedia
        );


        crearParticulas(
            posicionIntermedia,
            35,
            "#55ef7c",
            "#ffffff"
        );


        await dormir(
            700
        );


        await moverEspecial(

            id,

            posicionIntermedia,

            destinoEscalera,

            "escalera"

        );


        posicionesVisuales[id] =
            destinoEscalera;


        await reboteFicha(
            id
        );


        crearImpacto(
            destinoEscalera
        );


        crearParticulas(
            destinoEscalera,
            40,
            "#55ef7c",
            "#d8ffe3"
        );


        await dormir(
            350
        );
    }


    /*
       SERPIENTE
    */

    const destinoSerpiente =
        SERPIENTES[
            posicionIntermedia
        ];


    if (
        destinoSerpiente &&
        destinoSerpiente !==
        posicionIntermedia
    ) {

        resaltarCasilla(
            posicionIntermedia
        );


        activarSerpiente(
            posicionIntermedia,
            destinoSerpiente
        );


        mostrarMensaje(
            "🐍 ¡SERPIENTE!"
        );


        crearImpacto(
            posicionIntermedia
        );


        crearParticulas(
            posicionIntermedia,
            30,
            "#ff5252",
            "#ffffff"
        );


        await dormir(
            700
        );


        await moverEspecial(

            id,

            posicionIntermedia,

            destinoSerpiente,

            "serpiente"

        );


        posicionesVisuales[id] =
            destinoSerpiente;


        await reboteFicha(
            id
        );


        crearImpacto(
            destinoSerpiente
        );


        crearParticulas(
            destinoSerpiente,
            35,
            "#ff5252",
            "#ffd0d0"
        );


        await dormir(
            350
        );
    }


    /*
       CORRECCIÓN FINAL
    */

    posicionesVisuales[id] =
        posicionFinal;


    const piezaFinal =
        document.getElementById(
            `pieza-${id}`
        );


    if (piezaFinal) {

        const p =
            posicionCasilla(
                posicionFinal
            );


        piezaFinal.style.left =
            `${p.x}%`;


        piezaFinal.style.top =
            `${p.y}%`;


        piezaFinal.style.transform =
            "translate(-50%, -50%)";


        piezaFinal.classList.remove(
            "moviendo"
        );
    }


    animando = false;


    actualizarBotonDado();
}


/* ============================================================
   DADO 3D
============================================================ */

const ROTACIONES_DADO = {

    1:
        "rotateX(0deg) rotateY(0deg) rotateZ(0deg)",

    2:
        "rotateX(0deg) rotateY(-90deg) rotateZ(0deg)",

    3:
        "rotateX(0deg) rotateY(180deg) rotateZ(0deg)",

    4:
        "rotateX(0deg) rotateY(90deg) rotateZ(0deg)",

    5:
        "rotateX(-90deg) rotateY(0deg) rotateZ(0deg)",

    6:
        "rotateX(90deg) rotateY(0deg) rotateZ(0deg)"

};


function mostrarCaraDado(
    numero
) {

    numero =
        Math.max(
            1,
            Math.min(
                6,
                Number(numero)
            )
        );


    dado3d.style.transform =
        ROTACIONES_DADO[
            numero
        ];
}


/*
   Para que el cubo no parezca simplemente
   cambiar de cara, hacemos varias vueltas
   completas antes de llegar al resultado.
*/

function obtenerRotacionAnimada(
    numero
) {

    const vueltasX =
        2 + Math.floor(
            Math.random() * 3
        );

    const vueltasY =
        2 + Math.floor(
            Math.random() * 3
        );

    const base = {

        1:
            [0,0,0],

        2:
            [0,-90,0],

        3:
            [0,180,0],

        4:
            [0,90,0],

        5:
            [-90,0,0],

        6:
            [90,0,0]

    }[numero];


    return `
        rotateX(${base[0] + vueltasX * 360}deg)
        rotateY(${base[1] + vueltasY * 360}deg)
        rotateZ(${base[2]}deg)
    `;
}


async function animarDado(
    resultado
) {

    btnDado.disabled = true;


    dado3d.classList.add(
        "lanzando"
    );


    resultadoDado.classList.add(
        "animando"
    );


    resultadoDado.textContent =
        "🎲 Lanzando...";


    /*
       Primero mostramos distintas caras.
    */

    const caras = [
        1,2,3,4,5,6
    ];


    for (
        let i = 0;
        i < 18;
        i++
    ) {

        const cara =
            caras[
                Math.floor(
                    Math.random() *
                    caras.length
                )
            ];


        /*
           Durante la tirada usamos
           giros rápidos.
        */

        dado3d.style.transition =
            "transform .09s linear";


        const giroX =
            Math.random() * 80 - 40;

        const giroY =
            Math.random() * 80 - 40;

        const giroZ =
            Math.random() * 40 - 20;


        dado3d.style.transform =
            `
            rotateX(${giroX + i * 85}deg)
            rotateY(${giroY + i * 115}deg)
            rotateZ(${giroZ + i * 30}deg)
            `;


        resultadoDado.textContent =
            `🎲 ${cara}`;


        await dormir(
            70 + i * 5
        );
    }


    dado3d.classList.remove(
        "lanzando"
    );


    /*
       Resultado final.
    */

    dado3d.style.transition =
        `
        transform
        .85s
        cubic-bezier(.15,.85,.25,1.25)
        `;


    dado3d.style.transform =
        obtenerRotacionAnimada(
            resultado
        );


    resultadoDado.textContent =
        `🎲 Resultado: ${resultado}`;


    dado3d.classList.remove(
        "resultado"
    );


    void dado3d.offsetWidth;


    dado3d.classList.add(
        "resultado"
    );


    await dormir(
        900
    );


    resultadoDado.classList.remove(
        "animando"
    );


    dado3d.style.transition =
        "transform .35s ease";


    mostrarCaraDado(
        resultado
    );


    actualizarBotonDado();
}

function actualizarBotonDado() {

    if (
        animando ||
        !socket ||
        socket.readyState !==
        WebSocket.OPEN
    ) {

        btnDado.disabled =
            true;

        return;
    }


    btnDado.disabled =
        Number(

        );

function actualizarEstadoTexto() {

    if (!socket) {

        estadoTexto.textContent =
            "🔴 Desconectado";

        return;
    }


    if (
        socket.readyState !==
        WebSocket.OPEN
    ) {

        estadoTexto.textContent =
            "🟠 Conectando...";

        return;
    }


    if (
        estado.ganador
    ) {

        const ganador =
            obtenerJugador(
                estado.jugadores,
                estado.ganador
            );


        estadoTexto.textContent =
            `🏆 Ganó ${
                ganador
                    ? obtenerNombreJugador(
                        ganador,
                        estado.ganador
                    )
                    : `Jugador ${estado.ganador}`
            }`;


        return;
    }


    if (
        Number(
            estado.turno
        ) ===
        Number(
            estado.mi_id
        )
    ) {

        estadoTexto.textContent =
            "🟢 ¡Es tu turno!";

    } else if (
        estado.turno
    ) {

        const jugador =
            obtenerJugador(
                estado.jugadores,
                estado.turno
            );


        estadoTexto.textContent =
            `⏳ Turno de ${
                jugador
                    ? obtenerNombreJugador(
                        jugador,
                        estado.turno
                    )
                    : `Jugador ${estado.turno}`
            }`;

    } else {

        estadoTexto.textContent =
            "Esperando jugadores...";
    }
}

/* ============================================================
   RECIBIR ESTADO
============================================================ */

async function recibirEstado(
    nuevoEstado
) {

    /*
       Guardamos una copia real del
       estado anterior.
    */

    const estadoAnterior = {

        ...estado,

        jugadores:
            estado.jugadores || {}

    };


    const jugadoresNuevos =
        nuevoEstado.jugadores || {};


    const jugadoresAnteriores =
        estadoAnterior.jugadores || {};


    estado =
        nuevoEstado;


    /*
       PRIMERA CARGA
    */

    if (
        Object.keys(
            posicionesVisuales
        ).length === 0
    ) {

        for (
            const [
                id,
                jugador
            ]
            of Object.entries(
                jugadoresNuevos
            )
        ) {

            posicionesVisuales[id] =
                obtenerPosicionJugador(
                    jugador
                );
        }


        renderizarFichas();

        actualizarEstadoTexto();

        actualizarListaJugadores();

        actualizarBotonDado();

        return;
    }


    /*
       Detectamos jugador movido.
    */

    let jugadorMovido =
        null;


    for (
        const [
            id,
            jugadorNuevo
        ]
        of Object.entries(
            jugadoresNuevos
        )
    ) {

        const nuevo =
            obtenerPosicionJugador(
                jugadorNuevo
            );


        const jugadorAnterior =
            obtenerJugador(
                jugadoresAnteriores,
                id
            );


        const anterior =
            posicionesVisuales[id]
            ??
            (
                jugadorAnterior
                    ? obtenerPosicionJugador(
                        jugadorAnterior
                    )
                    : nuevo
            );


        if (
            nuevo !== anterior
        ) {

            jugadorMovido = {

                id,

                anterior,

                nuevo

            };


            break;
        }
    }


    /*
       Actualizamos elementos que
       no necesitan animación.
    */

    renderizarFichas();

    actualizarEstadoTexto();

    actualizarListaJugadores();


    /*
       Si existe movimiento,
       animarlo.
    */

    if (
        jugadorMovido &&
        !animando
    ) {

        const dado =
            nuevoEstado.ultimo_dado
            ??
            nuevoEstado.dado
            ??
            0;


        await animarMovimientoJugador(

            jugadorMovido.id,

            jugadorMovido.anterior,

            jugadorMovido.nuevo,

            Number(dado)

        );
    }


    /*
       Victoria.
    */

    if (
        nuevoEstado.ganador &&
        nuevoEstado.ganador !==
        ultimaPosicionGanador
    ) {

        ultimaPosicionGanador =
            nuevoEstado.ganador;


        mostrarVictoria(
            nuevoEstado.ganador
        );
    }


    actualizarBotonDado();
}

/* ============================================================
   WEBSOCKET
============================================================ */

function conectar() {

    if (
        socket &&
        (
            socket.readyState ===
            WebSocket.OPEN
            ||
            socket.readyState ===
            WebSocket.CONNECTING
        )
    ) {

        return;
    }


    estadoTexto.textContent =
        "🟠 Conectando al servidor...";


    socket =
        new WebSocket(
            SERVER_URL
        );


    socket.onopen = () => {

        estadoTexto.textContent =
            "🟢 Conectado";


        actualizarBotonDado();


        enviar({
            tipo: "ping"
        });
    };


    socket.onmessage =
        async evento => {

            try {

                const mensaje =
                    JSON.parse(
                        evento.data
                    );


                await procesarMensaje(
                    mensaje
                );


            } catch (error) {

                console.error(
                    "Error procesando mensaje:",
                    error
                );
            }
        };


    socket.onerror =
        error => {

            console.error(
                "WebSocket:",
                error
            );


            estadoTexto.textContent =
                "🔴 Error de conexión";
        };


    socket.onclose = () => {

        estadoTexto.textContent =
            "🟠 Conexión cerrada. Reintentando...";


        btnDado.disabled =
            true;


        if (
            !abandonando
        ) {

            setTimeout(
                conectar,
                3000
            );
        }
    };
}


/* ============================================================
   MENSAJES
============================================================ */

async function procesarMensaje(
    mensaje
) {

    switch (
        mensaje.tipo
    ) {

        case "conexion":

            if (
                mensaje.id !==
                undefined
            ) {

                estado.mi_id =
                    mensaje.id;
            }


            if (
                mensaje.jugador_id !==
                undefined
            ) {

                estado.mi_id =
                    mensaje.jugador_id;
            }


            if (
                mensaje.estado
            ) {

                await recibirEstado(
                    mensaje.estado
                );
            }


            actualizarEstadoTexto();

            break;


        case "asignar_id":

            estado.mi_id =
                mensaje.id;

            break;


        case "estado":

            await recibirEstado(
                mensaje.estado ||
                mensaje
            );

            break;


        case "resultado_dado":

            if (
                mensaje.dado !==
                undefined
            ) {

                await animarDado(
                    Number(
                        mensaje.dado
                    )
                );
            }

            break;


        case "resultado":

            if (
                mensaje.dado !==
                undefined
            ) {

                await animarDado(
                    Number(
                        mensaje.dado
                    )
                );
            }

            break;


        case "mensaje":

            estadoTexto.textContent =
                mensaje.mensaje
                ||
                mensaje.texto
                ||
                "Mensaje del servidor.";

            break;


        case "error":

            estadoTexto.textContent =
                `❌ ${
                    mensaje.mensaje
                    ||
                    "Error"
                }`;

            break;


        case "lleno":

            estadoTexto.textContent =
                "❌ El servidor está lleno.";

            break;


        case "servidor_cerrando":

            estadoTexto.textContent =
                "🔴 El servidor está cerrando.";

            break;
    }
}


/* ============================================================
   ENVIAR
============================================================ */

function enviar(
    datos
) {

    if (
        !socket ||
        socket.readyState !==
        WebSocket.OPEN
    ) {

        return false;
    }


    socket.send(
        JSON.stringify(
            datos
        )
    );


    return true;
}

btnDado.addEventListener(

    () => {

        if (
            animando ||
            btnDado.disabled
        ) {

            return;
        }


        btnDado.disabled =
            true;


        resultadoDado.textContent =
            "🎲 Lanzando...";


        enviar({
            tipo:
                "lanzar_dado"
        });
    }
);


/* ============================================================
   NOMBRE
============================================================ */

function cambiarNombre() {

    const nombre =
        nombreInput.value.trim();


    if (!nombre) {
        return;
    }


    enviar({

        tipo:
            "nombre",

        nombre

    });
}


btnNombre.addEventListener(
    "click",
    cambiarNombre
);


nombreInput.addEventListener(
    "keydown",
    evento => {

        if (
            evento.key ===
            "Enter"
        ) {

            cambiarNombre();
        }
    }
);


/* ============================================================
   REINICIAR
============================================================ */

function reiniciarJuego() {

    victoria.classList.remove(
        "visible"
    );


    ultimaPosicionGanador =
        null;


    animando =
        false;


    posicionesVisuales =
        {};


    /*
       Volvemos a la cara 1.
    */

    dado3d.style.transition =
        "transform .4s ease";


    mostrarCaraDado(
        1
    );


    resultadoDado.textContent =
        "🎲 —";


    enviar({

        tipo:
            "reiniciar"

    });
}


btnReinicio.addEventListener(
    "click",
    reiniciarJuego
);


btnReinicioVictoria.addEventListener(
    "click",
    reiniciarJuego
);


/* ============================================================
   ABANDONAR
============================================================ */

btnAbandonar.addEventListener(
    "click",
    () => {

        if (
            !confirm(
                "¿Seguro que quieres abandonar la partida?"
            )
        ) {

            return;
        }


        abandonando =
            true;


        enviar({

            tipo:
                "abandonar"

        });


        if (socket) {

            socket.close();
        }
    }
);


/* ============================================================
   INICIALIZACIÓN
============================================================ */

crearTablero();

dibujarElementos();

mostrarCaraDado(
    1
);

conectar();


/*
   Mantener viva la conexión.
*/

setInterval(
    () => {

        if (
            socket &&
            socket.readyState ===
            WebSocket.OPEN
        ) {

            enviar({

                tipo:
                    "ping"

            });
        }

    },
    15000
);

</script>

</body>
